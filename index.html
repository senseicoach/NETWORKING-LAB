who do I give them? For Canada, my manager at the non-profit?", "Bruno"], ["P", "Yes. And call her first. Never give someone's name without asking. Tell her what the job is, so she knows what to say.", "Nathalia"], ["S", "And for Brazil, my old director. But it's eleven hours of time difference... no, five hours.", "Bruno"], ["P", "Four or five, depending on the season. Send him an email tonight, so he's ready if they call.", "Nathalia"], ["S", "And then what?", "Bruno"], ["P", "Then you wait. And you don't refresh your email every three minutes.", "Nathalia"], ["S", "I'm not refreshing my email every three minutes.", "Bruno"], ["P", "You've refreshed it twice since we started talking.", "Nathalia"]], "words": 261, "kind": "story", "scene": "April, Bruno's kitchen. Bruno reads two emails to Nathalia.", "F": "\"Reading between the lines\" means understanding a message that isn't stated directly. The first email is standard and neutral. The second, a reference request, is a strong positive signal, even though it sounds plain. Always ask permission before giving someone's name as a reference, and tell them about the job.", "V": "", "t": [[2.0, 2.92], [3.27, 4.86], [5.21, 7.57], [7.92, 9.81], [10.16, 12.63], [12.98, 16.68], [17.28, 18.01], [18.36, 19.15], [19.5, 20.65], [21.0, 22.64], [22.99, 24.63], [25.23, 26.14], [26.49, 27.47], [28.07, 29.34], [29.69, 31.06], [31.41, 33.17], [33.77, 36.38], [36.73, 38.64], [38.99, 43.98], [44.33, 48.51], [49.11, 50.14], [50.74, 51.44], [52.04, 53.7], [54.05, 58.27], [58.62, 60.24], [60.84, 61.58], [61.93, 64.09], [64.69, 66.1], [66.45, 68.93], [69.28, 71.27], [71.62, 74.71], [75.06, 77.4], [78.0, 79.59], [79.94, 82.72], [83.32, 84.14], [84.49, 85.97], [86.32, 88.78], [89.13, 92.04], [92.64, 94.83], [95.18, 97.67], [98.02, 99.6], [100.2, 102.55], [102.9, 106.02], [106.62, 107.69], [108.29, 109.47], [109.82, 112.61], [113.21, 116.32], [116.92, 119.81]], "R": [["A friend thinks a neutral email means bad news.", "Bruno", "\"We're meeting a few more candidates.\" It's over.", "Not necessarily. That's a standard email. It just means they haven't decided yet."], ["An employer asks for your references.", "Melissa", "Could you please send us two references?", "Of course. I'll check with them today and send you their contact details by tomorrow."]]}, {"num": 66, "title": "\"If\" Becomes \"When\"", "lines": [["P", "So, how was the morning? Did the OR schedule terrify you?", "Sam"], ["S", "A little. Five surgeries before eleven. But the team was so organized. In Salvador, we were organized too, but louder.", "Juliana"], ["P", "Ha! We're loud on Fridays. Okay, if you join us, the first month would be mostly orientation. You'd be paired with one of our senior nurses.", "Sam"], ["S", "That sounds good. Would it be day shifts at first?", "Juliana"], ["P", "Days for the first month, then a mix. Do you have any questions about the unit?", "Sam"], ["S", "Yes. How do new nurses usually learn the surgeons' preferences? In Brazil, every surgeon has their own way of doing things.", "Juliana"], ["P", "Same here. We have a binder. An actual paper binder, from nineteen ninety-something. Every surgeon has a page. Don't laugh, it's the most important document on the unit.", "Sam"], ["S", "I'm not laughing. In Salvador, we had a notebook exactly like that.", "Juliana"], ["P", "Okay, so when you start, I'll get Andrea to give you the binder tour.", "Sam"], ["S", "Andrea? Andrea from Rio? From my transition program?", "Juliana"], ["P", "She started here in March. She mentioned you, actually. She said you were the calmest person in the program.", "Sam"], ["S", "She's very kind.", "Juliana"], ["P", "And, honestly, the team liked you this morning. You asked good questions, and you didn't pretend to know things you didn't know.", "Sam"], ["S", "Thank you. That means a lot.", "Juliana"], ["P", "Oh, and when you start, bring your own mug. People steal mugs here. It's a crime scene.", "Sam"]], "words": 233, "kind": "story", "scene": "April, the staff room on the surgical unit at St. Brendan's. Juliana's job-shadow day.", "F": "Listen carefully: Sam starts with \"if you join us,\" and later switches to \"when you start.\" That change from \"if\" to \"when\" is a strong positive signal. Other signs: details about orientation, introductions to colleagues, and practical tips like \"bring your own mug.\" The OR is the operating room.", "V": "", "t": [[2.0, 3.45], [3.8, 5.78], [6.38, 7.01], [7.36, 9.04], [9.39, 11.03], [11.38, 14.08], [14.68, 15.17], [15.52, 17.03], [17.38, 20.94], [21.29, 23.5], [24.1, 25.05], [25.4, 26.93], [27.53, 29.57], [29.92, 32.02], [32.62, 33.15], [33.5, 36.81], [37.16, 40.57], [41.17, 41.97], [42.32, 43.32], [43.67, 46.61], [46.96, 48.61], [48.96, 51.98], [52.58, 53.53], [53.88, 56.78], [57.38, 60.94], [61.54, 62.18], [62.53, 63.63], [63.98, 65.52], [66.12, 67.7], [68.05, 69.69], [70.04, 72.56], [73.16, 74.21], [74.81, 77.08], [77.43, 81.16], [81.76, 82.43], [82.78, 83.75], [84.35, 86.53], [86.88, 88.32], [88.67, 89.89]], "R": [["Someone describes what would happen \"if\" you joined their team.", "Sam", "If you join us, the first month would be mostly orientation.", "That sounds great. Would I be paired with someone during that time?"], ["You want to ask a practical question about a new workplace.", "Sam", "Do you have any questions about the unit?", "Yes, how do new nurses usually learn each surgeon's preferences?"]]}, {"num": 67, "title": "Tyler's Good News", "lines": [["S", "Dev! Okay, I know I'm only supposed to call once a month. But this is big.", "Tyler"], ["P", "It's been exactly one month. I'll allow it. What's up?", "Dev"], ["S", "So I went to the career fair at the university. And I talked to three companies. And all three said amazing things.", "Tyler"], ["P", "Okay, that's great. What did they say?", "Dev"], ["S", "The first one said, \"Great to meet you, let's stay in touch.\" The second one said, \"We'll keep your resume on file.\" And the third one said, \"That's an interesting background.\"", "Tyler"], ["P", "Uh-huh.", "Dev"], ["S", "So I'm basically hired. Right? Three companies!", "Tyler"], ["P", "Tyler... can I translate those for you? As a friend?", "Dev"], ["S", "Oh no.", "Tyler"], ["P", "\"Let's stay in touch\" is polite. It's not an offer. \"We'll keep your resume on file\" usually means \"not right now.\" And \"That's an interesting background\" can mean almost anything.", "Dev"], ["S", "So none of them are interested?", "Tyler"], ["P", "I didn't say that. I said those phrases don't tell you. Did any of them ask you for something? Your email, a date, a next step?", "Dev"], ["S", "The third one asked if I'd ever worked in a warehouse. I said yes, two summers. And then she wrote something down.", "Tyler"], ["P", "Okay, see, that one's interesting. She asked for details. Real interest asks for details.", "Dev"], ["S", "Ana says that too.", "Tyler"], ["P", "Ana stole it from me. So, what do you do now?", "Dev"], ["S", "Send her a short message tomorrow? Mention the warehouse thing?", "Tyler"], ["P", "Tyler! That's exactly right. Who are you?", "Dev"], ["S", "I've been practising. I asked three people about their weekends today.", "Tyler"], ["P", "I'm so proud I'm going to burn my dinner.", "Dev"]], "words": 256, "kind": "story", "scene": "April, a phone call. Dev answers while cooking dinner.", "F": "Tyler mistakes polite phrases for offers. Dev translates them: \"Let's stay in touch\" (polite), \"We'll keep your resume on file\" (usually not now), \"That's an interesting background\" (unclear). The real signal is that the third recruiter asked a specific question and took notes. Tyler has improved a lot since script 1.", "V": "", "t": [[2.0, 2.63], [2.98, 6.04], [6.39, 7.69], [8.29, 9.82], [10.17, 10.96], [11.31, 11.97], [12.57, 15.02], [15.37, 17.33], [17.68, 19.78], [20.38, 21.44], [21.79, 22.73], [23.33, 26.15], [26.5, 29.27], [29.62, 32.36], [32.96, 33.53], [34.13, 35.81], [36.16, 36.83], [37.18, 38.41], [39.01, 39.7], [40.05, 41.62], [41.97, 42.73], [43.33, 44.2], [44.8, 46.44], [46.79, 47.8], [48.15, 52.04], [52.39, 55.68], [56.28, 58.07], [58.67, 59.66], [60.01, 61.8], [62.15, 63.79], [64.14, 65.77], [66.37, 69.04], [69.39, 71.05], [71.4, 73.14], [73.74, 75.31], [75.66, 76.84], [77.19, 79.03], [79.63, 81.13], [81.73, 82.92], [83.27, 84.42], [85.02, 87.0], [87.35, 89.01], [89.61, 90.21], [90.56, 91.77], [92.12, 92.86], [93.46, 94.81], [95.16, 97.64], [98.24, 100.48]], "R": [["A friend thinks polite phrases mean they're hired.", "Tyler", "They all said amazing things. So I'm basically hired, right?", "Maybe not yet. Did any of them ask you for something specific, like your email or a next step?"], ["A friend asks what to do after a promising conversation.", "Tyler", "So what should I do now?", "Send her a short message tomorrow, and mention the warehouse experience she asked about."]]}, {"num": 68, "title": "What Kevin Said", "lines": [["S", "So I finally did it. HR approved the offer for Ana this afternoon.", "Kevin"], ["P", "Did they? What changed?", "Michael"], ["S", "She signed up for the safety course the same day I mentioned it. Then she sent me her certificate the day she finished. Two days early. HR couldn't argue with that.", "Kevin"], ["P", "That sounds like her.", "Michael"], ["S", "Ninety-seven percent on the final test, too. The instructor emailed me to ask who she was.", "Kevin"], ["P", "Of course he did. She probably corrected his slides.", "Michael"], ["S", "And then Erin called my director. And Dana mentioned her in a meeting. Three people, without me asking. I've never seen anything like it.", "Kevin"], ["P", "That's what happens when you volunteer for a year and ask good questions.", "Michael"], ["S", "Are you the one who told her to send me the enrolment that same day?", "Kevin"], ["P", "I might have suggested it.", "Michael"], ["S", "I knew it. You've been mentoring her this whole time.", "Kevin"], ["P", "I've been drinking coffee with her this whole time. She did the work.", "Michael"], ["S", "So should I call her tonight?", "Kevin"], ["P", "Tomorrow morning. Let her hear it properly, not at nine p.m. on a Thursday.", "Michael"], ["S", "Fair. HR wants to send the written offer by Monday.", "Kevin"], ["P", "Do me one favour?", "Michael"], ["S", "Sure.", "Kevin"], ["P", "Don't tell her I knew before her.", "Michael"], ["S", "Why not?", "Kevin"], ["P", "Because she'll think I helped get her the job. And I didn't. I just bought some of the coffees.", "Michael"], ["S", "Some of the coffees?", "Kevin"], ["P", "Fine. Most of the coffees. She bought the expensive ones.", "Michael"], ["S", "You're a strange mentor, Michael.", "Kevin"], ["P", "I'm a project director. We're all strange. Cheers.", "Michael"]], "words": 247, "kind": "story", "scene": "April, a pub near the MetroLink site office. Michael and Kevin after work.", "F": "The final \"conversation the newcomer never hears.\" Ana's offer comes from many small things: taking action immediately, three people recommending her without being asked, and a year of volunteering. Michael shows good mentoring: he gives credit to Ana. \"I might have suggested it\" is a modest way of saying \"yes, I did.\"", "V": "", "t": [[2.0, 3.38], [3.73, 6.52], [7.12, 7.83], [8.18, 9.15], [9.75, 12.86], [13.21, 15.78], [16.13, 17.15], [17.5, 19.18], [19.78, 21.0], [21.6, 24.17], [24.52, 27.01], [27.61, 28.81], [29.16, 31.19], [31.79, 33.66], [34.01, 35.93], [36.28, 38.1], [38.45, 40.17], [40.77, 45.24], [45.84, 49.17], [49.77, 51.19], [51.79, 52.54], [52.89, 55.0], [55.6, 58.16], [58.51, 59.61], [60.21, 61.78], [62.38, 63.5], [63.85, 67.67], [68.27, 68.81], [69.16, 71.83], [72.43, 73.66], [74.26, 74.8], [75.4, 77.34], [77.94, 78.72], [79.32, 81.45], [81.8, 82.82], [83.17, 85.06], [85.66, 86.71], [87.31, 87.99], [88.34, 89.66], [90.01, 91.76], [92.36, 94.22], [94.82, 96.32], [96.67, 97.86], [98.21, 98.92]], "R": [["A colleague tells you someone you've helped is getting a job offer.", "Kevin", "HR approved the offer for Ana this afternoon.", "That's wonderful news. She really earned it."], ["Someone suggests you deserve credit for helping.", "Kevin", "You've been mentoring her this whole time.", "I gave her a bit of advice, but she did all the hard work herself."]]}]}, {"part": 9, "title": "Getting There", "desc": "Offers, negotiating, thanking people, and helping the next newcomer.", "scripts": [{"num": 69, "title": "The Offer", "lines": [["P", "Ana, it's Kevin. Do you have a few minutes?", "Kevin"], ["S", "Of course. Good morning, Kevin.", "Ana"], ["P", "Good morning. I'll get straight to it. We'd like to offer you the interface coordinator position.", "Kevin"], ["S", "Oh. Kevin, thank you. That's wonderful news.", "Ana"], ["P", "You earned it. HR will send the written offer on Monday, but I wanted to tell you myself. The salary is ninety-two thousand, plus benefits, and we'd like you to start on May the twentieth.", "Kevin"], ["S", "Thank you. Can I ask a couple of questions before I say yes?", "Ana"], ["P", "Please. I'd be worried if you didn't.", "Kevin"], ["S", "First, you mentioned a clear path to project manager. What would that look like?", "Ana"], ["P", "A review after twelve months. If it goes well, and I expect it will, you'd move to a project manager role on the next phase of the line.", "Kevin"], ["S", "That's great. Second, the salary. Based on my experience on the São Paulo metro, would there be any flexibility? Maybe ninety-six?", "Ana"], ["P", "Hmm. That's a fair question. I can't promise ninety-six, but I'll talk to HR today. Give me until Monday.", "Kevin"], ["S", "Of course. Thank you for asking.", "Ana"], ["P", "And if HR says no?", "Kevin"], ["S", "Then I'll still be very happy to accept. I want this job.", "Ana"], ["P", "Good. I'm glad you told me that. It makes my conversation with HR easier, honestly.", "Kevin"], ["S", "Can I tell my family?", "Ana"], ["P", "Tell everyone. Tell Michael. Actually, I think Michael already...", "Kevin"], ["S", "Michael already knows?", "Ana"], ["P", "I didn't say that. Forget I said that.", "Kevin"], ["S", "Ha! I knew it. Thank you, Kevin. Really.", "Ana"]], "words": 245, "kind": "story", "scene": "April, a phone call, Friday morning. Kevin calls Ana.", "F": "Ana asks questions before accepting, which is normal and professional: \"Can I ask a couple of questions before I say yes?\" She negotiates politely, with a reason and a specific number (\"Based on my experience... maybe ninety-six?\"), and makes it clear she'll accept anyway. \"I'll get straight to it\" means \"I'll tell you directly.\" Kevin breaks his promise to Michael from script 68.", "V": "", "t": [[2.0, 3.23], [3.58, 4.88], [5.48, 6.21], [6.56, 7.72], [8.32, 9.19], [9.54, 10.81], [11.16, 14.08], [14.68, 15.11], [15.46, 16.52], [16.87, 18.08], [18.68, 19.51], [19.86, 23.73], [24.08, 29.26], [29.86, 30.54], [30.89, 33.85], [34.45, 35.15], [35.5, 37.06], [37.66, 40.72], [41.07, 42.17], [42.77, 44.55], [44.9, 50.33], [50.93, 51.74], [52.09, 53.16], [53.51, 58.13], [58.48, 59.64], [60.24, 60.83], [61.18, 62.54], [62.89, 65.97], [66.32, 67.77], [68.37, 69.1], [69.45, 70.61], [71.21, 72.75], [73.35, 75.36], [75.71, 76.78], [77.38, 77.94], [78.29, 79.79], [80.14, 83.14], [83.74, 85.02], [85.62, 86.57], [86.92, 87.76], [88.11, 90.09], [90.69, 91.98], [92.58, 93.68], [94.03, 95.27], [95.87, 96.36], [96.71, 97.38], [97.73, 98.72], [99.07, 99.65]], "R": [["You receive a job offer and want to ask questions first.", "Kevin", "We'd like to offer you the position.", "Thank you, that's wonderful news! Can I ask a couple of questions before I say yes?"], ["You want to ask politely for a higher salary.", "Kevin", "The salary is ninety-two thousand.", "Thank you. Based on my experience, would there be any flexibility? Maybe ninety-six?"]]}, {"num": 70, "title": "Cake in the Meeting Room", "lines": [["P", "So, that's the offer. One-year contract, eighty-four thousand, with the possibility of a permanent role after. What do you think?", "Paul"], ["S", "I think yes. I accept. Thank you, Paul.", "Bruno"], ["P", "Excellent. Welcome to Cascadia. Your forecasting exercise was the best we've seen. Within one point eight percent.", "Paul"], ["S", "I'll try to be within two percent every month. One point eight was luck.", "Bruno"], ["P", "Ha! I'll hold you to two. Okay, there are two people outside who've been waiting very impatiently. Come in!", "Paul"], ["P", "Bruno! Congratulations!", "Hannah"], ["P", "We brought cake. It says \"Welcome Bruno.\" Well, it says \"Welcome Brumo,\" because the bakery made a mistake.", "Raj"], ["S", "Brumo. I'll take it. Thank you, both of you.", "Bruno"], ["P", "We can scrape off the M.", "Raj"], ["P", "We are not scraping the cake, Raj. And don't thank us. I wasn't on the panel. I promise I didn't help.", "Hannah"], ["P", "She didn't. She just mentioned your name in every meeting for six months.", "Paul"], ["P", "Paul!", "Hannah"], ["P", "What? It's true.", "Paul"], ["S", "Hannah, can I say something? Last year, I talked for five minutes about my whole career, and you escaped to find a colleague.", "Bruno"], ["P", "I did. I'm sorry.", "Hannah"], ["S", "Don't be sorry. It was the most useful thing that happened to me. I went home and practised thirty seconds for a whole week.", "Bruno"], ["P", "Thirty seconds and fake numbers. That's how you got here.", "Raj"], ["S", "Very beautiful fake numbers.", "Bruno"], ["P", "Okay, everyone, eat the cake. Bruno, you start on June the second. Bring your planning model. The real one this time.", "Paul"]], "words": 237, "kind": "story", "scene": "May, Cascadia Credit Union head office. Paul has just made Bruno an offer.", "F": "Bruno accepts quickly because the offer matches what he discussed in the HR screen. Listen for the callbacks: \"within two percent,\" the five-minute introduction in script 10, the fake numbers in script 28. \"I'll hold you to two\" means \"I'll expect you to do that.\" The misspelled cake is a small joke: \"Brumo.\"", "V": "", "t": [[2.0, 3.53], [3.88, 9.83], [10.18, 11.25], [11.85, 13.13], [13.48, 14.64], [14.99, 16.25], [16.85, 17.73], [18.08, 20.05], [20.4, 23.97], [24.32, 26.45], [27.05, 29.83], [30.18, 32.05], [32.65, 33.38], [33.73, 35.41], [35.76, 40.42], [40.77, 41.57], [42.17, 42.8], [43.15, 44.31], [44.91, 46.0], [46.35, 48.13], [48.48, 52.04], [52.64, 53.38], [53.73, 54.87], [55.22, 56.94], [57.54, 59.19], [59.79, 61.55], [61.9, 62.91], [63.26, 64.45], [64.8, 66.12], [66.72, 67.66], [68.01, 71.81], [72.41, 72.94], [73.54, 74.18], [74.53, 75.53], [76.13, 77.98], [78.33, 83.6], [84.2, 84.81], [85.16, 85.93], [86.53, 87.82], [88.17, 90.94], [91.29, 94.5], [95.1, 97.07], [97.42, 98.87], [99.47, 101.47], [102.07, 104.49], [104.84, 107.63], [107.98, 109.63], [109.98, 112.07]], "R": [["You receive an offer you're happy with.", "Paul", "That's the offer. What do you think?", "I think yes! I accept. Thank you so much, Paul."], ["Someone who helped you says they didn't do anything.", "Hannah", "Don't thank us. I promise I didn't help.", "Maybe not on the panel, but you gave me the most useful advice I've had since I arrived."]]}, {"num": 71, "title": "Red Seal", "lines": [["P", "Sergio! Well? Did you get the results?", "Miguel"], ["S", "I got the results.", "Sergio"], ["P", "And?", "Miguel"], ["S", "I passed. Eighty-four percent.", "Sergio"], ["P", "Eighty-four! Darren! Darren, come here! Sergio passed the Red Seal!", "Miguel"], ["P", "Yeah? Sergio, that's huge. Congratulations. How do you feel?", "Darren"], ["S", "Honestly? Tired. I studied every night after work for three months. My wife says I talk about the electrical code in my sleep.", "Sergio"], ["P", "That's the sign of a real electrician. Okay, so you know what this means, right?", "Darren"], ["S", "That I can work on my own?", "Sergio"], ["P", "That, and that I'm offering you a full-time journeyman position. Starting next month. The pay goes up, and you'll lead a small crew on the next building.", "Darren"], ["S", "A crew? Already?", "Sergio"], ["P", "You've been here six months. You're never late, you check everything twice, and the apprentices actually listen to you. Miguel listens to you, and he doesn't listen to anyone.", "Darren"], ["P", "That's true. I don't listen to anyone.", "Miguel"], ["P", "And the client noticed your work. They asked who labelled the panels on floor four.", "Darren"], ["S", "Floor four took me two days.", "Sergio"], ["P", "Two days well spent.", "Darren"], ["S", "Darren, thank you. Yes. I accept.", "Sergio"], ["P", "Good. And Sergio, Dev Sharma gave me your name a year ago. Send him a message, would you? Tell him it worked out. He likes hearing that.", "Darren"], ["S", "I'll call him tonight.", "Sergio"], ["P", "And bring something to celebrate on Friday. Not from the food truck.", "Darren"], ["P", "Brazilian cheese bread! Pão de queijo!", "Miguel"], ["S", "My wife makes the best pão de queijo in Goiânia. And now in Burquitlam.", "Sergio"], ["P", "Then it's settled. Friday, cheese bread. And Sergio? Proud of you, man.", "Darren"]], "words": 252, "kind": "story", "scene": "May, the Burquitlam job site, lunch break.", "F": "Sergio's networking started with one name: Dev passed it to Darren (script 34). Darren reminds him to close the loop: \"Send him a message. Tell him it worked out.\" \"Lead a small crew\" means supervise a small team. \"Proud of you, man\" is a warm, informal compliment. Pão de queijo is Brazilian cheese bread.", "V": "", "t": [[2.0, 2.82], [3.17, 3.74], [4.09, 5.49], [6.09, 7.08], [7.68, 8.37], [8.97, 9.67], [10.02, 11.07], [11.67, 12.7], [13.05, 13.76], [14.11, 15.36], [15.71, 17.45], [18.05, 18.8], [19.15, 20.84], [21.19, 22.64], [22.99, 24.1], [24.7, 25.39], [25.74, 26.34], [26.69, 29.36], [29.71, 33.23], [33.83, 36.7], [37.05, 39.53], [40.13, 41.41], [42.01, 46.07], [46.42, 47.9], [48.25, 52.26], [52.86, 53.53], [53.88, 54.56], [55.16, 56.95], [57.3, 62.69], [63.04, 66.62], [67.22, 68.15], [68.5, 70.05], [70.65, 72.65], [73.0, 76.23], [76.83, 78.37], [78.97, 80.73], [81.33, 82.36], [82.71, 83.25], [83.6, 84.34], [84.94, 85.56], [85.91, 89.55], [89.9, 91.92], [92.27, 93.84], [94.19, 95.57], [96.17, 97.29], [97.89, 100.72], [101.07, 102.73], [103.33, 105.05], [105.4, 106.74], [107.34, 110.14], [110.49, 111.75], [112.35, 113.67], [114.02, 115.74], [116.09, 117.22], [117.57, 118.87]], "R": [["Someone asks if you passed an important exam.", "Miguel", "Well? Did you get the results?", "I passed! Eighty-four percent. I can't believe it."], ["A contact asks you to tell the person who recommended you.", "Darren", "Send Dev a message. Tell him it worked out.", "Of course. I'll call him tonight and thank him."]]}, {"num": 72, "title": "Before You Sign", "lines": [["P", "So, you have the written offer. Senior loyalty manager. Any questions before you sign?", "Lauren"], ["S", "Yes, one important question. And I want to be completely honest with you.", "Camila"], ["P", "Okay. Go ahead.", "Lauren"], ["S", "I'm still doing freelance work for Henry's bakeries. Grace's uncle. Six stores. It's about four hours a month now, mostly checking the numbers.", "Camila"], ["P", "Okay. Do you want to keep doing it?", "Lauren"], ["S", "If possible, yes. They trusted me when nobody else did. I don't want to just disappear.", "Camila"], ["P", "I really respect that. Let me think about the conflict-of-interest side. Tidewater sells packaged food. Henry's bakeries sell fresh bread. Are they competitors?", "Lauren"], ["S", "I don't think so. Different products, different customers. But I'd understand if your legal team wants to check.", "Camila"], ["P", "Let me ask HR. Usually, if it's outside work hours and not a competitor, it's fine. You'd just need to declare it.", "Lauren"], ["S", "That's perfect. I'm happy to declare it.", "Camila"], ["P", "Great. I'll get you an answer by Wednesday. Anything else?", "Lauren"], ["S", "Just one small thing. Could the start date be June the ninth instead of the second? I promised Henry I'd finish their summer campaign.", "Camila"], ["P", "The ninth is fine. Honestly, Camila, the fact that you're asking these questions makes me trust you more.", "Lauren"], ["S", "Thank you. And Lauren? Thank you for remembering me. After the coffee that didn't happen.", "Camila"], ["P", "Are you kidding? You were the only person who was kind to me when I was ghosting everyone.", "Lauren"], ["S", "That's because my friend Nathalia told me silence is the answer.", "Camila"], ["P", "Tell Nathalia she's wrong. Sometimes silence is just someone having a terrible year.", "Lauren"]], "words": 256, "kind": "story", "scene": "May, a video call. Lauren has made Camila an offer at Tidewater Brands.", "F": "Before signing, it's normal to raise anything that could cause problems later. Camila is honest about her side work and asks permission. \"Conflict of interest\" means a situation where two jobs could compete. \"Declare it\" means tell your employer officially. \"Ghosting\" means suddenly stopping all communication.", "V": "", "t": [[2.0, 3.59], [3.94, 5.55], [5.9, 7.72], [8.32, 10.23], [10.58, 13.01], [13.61, 14.4], [14.75, 15.67], [16.27, 19.1], [19.45, 20.7], [21.05, 22.12], [22.47, 26.07], [26.67, 27.46], [27.81, 29.42], [30.02, 31.39], [31.74, 34.11], [34.46, 36.25], [36.85, 38.38], [38.73, 41.23], [41.58, 43.53], [43.88, 46.05], [46.4, 47.8], [48.4, 49.5], [49.85, 51.97], [52.32, 55.4], [56.0, 57.46], [57.81, 61.42], [61.77, 63.5], [64.1, 65.24], [65.59, 67.2], [67.8, 68.76], [69.11, 71.1], [71.45, 72.53], [73.13, 74.61], [74.96, 77.95], [78.3, 81.23], [81.83, 83.17], [83.52, 87.98], [88.58, 89.45], [89.8, 90.73], [91.08, 92.95], [93.3, 95.32], [95.92, 97.01], [97.36, 100.89], [101.49, 105.25], [105.85, 107.47], [107.82, 110.93]], "R": [["You want to mention side work before accepting a job.", "Lauren", "Any questions before you sign?", "Yes, one. I do a few hours of freelance work for a small bakery chain. Would it be okay to continue outside work hours?"], ["You want to ask for a slightly later start date.", "Lauren", "Anything else?", "Just one small thing. Could I start a week later? I promised to finish a project for a client."]]}, {"num": 73, "title": "Surviving the First Night", "lines": [["P", "Juliana? It's seven-thirty. Are you okay?", "Karen"], ["S", "I'm okay! I'm sorry, I know it's early. I just finished my first night shift on the surgical unit. You told me to thank you by surviving my first night shift.", "Juliana"], ["P", "Ha! I did say that. So? Did you survive?", "Karen"], ["S", "I survived. Eight patients. Two of them came straight from surgery at midnight. One had a drop in blood pressure at three a.m.", "Juliana"], ["P", "And what did you do?", "Karen"], ["S", "I checked everything twice, and then I called the doctor. On the phone. At three a.m. In English.", "Juliana"], ["P", "The phone call! The one Andrea was so scared of. How did it go?", "Karen"], ["S", "Patricia taught us a structure in the transition program. Situation, background, assessment, recommendation. I followed it exactly. The doctor said, \"Thanks, that was very clear,\" and gave me new orders.", "Juliana"], ["P", "Juliana, that's perfect. That's exactly how it's supposed to go.", "Karen"], ["S", "My hands were shaking when I hung up.", "Juliana"], ["P", "Everyone's hands shake the first time. Mine shook for a year.", "Karen"], ["S", "Really?", "Juliana"], ["P", "Really. So, how was the team?", "Karen"], ["S", "Wonderful. Andrea made me coffee at four a.m. And Sam left a mug in my locker. It says \"Not Your Mug.\"", "Juliana"], ["P", "Ha! That's the best welcome gift on that unit.", "Karen"], ["S", "Karen, I just wanted to say... a year ago, I was folding blankets in your department. And now...", "Juliana"], ["P", "And now you're a surgical nurse calling doctors at three a.m. Go home and sleep. That's an order.", "Karen"], ["S", "Yes, boss.", "Juliana"]], "words": 240, "kind": "story", "scene": "June, 7:30 a.m., the hospital parking lot. Juliana calls Karen after her first night shift on the surgical unit.", "F": "Juliana keeps the promise from script 32 and calls the person who helped her. She uses a communication structure for calling doctors: situation, background, assessment, recommendation, often called SBAR in Canadian health care. \"That's an order\" is a joke: Karen isn't her boss anymore. Listen for the callbacks to Andrea, Patricia and Sam.", "V": "", "t": [[2.0, 2.95], [3.3, 4.5], [4.85, 5.94], [6.54, 7.32], [7.67, 9.14], [9.49, 12.88], [13.23, 16.55], [17.15, 17.75], [18.1, 19.37], [19.72, 20.41], [20.76, 21.98], [22.58, 23.35], [23.7, 24.58], [24.93, 27.57], [27.92, 28.41], [29.01, 30.24], [30.84, 33.84], [34.19, 34.92], [35.27, 35.76], [36.11, 36.88], [37.48, 38.53], [38.88, 40.89], [41.24, 42.32], [42.92, 46.01], [46.36, 49.31], [49.66, 50.94], [51.29, 55.08], [55.68, 57.41], [57.76, 59.88], [60.48, 62.33], [62.93, 65.13], [65.48, 66.94], [67.54, 68.13], [68.73, 69.74], [70.09, 71.5], [72.1, 72.8], [73.15, 73.64], [73.99, 75.76], [76.11, 77.28], [77.88, 78.48], [78.83, 81.13], [81.73, 83.26], [83.61, 86.5], [86.85, 87.57], [88.17, 88.83], [89.18, 90.55], [90.9, 91.97], [92.57, 93.36]], "R": [["You call a mentor after a big first day.", "Karen", "So? Did you survive?", "I survived! It was intense, but I followed everything I learned, and the team was wonderful."], ["Someone tells you to go and rest.", "Karen", "Go home and sleep. That's an order.", "Yes, boss! Thank you for everything, Karen."]]}, {"num": 74, "title": "The Awkward Call", "lines": [["P", "Ana! Hi! I was just about to call you. Any news?", "Sarah"], ["S", "Hi, Sarah. Yes, actually. That's why I'm calling. I have news, and it's a little bit awkward.", "Ana"], ["P", "Uh-oh. Awkward good or awkward bad?", "Sarah"], ["S", "Awkward good. I accepted a position at MetroLink. Interface coordinator. Directly, through Kevin, the interface manager. Not through your client submission.", "Ana"], ["P", "Oh. Wow. Okay. Congratulations!", "Sarah"], ["S", "Thank you. I wanted to tell you myself, before you heard it from them. You were the first recruiter who believed in me, and I feel terrible that it didn't happen through you.", "Ana"], ["P", "Ana, honestly? Don't feel terrible. This happens. Remember, you'd already applied directly in July. That's why I asked you. You were already in their system.", "Sarah"], ["S", "That's true. I forgot.", "Ana"], ["P", "Plus, Kevin's team and my client's team are different departments. Mine was the operations side. So nothing's broken.", "Sarah"], ["S", "Thank you for being so kind about it.", "Ana"], ["P", "Can I tell you something? Most people don't call. They just disappear, and I find out on LinkedIn three months later. You calling me means a lot.", "Sarah"], ["S", "Of course. You helped me so much. The headline, \"open to anything.\" I still think about that.", "Ana"], ["P", "Ha! You were so open to anything.", "Sarah"], ["S", "I was terribly open to anything.", "Ana"], ["P", "So, here's my request. In a year, when MetroLink needs to hire people, you'll remember the recruiter who never forgets names?", "Sarah"], ["S", "I'll remember. You'll be the first person I call.", "Ana"], ["P", "That's what I told you once.", "Sarah"], ["S", "I know. I stole it.", "Ana"]], "words": 245, "kind": "story", "scene": "May, a phone call. Ana calls Sarah.", "F": "Telling a recruiter you found a job another way can feel awkward, but calling them is professional and keeps the relationship. Ana is honest and grateful, and Sarah explains why there's no problem. Notice the role reversal at the end: \"You'll be the first person I call.\" Networking relationships continue after you get a job.", "V": "", "t": [[2.0, 2.78], [3.13, 3.9], [4.25, 6.11], [6.46, 7.55], [8.15, 8.96], [9.31, 10.32], [10.67, 11.82], [12.17, 14.31], [14.91, 15.72], [16.07, 18.19], [18.79, 19.63], [19.98, 22.2], [22.55, 23.87], [24.22, 26.99], [27.34, 28.96], [29.56, 30.19], [ const GOOD = /samantha|alex|ava|zoe|allison|susan|evan|nathan|tom|daniel|karen|moira|tessa|serena|kate|oliver|arthur|jenny|aria|guy|libby|sonia|ryan|clara|liam|natural|neural|google/i;

    (GOOD.test(n) ? 20 : 0) + ({ "en-CA": 6, "en-US": 5, "en-GB": 3 }[v.lang] || 1) + (v.default ? 2 : 0);

}
function fillVoices() {
  loadVoices();
  const [dp, ds] = defaultVoices();
  [["#pv", dp], ["#sv", ds]].forEach(([id, def]) => {
    const sel = $(id); if (!sel) return;
    if (!("speechSynthesis" in window) || !voices.length) { sel.innerHTML = `<option value="">Default</option>`; if (!("speechSynthesis" in window)) { sel.disabled = true; $("#play") && ($("#play").disabled = true); $("#nowline") && ($("#nowline").textContent = "This browser can't read text aloud. Try Chrome, Edge, or Safari."); } return; }
    sel.innerHTML = voices.map(v => `<option value="${esc(v.name)}">${esc(label(v))}</option>`).join("");
    sel.value = def;
  });
}
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => { if ($("#pv")) fillVoices(); };
function utter(text, sp) {
  return new Promise(res => {
    const u = new SpeechSynthesisUtterance(text);
    const name = sp === "S" ? ($("#sv") ? $("#sv").value : PREF.sv) : ($("#pv") ? $("#pv").value : PREF.pv);
    const v = voices.find(x => x.name === name);
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-CA";
    const same = sp === "S" && $("#sv") && $("#pv") && $("#sv").value === $("#pv").value;
    u.pitch = same ? 1.25 : 1;
    u.rate = +PREF.rate;
    let fin = false; const end = () => { if (!fin) { fin = true; res(); } };
    u.onend = end; u.onerror = end;
    speechSynthesis.speak(u);
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));
const roleName = () => { const s = ALL.find(x => x.num === ST.num); return ((s && s.lines.find(l => l[0] === "S")) || [])[2] || ""; };
let REC = null;
function playSeg(k, flow) {
  const T = ALL.find(x => x.num === ST.num).t, a = REC; if (!a || !T) return Promise.resolve();
  const end = flow && k + 1 < T.length ? T[k + 1][0] : T[k][1] + 0.05, id = RUN;
  a.playbackRate = +PREF.arate;
  const from = flow && k === 0 ? 0 : T[k][0];
  if (a.paused || Math.abs(a.currentTime - from) > 0.4) a.currentTime = from;
  return new Promise(res => {
    const tick = () => { if (id !== RUN || a.ended) { res(); return; } if (a.currentTime >= end) { if (!flow) a.pause(); res(); return; } requestAnimationFrame(tick); };
    a.play().then(() => requestAnimationFrame(tick)).catch(() => res());
  });
}
function highlight(k) {
  document.querySelectorAll(".seg.on").forEach(e => e.classList.remove("on"));
  document.querySelectorAll(".masked .turns span.on").forEach(e => e.classList.remove("on"));
  if (k < 0) return;
  const e = document.querySelector(`.seg[data-seg="${k}"]`);
  if (e) { e.classList.add("on"); const r = e.getBoundingClientRect(); if (r.top < 90 || r.bottom > innerHeight - 40) e.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }
  const t = document.querySelector(`.masked .turns span[data-turn="${ST.segs[k].turn}"]`); if (t) t.classList.add("on");
}
function status(k, extra) {
  const g = ST.segs[k], nl = $("#nowline"), trk = $("#trk");
  if (nl && g) nl.innerHTML = `<b>${esc(g.name)}</b> · sentence ${k + 1} of ${ST.segs.length}${extra ? ` · ${extra}` : ""}`;
  if (trk) trk.style.width = `${((k + 1) / ST.segs.length) * 100}%`;
}
async function playFrom(start, { echo = false, only = false } = {}) {
  if (!ST.hasAudio && !("speechSynthesis" in window)) return;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (REC && ST.hasAudio) REC.pause();
  const id = ++RUN; setPlaying(true);
  for (let k = start; k < ST.segs.length; k++) {
    if (id !== RUN) return;
    const g = ST.segs[k]; ST.seg = k; highlight(k); status(k); updSeg();
    const mine = echo && ST.roleplay && g.name === roleName();
    const T = ST.hasAudio && ALL.find(x => x.num === ST.num).t, flow = ST.hasAudio && !echo && !only;
    if (mine) { status(k, "your line, say it now"); await wait(T ? (T[k][1] - T[k][0]) * 1000 / +PREF.arate + 1200 : g.t.split(" ").length * 470 / +PREF.rate + 900); }
    else if (ST.hasAudio) await playSeg(k, flow);
    else await utter(g.t, g.sp);
    if (id !== RUN) return;
    if (echo && !mine) { status(k, "your turn, repeat it"); await wait(T ? (T[k][1] - T[k][0]) * 1000 * +PREF.gap / +PREF.arate + 700 : g.t.split(" ").length * 380 * +PREF.gap / +PREF.rate + 700); }
    else if (!ST.hasAudio && k + 1 < ST.segs.length && ST.segs[k + 1].turn !== g.turn) await wait(260);
    if (only) break;
  }
  if (id === RUN) { setPlaying(false); highlight(-1); const nl = $("#nowline"); if (nl) nl.textContent = only ? `Sentence ${ST.seg + 1} of ${ST.segs.length}. Play it again or go to the next one.` : "Finished. Press Play to hear it again."; }
}
function setPlaying(on) { const p = $("#play"); if (p) p.textContent = on ? "Playing…" : "Play"; }
function stopAll() {
  RUN++;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (REC) REC.pause();
  setPlaying(false); highlight(-1);
}
function updSeg() { const b = $("#splay"); if (b) b.textContent = `Play sentence ${ST.seg + 1} of ${ST.segs.length}`; }

function wirePlayer(s, opts = {}) {
  if (ST.hasAudio) {
    if (!REC || REC.dataset.n != ST.num) { REC = new Audio(audioUrl(ST.num)); REC.preload = "auto"; REC.dataset.n = ST.num; }
    $("#arate").value = ["0.75", "0.9", "1"].includes(PREF.arate) ? PREF.arate : "1";
    $("#arate").onchange = e => { PREF.arate = e.target.value; savePref(); REC.playbackRate = +e.target.value; };
    $("#back10").onclick = () => { const T = ALL.find(x => x.num === ST.num).t; const at = Math.max(0, (REC.currentTime || 0) - 10); let k = 0; T.forEach((g, i) => { if (g[0] <= at) k = i; }); ST.seg = k; playFrom(k); };
  } else {
  fillVoices();
  $("#rate").value = PREF.rate;
  $("#rate").onchange = e => { PREF.rate = e.target.value; savePref(); };
  $("#pv").onchange = e => { PREF.pv = e.target.value; savePref(); };
  if ($("#sv")) $("#sv").onchange = e => { PREF.sv = e.target.value; savePref(); };
  }
  if ($("#gap")) { $("#gap").value = PREF.gap; $("#gap").onchange = e => { PREF.gap = e.target.value; savePref(); }; }
  if ($("#roleplay")) $("#roleplay").onchange = e => ST.roleplay = e.target.checked;
  $("#play").onclick = () => playFrom(opts.resume && ST.seg < ST.segs.length - 1 ? ST.seg : 0, { echo: !!opts.echo });
  $("#stop").onclick = stopAll;
  if ($("#splay")) {
    updSeg();
    $("#splay").onclick = () => playFrom(ST.seg, { only: true });
    $("#sprev").onclick = () => { ST.seg = Math.max(0, ST.seg - 1); playFrom(ST.seg, { only: true }); };
    $("#snext").onclick = () => { ST.seg = Math.min(ST.segs.length - 1, ST.seg + 1); playFrom(ST.seg, { only: true }); };
  }
  document.querySelectorAll(".seg").forEach(e => e.onclick = () => playFrom(+e.dataset.seg, { only: !!opts.tapOne, echo: !!opts.echo }));
}

function nextRow(k) {
  return `<div class="nextrow">${k > 0 ? `<button class="btn secondary" data-go="${k - 1}">Back to round ${k}</button>` : "<span></span>"}${k < 5 ? `<button class="btn" data-go="${k + 1}">Go to round ${k + 2}: ${ROUNDS[k + 1][0].toLowerCase()}</button>` : `<button class="btn gold" id="finish">${DONE.has(ST.num) ? "Completed ✓" : "Mark this script as completed"}</button>`}</div>`;
}

function renderPanel(s) {
  const k = ST.round, P = $("#panel"), dlg = true;
  const answerBox = `<div class="field"><label for="answer">Your transcription</label><textarea id="answer" placeholder="Write exactly what you hear. You don't need to write the speakers' names.">${esc(ST.answer)}</textarea></div>`;
  const gistQs = ["Who is talking, and where are they?", "What is the problem, the news, or the question?", "How does the conversation end?"];
  if (k === 0) P.innerHTML = `<h3>Round 1: Listen for the main idea</h3>
    <p class="hint">Listen to the whole exchange once. Don't write while you listen. When it finishes, answer these questions in your own words.</p>
    ${playerHTML()}${dialogueHTML(s, false)}
    <ul class="prompts" style="margin-top:18px">${gistQs.map(q => `<li>${q}</li>`).join("")}</ul>
    <div class="field"><label for="gist">Your answers</label><textarea id="gist" class="short">${esc(ST.gist)}</textarea></div>${nextRow(k)}`;
  if (k === 1) P.innerHTML = `<h3>Round 2: Transcribe</h3>
    <p class="hint">Play one sentence at a time and write exactly what you hear. Replay a sentence as many times as you need. If you can't hear a word, leave a space and keep going.</p>
    ${playerHTML({ lines: true })}${dialogueHTML(s, false)}${answerBox}${nextRow(k)}`;
  if (k === 2) P.innerHTML = `<h3>Round 3: Listen again and fix</h3>
    <p class="hint">Play the whole conversation from the beginning and follow your transcription. Fix anything you're unsure about. Listen closely for the small words: <i>a, the, to, of, it's, don't, that</i>.</p>
    ${playerHTML()}${answerBox}${nextRow(k)}`;
  if (k === 3) P.innerHTML = `<h3>Round 4: Compare</h3>
    <p class="hint">Check your transcription against the text. Look at the words you missed. Were they small words? Words linked together? New words you didn't know?</p>
    ${answerBox}<div class="actions"><button class="btn gold" id="check">Check my transcription</button></div><div id="result"></div><div class="respond"><h4>Why did you miss it?</h4><p class="hint">For each word or phrase you missed, decide which kind of mistake it was. Over time, this shows you what to practise.</p><ol type="A"><li><b>New vocabulary:</b> you didn't know the word.</li><li><b>Known word, not recognized:</b> you know it when you read it, but you didn't hear it.</li><li><b>Connected speech:</b> words were linked or shortened, like “wanna” or “gotta.”</li><li><b>Small words:</b> you missed little words like “a,” “the,” “to” or “of.”</li><li><b>Meaning:</b> you heard every word, but misunderstood what the person meant.</li></ol></div>${nextRow(k)}`;
  if (k === 4) P.innerHTML = `<h3>Round 5: Shadow</h3>
    <p class="hint">Now the text is visible. Follow the highlight while the voices speak, and tap any sentence to hear it from there. Then play it again and speak along with the voices, at the same time, copying their rhythm and the small words.</p>
    ${playerHTML({ resume: false })}${dialogueHTML(s, true)}
    <div class="listenfor"><h4>Listening note</h4><p>${esc(s.F)}</p>${s.V ? `<p><b>Words and phrases:</b> ${esc(s.V)}</p>` : ""}</div>${nextRow(k)}`;
  if (k === 5) P.innerHTML = `<h3>Round 6: Retell and Respond</h3>
    <p class="hint">First, echo: after each sentence there's a pause, so say it out loud. Then tick the box and take ${esc(roleName())}'s part: that voice goes quiet and you say the lines yourself. Finally, close the text and tell what happened in your own words, as if you were telling a friend. Last, answer two short situations in your own words.</p>
    ${playerHTML({ echo: true })}${dialogueHTML(s, true)}
    <div class="mine"><h4>Tell it in your own words</h4>
      <ul class="prompts"><li>Who is in the conversation, and where are they?</li><li>What happens first, next, and at the end?</li><li>Use at least three phrases from the listening note.</li><li>Say it out loud in one or two minutes, without looking at the text.</li></ul>
      <div class="field"><label for="mineTxt">My notes (saved in this browser)</label><textarea id="mineTxt" class="short">${esc(store.get("mine:" + s.num, ""))}</textarea></div>
    </div><div class="respond"><h4>Respond</h4><p class="hint">Now it's your turn. Read the situation, say your answer out loud, and write it if you like. Then compare it with the model answer.</p>
      ${(s.R || []).map((r, i) => `<div class="rsp"><p class="rsit">${esc(r[0])}</p><p class="rq"><b>${esc(r[1])}:</b> “${esc(r[2])}”</p><div class="field"><label for="rsp${i}">Your answer (saved in this browser)</label><textarea id="rsp${i}" class="short" data-rsp="${i}">${esc(store.get(`rsp:${s.num}:${i}`, ""))}</textarea></div><button class="btn secondary" data-model="${i}">Show a model answer</button><p class="model" id="model${i}" hidden><b>Model answer:</b> ${esc(r[3])}<span>Your answer doesn't have to match. Any natural, polite reply that fits the situation is good.</span></p></div>`).join("")}
    </div>${nextRow(k)}`;
  if ($("#mineTxt")) $("#mineTxt").oninput = e => store.set("mine:" + s.num, e.target.value);
  P.querySelectorAll("[data-rsp]").forEach(t => t.oninput = e => store.set(`rsp:${ST.num}:${t.dataset.rsp}`, e.target.value));
  P.querySelectorAll("[data-model]").forEach(b => b.onclick = () => { const m = $("#model" + b.dataset.model); m.hidden = !m.hidden; b.textContent = m.hidden ? "Show a model answer" : "Hide the model answer"; });
  if (k !== 3) wirePlayer(s, { echo: k === 5, tapOne: k === 5 });
  P.querySelectorAll("[data-go]").forEach(b => b.onclick = () => goRound(+b.dataset.go));
  if ($("#finish")) $("#finish").onclick = () => { ST.done.add(5); markDone(ST.num); renderScript(ST.num); renderNav($("#q").value); };
  if (k === 3) { $("#check").onclick = () => { saveFields(); check(s); }; if (ST.result) showResult(s); }
}

/* ---------- transcription check ---------- */
const norm = w => w.toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9'éãçõáíóúâêô½%]/g, "").replace(/^'+|'+$/g, "");
function tokens(t) { return t.replace(/[“”]/g, '"').replace(/—|–/g, " ").split(/\s+/).filter(Boolean).map(w => ({ raw: w, n: norm(w) })).filter(x => x.n); }
function check(s) {
  const FULL = tokens(fullText(s)), B = tokens(ST.answer);
  if (!B.length) { $("#result").innerHTML = `<div class="result"><p>Your transcription is empty. Go back to round 2, write what you hear, and then check it here.</p></div>`; return; }
  const reach = Math.min(FULL.length, Math.round(B.length * 1.6) + 15);
  const A = FULL.slice(0, reach), tail = FULL.slice(reach), n = A.length, m = B.length;
  const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i].n === B[j].n ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && A[i].n === B[j].n) { ops.push(["same", i]); i++; j++; }
    else if (j < m && (i >= n || L[i][j + 1] >= L[i + 1][j])) { ops.push(["extra", j]); j++; }
    else { ops.push(["miss", i]); i++; }
  }
  const hits = ops.filter(o => o[0] === "same").map(o => o[1]);
  while (hits.length > 1 && hits[hits.length - 1] - hits[hits.length - 2] > 8) hits.pop();
  const lastA = hits.length ? hits[hits.length - 1] : -1;
  if (lastA < 0) { ST.result = { empty: true }; showResult(s); return; }
  let out = [], matched = 0, graded = 0, small = new Map(), other = [], extra = [], rest = [];
  ops.forEach(([kd, x]) => {
    if (kd === "same" && x <= lastA) { out.push(esc(A[x].raw)); matched++; graded++; }
    else if (kd === "same") rest.push(esc(A[x].raw));
    else if (kd === "extra") { if (!rest.length) { out.push(`<del>${esc(B[x].raw)}</del>`); extra.push(B[x].n); } }
    else if (x > lastA) rest.push(esc(A[x].raw));
    else { graded++; const w = A[x].n, sm = SMALL.has(w); if (sm) small.set(w, (small.get(w) || 0) + 1); else other.push(w); out.push(`<mark class="${sm ? "small" : ""}">${esc(A[x].raw)}</mark>`); }
  });
  tail.forEach(w => rest.push(esc(w.raw)));
  ST.result = { out, rest, matched, graded, small: [...small].sort((a, b) => b[1] - a[1]), other, extra };
  ST.done.add(3); showResult(s);
}
function showResult(s) {
  const R = ST.result, box = $("#result"); if (!box) return;
  if (R.empty) { box.innerHTML = `<div class="result"><p>None of your words matched the text yet. Listen again from the beginning and try the first few sentences.</p></div>`; return; }
  const pct = Math.floor(R.matched / R.graded * 100), partial = R.rest.length > 0;
  const smallList = R.small.map(([w, c]) => c > 1 ? `${esc(w)} (${c})` : esc(w)).join(", ");
  const acad = [...new Set(R.other.filter(w => w.length > 7))].slice(0, 20);
  box.innerHTML = `<div class="result">
    <p class="score">${pct}%<small>${R.matched} of ${R.graded} words correct${partial ? ", checked up to where you stopped" : ""}</small></p>
    <p class="legend"><mark>missed</mark> <mark class="small">missed small word</mark> <del>extra or misspelled</del>${partial ? ` <span class="rest">not transcribed yet</span>` : ""}</p>
    <div class="diff">${R.out.join(" ")}${partial ? ` <span class="rest">${R.rest.join(" ")}</span>` : ""}</div>
    ${smallList ? `<p class="smalls"><b>Small words you missed:</b> ${smallList}</p>` : `<p class="smalls">You didn't miss any small words. Well done.</p>`}
    ${acad.length ? `<p class="smalls"><b>Longer words to review:</b> ${acad.map(esc).join(", ")}</p>` : ""}
    <div class="sendbox">
      <div class="field"><label for="sname">Your name</label><input id="sname" value="${esc(ST.name || "")}" autocomplete="name"></div>
      <div class="actions"><button class="btn" id="send">Email my results to Ron</button><button class="btn secondary" id="copy">Copy my results</button></div>
      <p>This opens your email app with your results already written. Nothing is sent until you press send. If your email app doesn't open, copy your results and paste them into an email to ${TEACHER_EMAIL}.</p>
      <p class="status" id="status" role="status"></p>
    </div></div>`;
  $("#sname").oninput = e => { ST.name = e.target.value; store.set("name", ST.name); };
  $("#send").onclick = () => { location.href = `mailto:${TEACHER_EMAIL}?subject=${encodeURIComponent(`Networking Listening Lab: Script ${s.num}, ${s.title}`)}&body=${encodeURIComponent(resultText(s))}`; };
  $("#copy").onclick = async () => {
    const t = resultText(s);
    try { await navigator.clipboard.writeText(t); } catch { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
    $("#status").textContent = "Copied. Paste it into an email or a message to Ron.";
  };
}
function resultText(s) {
  const R = ST.result, pct = Math.floor(R.matched / R.graded * 100);
  const cap = (a, k) => a.length > k ? a.slice(0, k).join(", ") + ` (and ${a.length - k} more)` : a.join(", ") || "none";
  const lines = ["Networking Listening Lab results", `Name: ${ST.name || "(not given)"}`, `Script: ${s.num}. ${s.title} (Part ${s.part}: ${s.partTitle})`,
    `Score: ${pct}% (${R.matched} of ${R.graded} words${R.rest.length ? ", checked up to where I stopped" : ""})`, "",
    `Small words I missed: ${cap(R.small.map(([w, c]) => c > 1 ? `${w} (${c})` : w), 30)}`,
    `Other words I missed: ${cap(R.other, 40)}`, `Extra or misspelled words I wrote: ${cap(R.extra, 30)}`];
  if (ST.gist) lines.push("", `My answers after the first listen: ${ST.gist.slice(0, 500)}`);
  return lines.join("\n");
}

/* ---------- routing ---------- */
function route() {
  const h = location.hash;
  if (h.startsWith("#script-")) renderScript(+h.slice(8)); else renderHome();
  renderNav($("#q").value); closeMenu();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-script],[data-home]"); if (!b) return;
  location.hash = b.hasAttribute("data-home") ? "#home" : "#script-" + b.dataset.script;
});
$("#q").addEventListener("input", e => renderNav(e.target.value));
function closeMenu() { $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded", "false"); }
$("#menuBtn").onclick = () => { $("#sidebar").classList.add("open"); $("#scrim").classList.add("open"); $("#menuBtn").setAttribute("aria-expanded", "true"); };
$("#scrim").onclick = closeMenu;
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeMenu(); stopAll(); } });
window.addEventListener("hashchange", route);
window.addEventListener("beforeunload", () => { if ("speechSynthesis" in window) speechSynthesis.cancel(); });
renderProgress();
route();
</script>
</body>
