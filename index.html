31, 79.44], [79.79, 85.23], [85.58, 91.13], [91.73, 92.49], [92.84, 93.53], [94.13, 96.02], [96.37, 100.43], [101.03, 105.7], [106.05, 107.75], [108.1, 109.34]], "R": [["You're asked to speak during a webinar.", "Host", "Thiago, go ahead.", "Hi, thanks. My question is for Ken. Is it better to learn a second cloud platform, or go deeper in one?"], ["You want to ask a quick follow-up question.", "Host", "Thiago, you've got your hand up again?", "Sorry, just a quick follow-up. Does a personal project count, or does it need to be for a company?"]]}, {"num": 42, "title": "Going Around the Room", "lines": [["P", "Good morning, everyone. I'm Patricia, and I'll be your instructor for the next twelve weeks. Let's go around the room. Name, where you trained, and one thing you're nervous about. I'll start. I'm nervous I'll forget your names. Next.", "Patricia"], ["P", "Hi, I'm Harpreet. I trained in Punjab, in India. I worked in pediatrics for six years. I'm nervous about the documentation system.", "Harpreet"], ["P", "Very normal. Next.", "Patricia"], ["P", "Hi everyone, I'm Andrea. I trained in Rio de Janeiro. I worked in intensive care for eight years. And I'm nervous about the phone. Calling doctors at night, in English, when they're tired and angry.", "Andrea"], ["P", "Oh, everyone's nervous about that. Including Canadian nurses. Next.", "Patricia"], ["S", "Hi, I'm Juliana. I trained in Salvador, in Brazil, and worked in emergency for nine years.", "Juliana"], ["P", "Salvador! Oi!", "Andrea"], ["S", "Oi! Rio!", "Juliana"], ["P", "Okay, okay, two Brazilians. Juliana, what are you nervous about?", "Patricia"], ["S", "Honestly, the medications. The brand names here are different. In Brazil, I knew every name. Here, sometimes I read a medication and I don't recognize it, even if I know exactly what it does.", "Juliana"], ["P", "That's a very good thing to be nervous about. It means you'll check. Nurses who check are safe nurses. Next.", "Patricia"], ["P", "I'm Marisol. Philippines, Manila. Surgical nursing, ten years. I'm nervous about speaking up. In the Philippines, we don't always question doctors.", "Marisol"], ["P", "Okay. Everything you've all just said, we'll cover. Documentation, phone calls, medications, and speaking up. And by the end, I promise, the phone won't scare you anymore.", "Patricia"], ["P", "Can you promise the doctors won't be angry?", "Andrea"], ["P", "No. Nobody can promise that.", "Patricia"]], "words": 253, "kind": "story", "scene": "October, the first day of Juliana's nursing transition program in Burnaby.", "F": "\"Let's go around the room\" means everyone introduces themselves in turn. Listen for each person's name, country, specialty and worry. These details are typical for a listening test. Juliana meets Andrea, another Brazilian nurse from Rio de Janeiro. \"Speaking up\" means saying something when you think there's a problem.", "V": "", "t": [[2.0, 3.52], [3.87, 7.25], [7.6, 9.07], [9.42, 12.3], [12.65, 13.66], [14.01, 15.96], [16.31, 17.24], [17.84, 19.5], [19.85, 22.17], [22.52, 25.07], [25.42, 28.07], [28.67, 29.74], [30.09, 31.02], [31.62, 33.44], [33.79, 35.66], [36.01, 38.51], [38.86, 40.78], [41.13, 44.75], [45.35, 47.58], [47.93, 49.79], [50.14, 51.07], [51.67, 52.73], [53.08, 57.74], [58.34, 59.29], [59.64, 60.33], [60.93, 61.44], [61.79, 62.38], [62.98, 65.1], [65.45, 67.54], [68.14, 69.51], [69.86, 71.51], [71.86, 73.47], [73.82, 79.9], [80.5, 82.75], [83.1, 84.37], [84.72, 86.87], [87.22, 88.15], [88.75, 89.94], [90.29, 91.81], [92.16, 94.19], [94.54, 96.47], [96.82, 99.68], [100.28, 101.07], [101.42, 103.5], [103.85, 107.27], [107.62, 110.67], [111.27, 113.63], [114.23, 114.83], [115.18, 116.9]], "R": [["The instructor asks everyone to introduce themselves.", "Patricia", "Name, where you trained, and one thing you're nervous about.", "Hi, I'm Juliana. I trained in Salvador, Brazil, and worked in emergency for nine years. I'm nervous about the medication names here."], ["Someone in the group is from the same country as you.", "Andrea", "Salvador! Oi!", "Oi! It's so nice to meet another Brazilian nurse here. How long have you been in Vancouver?"]]}]}, {"part": 6, "title": "Recruiters and Referrals", "desc": "Screening calls, referrals, introductions, and hearing no.", "scripts": [{"num": 43, "title": "Before I Submit You", "lines": [["P", "Ana, it's Sarah. Good news. The transit client is back. The project restarted on Monday.", "Sarah"], ["S", "Sarah! That's wonderful. Thank you for calling me.", "Ana"], ["P", "Told you you'd be first. Okay, before I submit your profile, I need to ask you a few boring but important questions. First, have you applied directly to MetroLink in the last six months?", "Sarah"], ["S", "Yes. I applied online in July. For a project coordinator role.", "Ana"], ["P", "Okay. Thank you for telling me. That matters.", "Sarah"], ["S", "Why does it matter?", "Ana"], ["P", "Because if I submit you and you're already in their system, it can look like two people are fighting over you. Some clients won't accept a candidate from an agency if they've already applied directly. Let me check with them first.", "Sarah"], ["S", "I didn't know that. I'm sorry.", "Ana"], ["P", "Don't be. You didn't do anything wrong. It's just a rule people don't know. That's why I ask. Next question. Are you legally able to work in Canada?", "Sarah"], ["S", "Yes. I'm a permanent resident.", "Ana"], ["P", "Perfect. And what are your salary expectations?", "Sarah"], ["S", "Honestly, I'm not sure what's normal here. What's the range for this role?", "Ana"], ["P", "Good answer. The client's range is ninety-five to a hundred and ten thousand.", "Sarah"], ["S", "Then somewhere in the middle of that range would be fair, based on my experience.", "Ana"], ["P", "That's exactly how to answer. Last one. If they want to meet you, when could you start?", "Sarah"], ["S", "Two weeks' notice for my volunteer role. So, almost immediately.", "Ana"], ["P", "Ha! I'll tell them \"available immediately.\" Okay, Ana, give me two days. I'll call you either way.", "Sarah"]], "words": 252, "kind": "story", "scene": "October, a phone call. Sarah calls Ana with news.", "F": "Agencies ask whether you've already applied to their client, because a double application can cause problems. Be honest. When asked about salary, Ana asks for the range first, then places herself \"in the middle of that range.\" \"I'll call you either way\" means Sarah will call whether the news is good or bad.", "V": "", "t": [[2.0, 3.3], [3.65, 4.75], [5.1, 6.98], [7.33, 9.54], [10.14, 10.7], [11.05, 11.93], [12.28, 13.62], [14.22, 15.89], [16.24, 21.63], [21.98, 25.95], [26.55, 27.13], [27.48, 29.09], [29.44, 31.22], [31.82, 32.71], [33.06, 34.6], [34.95, 36.03], [36.63, 37.63], [38.23, 43.93], [44.28, 49.42], [49.77, 51.52], [52.12, 53.12], [53.47, 54.21], [54.81, 55.88], [56.23, 57.98], [58.33, 60.34], [60.69, 62.09], [62.44, 63.71], [64.06, 66.44], [67.04, 67.62], [67.97, 69.38], [69.98, 71.05], [71.4, 73.67], [74.27, 76.45], [76.8, 78.3], [78.9, 79.93], [80.28, 84.15], [84.75, 89.13], [89.73, 91.64], [91.99, 93.07], [93.42, 95.87], [96.47, 98.67], [99.02, 100.45], [101.05, 101.78], [102.13, 104.38], [104.73, 106.98], [107.33, 108.9]], "R": [["A recruiter asks if you've already applied to their client.", "Sarah", "Have you applied directly to MetroLink in the last six months?", "Yes, I applied online in July for a coordinator role. I wanted to tell you before you submit anything."], ["A recruiter asks about your salary expectations.", "Sarah", "What are your salary expectations?", "I'm still learning what's normal here. What's the range for this role? Based on my experience, somewhere in the middle would be fair."]]}, {"num": 44, "title": "May I Use Your Name?", "lines": [["P", "Hi Bruno.", "Hannah"], ["S", "Hi Hannah. Sorry to call during the day. I saw the posting this morning. Financial analyst, one-year contract. Is this the one you mentioned?", "Bruno"], ["P", "That's the one. It finally got approved.", "Hannah"], ["S", "Congratulations. I'd like to apply. Is it okay if I mention your name in my application?", "Bruno"], ["P", "Thank you for asking first. A lot of people don't. Yes, you can say we've met and that you shared your planning model with our team.", "Hannah"], ["S", "Thank you. Is there anything else you think I should do?", "Bruno"], ["P", "Apply through the website today. Then I'll send a note to the hiring manager. It's not me, by the way. It's my director, Paul. I'm not allowed to be on the interview panel, because we know each other.", "Hannah"], ["S", "Oh. I understand. That's fair.", "Bruno"], ["P", "It's normal here. A referral gets you noticed, but it doesn't get you the job. You still have to interview like everyone else.", "Hannah"], ["S", "Of course. I prefer that, actually. If I get it, I want it to be because of me.", "Bruno"], ["P", "Good attitude. One tip. Paul loves numbers. Every time you tell a story in the interview, finish it with a number.", "Hannah"], ["S", "Like \"within two percent.\"", "Bruno"], ["P", "Exactly like \"within two percent.\" He'll love that.", "Hannah"], ["S", "Thank you, Hannah. Really.", "Bruno"], ["P", "Don't thank me. Raj is the one who begged me to make sure you applied. He's still using your model.", "Hannah"], ["S", "Tell Raj I said thank you too.", "Bruno"], ["P", "I will. Good luck, Bruno.", "Hannah"]], "words": 239, "kind": "story", "scene": "October, a phone call. Bruno calls Hannah after seeing a job posting.", "F": "Bruno asks permission before using Hannah's name, which is important and polite. Hannah explains how referrals work: \"A referral gets you noticed, but it doesn't get you the job.\" Because she knows Bruno, she can't be on the interview panel. This is called a conflict of interest. \"Begged me\" means asked very strongly.", "V": "", "t": [[2.0, 2.82], [3.42, 4.46], [4.81, 6.78], [7.13, 9.12], [9.47, 12.07], [12.42, 14.23], [14.83, 15.67], [16.02, 17.4], [18.0, 19.55], [19.9, 21.37], [21.72, 25.14], [25.74, 27.17], [27.52, 28.77], [29.12, 33.33], [33.93, 34.79], [35.14, 37.76], [38.36, 39.94], [40.29, 42.58], [42.93, 44.19], [44.54, 45.79], [46.14, 49.8], [50.4, 51.06], [51.41, 52.71], [53.06, 54.12], [54.72, 55.7], [56.05, 59.24], [59.59, 61.83], [62.43, 63.46], [63.81, 65.65], [66.0, 68.68], [69.28, 70.18], [70.53, 71.23], [71.58, 72.77], [73.12, 76.79], [77.39, 79.18], [79.78, 81.67], [82.02, 82.9], [83.5, 84.8], [85.15, 85.91], [86.51, 87.44], [87.79, 90.75], [91.1, 92.54], [93.14, 95.42], [96.02, 96.62], [96.97, 98.07]], "R": [["You want to mention a contact's name in your application.", "Hannah", "That's the one. It finally got approved.", "I'd love to apply. Is it okay if I mention your name in my application?"], ["Your contact explains they can't be on the interview panel.", "Hannah", "I'm not allowed to be on the panel, because we know each other.", "I understand completely. I'd prefer to earn it in the interview anyway."]]}, {"num": 45, "title": "Referral or Introduction?", "lines": [["P", "Marcio! Sorry I'm late. A ship arrived early, which never happens, so of course it happened today.", "Linda"], ["S", "No problem. Thank you for meeting me.", "Marcio"], ["P", "I've been thinking about your bus dispatcher idea. I told my team about it. They laughed at first, and then they stopped laughing.", "Linda"], ["S", "That's a good sign, I think.", "Marcio"], ["P", "It's a very good sign. So, I saw that we posted a senior planner role. Are you applying?", "Linda"], ["S", "Yes. I wanted to ask you about that. Would you be comfortable referring me?", "Marcio"], ["P", "Okay. I'm going to be honest, because I think it'll help you. I can't refer you yet.", "Linda"], ["S", "Oh. I understand.", "Marcio"], ["P", "Let me explain. A referral, for me, means I'm saying, \"I've seen this person work, and I'm putting my name next to theirs.\" I've talked to you twice. I like you a lot. But I haven't seen your work.", "Linda"], ["S", "That's fair. In Brazil, sometimes we refer friends of friends.", "Marcio"], ["P", "Some people do that here too. I just don't. But here's what I can do. I can introduce you to Ravi, the hiring manager. I'll tell him we met at the panel, that you had a smart idea, and that he should talk to you.", "Linda"], ["S", "That would be very helpful.", "Marcio"], ["P", "It's not as strong as a referral, but it's honest. And honestly, Ravi listens to me.", "Linda"], ["S", "Thank you, Linda. An honest introduction is better than a weak referral.", "Marcio"], ["P", "Exactly. And if you get the job and you're good, then I'll refer people you recommend.", "Linda"], ["S", "Then I'll make sure I'm good.", "Marcio"]], "words": 254, "kind": "story", "scene": "October, the café at the port authority building. Marcio meets Linda.", "F": "Linda explains the difference between a referral (\"I've seen this person work\") and an introduction (\"you should talk to this person\"). An honest introduction can still be very useful. \"I'm putting my name next to theirs\" means her reputation depends on the person she recommends. Marcio accepts gracefully.", "V": "", "t": [[2.0, 2.72], [3.07, 4.03], [4.38, 8.35], [8.95, 9.8], [10.15, 11.32], [11.92, 14.58], [14.93, 16.32], [16.67, 19.03], [19.63, 20.89], [21.49, 22.73], [23.08, 25.69], [26.04, 26.95], [27.55, 28.08], [28.43, 29.84], [30.19, 31.84], [32.44, 33.08], [33.43, 36.24], [36.59, 37.81], [38.41, 38.9], [39.25, 40.11], [40.71, 41.66], [42.01, 48.06], [48.41, 49.67], [50.02, 51.11], [51.46, 52.76], [53.36, 54.05], [54.4, 56.99], [57.59, 59.21], [59.56, 60.42], [60.77, 62.05], [62.4, 65.27], [65.62, 70.57], [71.17, 72.4], [73.0, 75.54], [75.89, 77.68], [78.28, 79.13], [79.48, 82.39], [82.99, 83.76], [84.11, 88.48], [89.08, 90.26]], "R": [["Someone says they can't refer you, but they can introduce you.", "Linda", "I can't refer you yet, but I can introduce you to the hiring manager.", "That's completely fair, and an introduction would be very helpful. Thank you."], ["You want to ask someone for a referral politely.", "Linda", "So, are you applying for the planner role?", "Yes, I am. Would you be comfortable referring me, or is it too early?"]]}, {"num": 46, "title": "The Call Nobody Wants", "lines": [["P", "Hi Camila, it's Monica from Northwind Retail. Is this a good time?", "Monica"], ["S", "Hi Monica! Yes, of course.", "Camila"], ["P", "I wanted to call you myself, rather than send an email. I'm afraid we've decided to go with another candidate for the loyalty manager role.", "Monica"], ["S", "Oh. Okay.", "Camila"], ["P", "I know that's disappointing. It was a really close decision. You were one of our final two.", "Monica"], ["S", "Thank you for calling me. I really appreciate that you didn't just send an email.", "Camila"], ["P", "Of course. You came recommended by Grace, and you clearly put a lot of work into the interviews.", "Monica"], ["S", "Can I ask, would you be willing to share any feedback? Anything I could do better next time?", "Camila"], ["P", "Sure. Honestly, your ideas were the strongest of anyone we saw. The other candidate had more experience with our specific technology platform, and that's what tipped it.", "Monica"], ["S", "That makes sense. I can learn that platform.", "Camila"], ["P", "And one small thing, since you asked. In the panel interview, a couple of people mentioned you answered very quickly. Sometimes it was hard to follow.", "Monica"], ["S", "Ah. Yes. My friends tell me that too.", "Camila"], ["P", "It's a small thing. Your ideas were great. Listen, Camila, we're going to have another role in the spring. Would you be okay if I kept your name for that?", "Monica"], ["S", "Yes, please. I'd love that.", "Camila"], ["P", "Great. I really hope we work together at some point.", "Monica"], ["S", "Me too. Thank you, Monica. And congratulations to the person you hired.", "Camila"], ["P", "That's very gracious. Take care, Camila.", "Monica"]], "words": 244, "kind": "story", "scene": "November, a phone call. Camila picks up while walking home.", "F": "Handling a \"no\" well keeps the door open. Camila thanks Monica, asks for feedback, and even congratulates the other candidate. Monica's feedback is soft but clear: \"a couple of people mentioned you answered very quickly.\" \"That's what tipped it\" means \"that was the deciding factor.\" \"Gracious\" means kind and polite in a difficult moment.", "V": "", "t": [[2.0, 4.99], [5.34, 6.87], [7.47, 8.56], [8.91, 10.12], [10.72, 13.79], [14.14, 18.7], [19.3, 19.97], [20.32, 21.18], [21.78, 23.53], [23.88, 25.9], [26.25, 27.99], [28.59, 30.15], [30.5, 33.33], [33.93, 34.93], [35.28, 39.7], [40.3, 43.3], [43.65, 45.97], [46.57, 47.19], [47.54, 50.89], [51.24, 56.95], [57.55, 58.7], [59.05, 60.65], [61.25, 63.41], [63.76, 67.76], [68.11, 70.22], [70.82, 71.46], [71.81, 72.51], [72.86, 74.56], [75.16, 76.52], [76.87, 78.53], [78.88, 82.1], [82.45, 85.05], [85.65, 86.77], [87.12, 88.15], [88.75, 89.49], [89.84, 92.37], [92.97, 93.87], [94.22, 95.61], [95.96, 98.56], [99.16, 100.7], [101.05, 102.51]], "R": [["You hear that you didn't get the job.", "Monica", "I'm afraid we've decided to go with another candidate.", "Thank you for letting me know, and for calling me personally. Would you be willing to share any feedback?"], ["The employer asks if they can keep your name for a future role.", "Monica", "Would you be okay if I kept your name for that?", "Yes, absolutely. I'd love to be considered. Thank you so much."]]}, {"num": 47, "title": "A Friend Tells the Truth", "lines": [["P", "I'm so sorry about Northwind. Monica texted me. She said it was really close.", "Grace"], ["S", "Final two. Which somehow makes it worse.", "Camila"], ["P", "It does make it worse. Final two is the worst place to be.", "Grace"], ["S", "She said my ideas were the strongest. And that I answered too quickly.", "Camila"], ["P", "Hmm.", "Grace"], ["S", "What does \"hmm\" mean?", "Camila"], ["P", "It means... can I be honest with you? As a friend?", "Grace"], ["S", "Grace. You're going to tell me I talk too fast.", "Camila"], ["P", "I'm going to tell you you talk too fast when you're nervous. When you're relaxed, like now, you're perfect. In interviews, I bet you go at double speed.", "Grace"], ["S", "Michael told Dev the same thing a year ago. Dev told me last month.", "Camila"], ["P", "Michael's a very wise man. Don't tell him I said that.", "Grace"], ["S", "So what do I do? I can't stop being nervous.", "Camila"], ["P", "No. But you can leave a pause before you answer. Count to two. People think you're thoughtful, and your brain catches up.", "Grace"], ["S", "Count to two. In Recife, if you pause for two seconds, someone else starts talking.", "Camila"], ["P", "Here, if you pause for two seconds, people think you're wise.", "Grace"], ["S", "That's a very strange country.", "Camila"], ["P", "It's a very quiet country. Okay, try it. Why should we hire you?", "Grace"], ["S", "One... two... Because I make loyalty programs that people actually use.", "Camila"], ["P", "See? That was perfect. And you didn't even need the other twenty sentences.", "Grace"], ["S", "It feels very slow.", "Camila"], ["P", "It sounds very confident.", "Grace"]], "words": 234, "kind": "story", "scene": "November, a ramen place on Robson Street. Grace and Camila.", "F": "Grace gives honest feedback gently: \"Can I be honest with you? As a friend?\" Her advice, leave a pause before you answer, is useful for anyone speaking a second language. \"Hmm\" here means she agrees but is being careful. The callback to script 7 shows that feedback travels slowly in Canada.", "V": "", "t": [[2.0, 4.01], [4.36, 5.97], [6.32, 8.14], [8.74, 9.81], [10.16, 11.85], [12.45, 14.01], [14.36, 16.52], [17.12, 19.38], [19.73, 21.59], [22.19, 22.92], [23.52, 24.87], [25.47, 26.44], [26.79, 28.54], [28.89, 29.99], [30.59, 31.34], [31.69, 33.93], [34.53, 37.4], [37.75, 40.03], [40.38, 42.94], [43.54, 46.14], [46.49, 48.18], [48.78, 50.68], [51.03, 52.73], [53.33, 54.72], [55.07, 56.78], [57.38, 57.99], [58.34, 60.65], [61.0, 62.25], [62.6, 65.57], [66.17, 67.27], [67.62, 71.5], [72.1, 75.4], [76.0, 77.83], [78.43, 80.28], [80.63, 82.07], [82.42, 83.94], [84.54, 85.15], [85.5, 86.16], [86.51, 90.03], [90.63, 91.27], [91.62, 93.01], [93.36, 96.12], [96.72, 98.19], [98.79, 100.61]], "R": [["A friend asks if they can be honest with you.", "Grace", "Can I be honest with you? As a friend?", "Of course. I'd rather know. What do you think?"], ["Someone asks you a classic interview question.", "Grace", "Why should we hire you?", "(pause) Because I build loyalty programs that people actually use."]]}, {"num": 48, "title": "On Site", "lines": [["P", "Sergio? Darren. Good to meet you. Grab a hard hat from the trailer. Safety first, even for interviews.", "Darren"], ["S", "Of course. Thank you for having me.", "Sergio"], ["P", "This is Miguel. He's an apprentice with us. Second year. He's from Brazil too.", "Darren"], ["P", "Opa! Tudo bem? Natal, in the northeast.", "Miguel"], ["S", "Goiânia. Nice to meet you.", "Sergio"], ["P", "Okay, so you see this panel? We're running power to all six floors. Walk me through what you'd check before energizing it.", "Darren"], ["S", "First, I check that everything is labelled and matches the drawings. Then I check the grounding, the torque on the connections, and the insulation resistance. And I make sure lockout is removed by the right person.", "Sergio"], ["P", "Good. Where did you learn lockout?", "Darren"], ["S", "In Brazil, we had a similar procedure. But I took the BC safety course in September.", "Sergio"], ["P", "Okay. What's your ticket situation now?", "Darren"], ["S", "My assessment is finished. I'm writing the Red Seal exam in April.", "Sergio"], ["P", "April. Okay. Until then, you'd be working under Miguel's supervisor, not on your own.", "Darren"], ["S", "That's fine. I understand.", "Sergio"], ["P", "He's very strict, but he buys pizza on Fridays.", "Miguel"], ["P", "Only when we're on schedule.", "Darren"], ["P", "So, never.", "Miguel"], ["P", "Ha! Watch it, apprentice. Okay, Sergio, here's what I can offer. A trial week. Paid. If it works out, we talk about something longer.", "Darren"], ["S", "That's great. When do I start?", "Sergio"], ["P", "Monday, six-thirty a.m. Steel-toe boots. Bring a lunch. The food truck is terrible.", "Darren"], ["P", "It's true. The food truck is a crime.", "Miguel"]], "words": 234, "kind": "story", "scene": "November, a construction site in Burquitlam. Noise of drills. Sergio meets Darren.", "F": "In the trades, interviews often happen on site, and they're practical: \"Walk me through what you'd check.\" Listen for trade words: \"energizing\" (turning on power), \"grounding,\" \"lockout\" (a safety procedure), \"apprentice,\" \"Red Seal\" (the national trade certificate). A paid \"trial week\" is common. \"Watch it\" is a joking warning. Miguel is from Natal, in the northeast of Brazil.", "V": "", "t": [[2.0, 2.95], [3.3, 4.07], [4.42, 5.74], [6.09, 8.4], [8.75, 11.29], [11.89, 12.6], [12.95, 14.16], [14.76, 16.14], [16.49, 18.53], [18.88, 19.94], [20.29, 22.03], [22.63, 23.31], [23.66, 24.58], [24.93, 26.69], [27.29, 28.0], [28.35, 29.4], [30.0, 31.98], [32.33, 35.02], [35.37, 38.92], [39.52, 43.16], [43.51, 48.29], [48.64, 51.7], [52.3, 52.92], [53.27, 55.1], [55.7, 57.89], [58.24, 61.02], [61.62, 62.5], [62.85, 65.1], [65.7, 67.02], [67.37, 69.46], [70.06, 70.84], [71.19, 72.07], [72.42, 77.01], [77.61, 78.34], [78.69, 79.55], [80.15, 82.95], [83.55, 85.61], [86.21, 87.22], [87.82, 88.55], [88.9, 90.55], [90.9, 93.76], [94.11, 95.3], [95.65, 96.36], [96.71, 99.68], [100.28, 101.04], [101.39, 102.35], [102.95, 103.64], [103.99, 105.37], [105.72, 106.78], [107.13, 109.24], [109.84, 110.7], [111.05, 112.77]], "R": [["An employer asks you to explain a work procedure.", "Darren", "Walk me through what you'd check before energizing this panel.", "First I'd check the labels against the drawings, then the grounding and connections, and make sure lockout is removed properly."], ["An employer offers you a trial period.", "Darren", "Here's what I can offer. A trial week. Paid.", "That's great, thank you. When would you like me to start?"]]}, {"num": 49, "title": "\"This Isn't an Interview\"", "lines": [["P", "Ana, thanks for coming in. Dana sent me your name. And Erin called me too, which never happens. So, relax. This isn't an interview. Just a conversation.", "Kevin"], ["S", "Thank you. It's very nice to meet you.", "Ana"], ["P", "So tell me about a time a handover between two contractors went badly.", "Kevin"], ["S", "Okay. On the São Paulo metro, the tunnel contractor finished a section two weeks early, which sounds good. But the station contractor wasn't ready, so the site sat empty, and then water got in. We lost three weeks.", "Ana"], ["P", "Ouch. What did you change?", "Kevin"], ["S", "We created a joint handover checklist, signed by both contractors and by us. And a weekly meeting with both teams in the same room, not separate meetings.", "Ana"], ["P", "Did the two contractors like being in the same room?", "Kevin"], ["S", "No. They hated it. For the first month. Then it became the most useful meeting of the week.", "Ana"], ["P", "And the result?", "Kevin"], ["S", "The next four handovers were on time. And we reduced rework by about thirty percent.", "Ana"], ["P", "Okay. You know this is an interview, right?", "Kevin"], ["S", "I suspected that, yes.", "Ana"], ["P", "Ha! Fair. Look, we're creating a new role. Interface coordinator. It's a level below project manager, but it's on the core team, and there's a clear path up.", "Kevin"], ["S", "That sounds interesting. What would the first six months look like?", "Ana"], ["P", "Chaos. Then organized chaos. Then, if you're good, just organized.", "Kevin"], ["S", "I like organized chaos.", "Ana"], ["P", "I thought you might. HR will post it next week. Apply formally, and mention this conversation.", "Kevin"], ["S", "I will. Thank you, Kevin.", "Ana"]], "words": 250, "kind": "story", "scene": "November, the site office for the MetroLink project. Ana meets Kevin.", "F": "\"This isn't an interview, just a conversation\" often means it is an interview. Ana answers with a clear story: the problem, what she changed, and the result with a number (\"thirty percent\"). This is sometimes called the STAR method. \"I suspected that\" is a polite, funny way of saying \"I knew.\" \"A clear path up\" means a chance of promotion.", "V": "", "t": [[2.0, 3.61], [3.96, 5.36], [5.71, 8.05], [8.4, 9.41], [9.76, 11.2], [11.55, 12.99], [13.59, 14.27], [14.62, 16.02], [16.62, 20.55], [21.15, 21.75], [22.1, 27.85], [28.2, 33.28], [33.63, 34.74], [35.34, 36.02], [36.37, 37.53], [38.13, 42.79], [43.14, 47.52], [48.12, 50.72], [51.32, 51.8], [52.15, 53.05], [53.4, 54.47], [54.82, 57.31], [57.91, 58.78], [59.38, 61.28], [61.63, 64.09], [64.69, 65.38], [65.73, 67.46], [68.06, 69.47], [70.07, 70.56], [70.91, 71.45], [71.8, 73.46], [73.81, 75.28], [75.63, 79.89], [80.49, 81.73], [82.08, 83.89], [84.49, 85.17], [85.52, 87.17], [87.52, 89.55], [90.15, 91.74], [92.34, 93.41], [93.76, 95.54], [95.89, 98.48], [99.08, 99.69], [100.04, 101.03]], "R": [["Someone says \"This isn't an interview,\" and then asks an interview question.", "Kevin", "Tell me about a time a handover went badly.", "Sure. On my last metro project, a section was finished early but the next contractor wasn't ready. Here's what we changed."], ["You want to know more about a new role.", "Kevin", "We're creating a new role. Interface coordinator.", "That sounds really interesting. What would the first six months look like?"]]}, {"num": 50, "title": "The HR Screen", "lines": [["P", "Hi Bruno, I'm Melissa from People and Culture at Cascadia. Thanks for making time. This should take about twenty minutes.", "Melissa"], ["S", "Thank you, Melissa. Happy to be here.", "Bruno"], ["P", "Great. So, to start, can you tell me a little about yourself?", "Melissa"], ["S", "Sure. I'm a financial analyst with about twelve years of experience. In Brazil, I led budgeting and forecasting for a manufacturing company with two thousand employees. Since I arrived in Canada, I've been working on contract with a non-profit, reviewing their budgets. And I'm working towards my CPA.", "Bruno"], ["P", "Great, thank you. And what interests you about Cascadia specifically?", "Melissa"], ["S", "Two things. First, the credit union model. We have something similar in southern Brazil, and I worked with a few of them. Second, I've had the chance to meet some of the finance team, and I like how they work.", "Bruno"], ["P", "Yes, I see Hannah Okafor's note here. She mentioned you shared a planning model with them.", "Melissa"], ["S", "Yes. With fake numbers, of course.", "Bruno"], ["P", "Ha! Of course. Okay, this role is a one-year contract. Is that okay with you?", "Melissa"], ["S", "Yes. I understand it's a contract.", "Bruno"], ["P", "And the salary range for this position is seventy-eight to eighty-five thousand. Does that work for you?", "Melissa"], ["S", "Yes, that works.", "Bruno"], ["P", "Great. Do you have any questions for me?", "Melissa"], ["S", "Yes. What does the next step look like?", "Bruno"], ["P", "If you move forward, you'd do a panel interview with Paul, our director, and two others. Possibly a short Excel exercise.", "Melissa"], ["S", "An Excel exercise. Okay. That's good news, actually.", "Bruno"], ["P", "You're the first person who's ever said that.", "Melissa"]], "words": 253, "kind": "story", "scene": "November, a video call. Bruno with Melissa from Cascadia's HR team.", "F": "HR screens are short and standard: \"Tell me about yourself,\" \"Why us?\", contract terms and salary. Bruno uses a two-minute version of his introduction and gives two clear reasons (\"First... Second...\"). \"People and Culture\" is a modern name for HR. Always ask about the next step at the end.", "V": "", "t": [[2.0, 5.59], [5.94, 7.54], [7.89, 9.98], [10.58, 12.0], [12.35, 13.79], [14.39, 15.13], [15.48, 18.37], [18.97, 19.67], [20.02, 23.8], [24.15, 30.24], [30.59, 36.17], [36.52, 38.79], [39.39, 40.69], [41.04, 43.8], [44.4, 45.45], [45.8, 47.76], [48.11, 52.26], [52.61, 57.28], [57.88, 60.3], [60.65, 63.35], [63.95, 64.7], [65.05, 66.95], [67.55, 68.19], [68.54, 69.54], [69.89, 72.56], [72.91, 74.48], [75.08, 75.83], [76.18, 78.31], [78.91, 83.19], [83.54, 84.9], [85.5, 86.88], [87.48, 88.22], [88.57, 90.18], [90.78, 91.53], [91.88, 93.68], [94.28, 98.66], [99.01, 101.38], [101.98, 103.85], [104.2, 105.12], [105.47, 107.35], [107.95, 110.31]], "R": [["An HR screener asks you to talk about yourself.", "Melissa", "Can you tell me a little about yourself?", "I'm a financial analyst with twelve years of experience. In Brazil, I led budgeting and forecasting for a large manufacturer, and here I'm on contract with a non-profit."], ["The screener asks if you have questions at the end.", "Melissa", "Do you have any questions for me?", "Yes, what does the next step look like, and when do you expect to make a decision?"]]}, {"num": 51, "title": "The Reference Call", "lines": [["S", "Hi Karen, it's Sam Patel from the surgical unit at St. Brendan's. I'm calling about Juliana Prado. She listed you as a reference.", "Sam"], ["P", "Oh, yes. Juliana. Happy to talk about her.", "Karen"], ["S", "Great. How do you know her?", "Sam"], ["P", "She volunteered in my emergency department for about six months, while she was getting her licence. And she's done a few casual shifts with us since she was registered.", "Karen"], ["S", "Okay. What are her strengths?", "Sam"], ["P", "She's calm. Genuinely calm, under pressure. She worked in a very busy emergency department in Salvador, in Brazil, so nothing surprises her. And she checks everything. Medications, orders, everything.", "Karen"], ["S", "Any areas for development?", "Sam"], ["P", "She's still learning our documentation system. She's thorough, but she's slower than our experienced nurses on the charting. It's improving every week.", "Karen"], ["S", "That's helpful. How is she with the team?", "Sam"], ["P", "Honestly? The team loves her. When she started volunteering, she folded blankets, and she did it so well that the nurses gave her a nickname. \"The blanket folder.\"", "Karen"], ["S", "Ha! Is that a good thing?", "Sam"], ["P", "In emergency, it means she does the small things right when nobody's watching. That's the best thing you can say about a nurse.", "Karen"], ["S", "Would you hire her again?", "Sam"], ["P", "I'm trying to. Honestly, Sam, if you don't hire her, I'll take her full-time myself. But I think she wants surgical experience.", "Karen"], ["S", "That's very clear. Thank you, Karen.", "Sam"], ["P", "Take good care of her.", "Karen"]], "words": 229, "kind": "story", "scene": "December, a hospital office. Karen takes a call from a hiring manager. Juliana doesn't hear this.", "F": "A reference call usually covers how the person knows you, your strengths, areas for development, teamwork, and \"Would you hire them again?\" Karen is honest about a weakness (slower charting) but shows it's improving, which makes her praise more believable. \"Areas for development\" is a polite way to say weaknesses.", "V": "", "t": [[2.0, 5.74], [6.09, 8.16], [8.51, 10.19], [10.79, 11.73], [12.08, 13.04], [13.39, 14.93], [15.53, 16.15], [16.5, 17.56], [18.16, 23.48], [23.83, 27.08], [27.68, 28.37], [28.72, 29.88], [30.48, 31.38], [31.73, 33.63], [33.98, 39.66], [40.01, 41.46], [41.81, 43.96], [44.56, 46.25], [46.85, 49.3], [49.65, 53.27], [53.62, 55.29], [55.89, 56.78], [57.13, 58.59], [59.19, 60.08], [60.43, 61.64], [61.99, 68.0], [68.35, 69.64], [70.24, 70.73], [71.08, 72.3], [72.9, 77.12], [77.47, 79.78], [80.38, 81.74], [82.34, 83.57], [83.92, 87.79], [88.14, 90.45], [91.05, 92.12], [92.47, 93.56], [94.16, 95.5]], "R": [["A hiring manager calls you for a reference about a colleague.", "Sam", "What are her strengths?", "She's very calm under pressure, and she's extremely careful with medications and orders."], ["The caller asks about a weakness.", "Sam", "Any areas for development?", "She's still learning our documentation system, so she's a bit slower with charting, but it's improving every week."]]}, {"num": 52, "title": "The Interview Invitation", "lines": [["P", "Thiago! Do you have a minute?", "Priscilla"], ["S", "Of course. Hi, Priscilla.", "Thiago"], ["P", "I just got out of a meeting with Jordan, our hiring manager. He wants to interview you.", "Priscilla"], ["S", "Really? That's amazing. Thank you so much.", "Thiago"], ["P", "Don't thank me yet. Thank your GitHub. He looked at your ferry scheduling project and said, \"Who wrote this? It's actually clean.\"", "Priscilla"], ["S", "\"Actually clean.\" Is that a compliment?", "Thiago"], ["P", "From Jordan, that's the biggest compliment possible. He says that about maybe two people a year.", "Priscilla"], ["S", "So what should I expect in the interview?", "Thiago"], ["P", "Three parts. A conversation about your experience, a technical part where you design a small system on a whiteboard, and a part about how you work in a remote team.", "Priscilla"], ["S", "The remote part I can talk about. Write everything down.", "Thiago"], ["P", "Exactly. Say that. He'll love it, because I told him you said it, and now he says it in every meeting.", "Priscilla"], ["S", "He's using my idea?", "Thiago"], ["P", "He's using your idea and pretending it's his. Which means he likes you.", "Priscilla"], ["S", "Okay. When is the interview?", "Thiago"], ["P", "HR will email you today. Probably next week. And Thiago, one more thing.", "Priscilla"], ["S", "Yes?", "Thiago"], ["P", "Test your internet the day before. Please.", "Priscilla"], ["S", "I bought a new router. And a cable. I'm not taking any chances.", "Thiago"], ["P", "A cable! Now I'm sure you're serious.", "Priscilla"], ["S", "I'm very serious. Thank you, Priscilla. For keeping in touch even when I didn't.", "Thiago"], ["P", "You'll buy me a coffee if you ever come to Toronto.", "Priscilla"]], "words": 235, "kind": "story", "scene": "December, a phone call. Priscilla calls Thiago.", "F": "Priscilla explains the interview format, which is a big advantage of having a contact inside a company. Listen to the three parts: experience, technical design, and remote teamwork. \"I'm not taking any chances\" means he's being extra careful. \"Clean\" code is clear and well-organized.", "V": "", "t": [[2.0, 2.87], [3.22, 4.51], [5.11, 5.82], [6.17, 7.06], [7.66, 11.23], [11.58, 13.2], [13.8, 14.39], [14.74, 15.61], [15.96, 16.9], [17.5, 18.92], [19.27, 20.65], [21.0, 24.62], [24.97, 26.43], [27.03, 28.07], [28.42, 29.51], [30.11, 33.02], [33.37, 36.01], [36.61, 38.37], [38.97, 40.14], [40.49, 49.08], [49.68, 51.36], [51.71, 52.83], [53.43, 54.55], [54.9, 55.94], [56.29, 60.63], [61.23, 62.37], [62.97, 65.83], [66.18, 67.88], [68.48, 69.12], [69.47, 70.54], [71.14, 73.25], [73.6, 75.1], [75.45, 77.23], [77.83, 78.35], [78.95, 81.05], [81.4, 82.29], [82.89, 83.93], [84.28, 85.06], [85.41, 86.91], [87.51, 88.54], [88.89, 90.66], [91.26, 92.27], [92.62, 93.62], [93.97, 95.9], [96.5, 99.49]], "R": [["A contact tells you a hiring manager wants to interview you.", "Priscilla", "He wants to interview you.", "That's amazing, thank you so much! Do you have any advice on what to expect?"], ["Your contact gives you a final piece of advice.", "Priscilla", "Test your internet the day before. Please.", "I will, I promise. I've even bought a new router and a cable."]]}]}, {"part": 7, "title": "Associations, Volunteering and Mentors", "desc": "Volunteering, mentors, chairing a meeting, and networking in unexpected places.", "scripts": [{"num": 53, "title": "At the Check-In Desk", "lines": [["S", "Okay, Erica, it's easy. They tell you their name, you find their badge, you smile. That's it.", "Ana"], ["P", "In Vitória, I organized events for five hundred people. Why am I so nervous about name badges?", "Erica"], ["S", "Because it's in English, and people say their names very fast. Watch. Hi, welcome! Can I get your name?", "Ana"], ["P", "Hi. Kowalczyk. Jen Kowalczyk.", "Jen"], ["S", "Sorry, could you spell your last name for me?", "Ana"], ["P", "K-O-W-A-L-C-Z-Y-K.", "Jen"], ["S", "Perfect. Here you go, Jen. Coats are on the left, and the bar is at the back.", "Ana"], ["P", "Thanks! Merry Christmas. Or happy holidays. Whatever you prefer.", "Jen"], ["S", "Happy holidays! See? Ask them to spell it. Nobody minds.", "Ana"], ["P", "Okay. I'll try the next one. Hi! Welcome. Can I get your name?", "Erica"], ["P", "Nguyen. Tom Nguyen.", "Tom"], ["P", "Sorry, could you say that once more?", "Erica"], ["P", "Nguyen. N-G-U-Y-E-N.", "Tom"], ["P", "Thank you, Tom. Here's your badge.", "Erica"], ["P", "You said it perfectly, by the way. Most people don't.", "Tom"], ["P", "Really? Thank you!", "Erica"], ["S", "Look at you. Five more minutes and you'll be running this desk.", "Ana"], ["P", "Ana, can I ask you something? You volunteer every month. Do you really think it helps you find a job?", "Erica"], ["S", "Honestly? Not directly. Nobody hires you because you gave them a badge. But every person who comes through this door sees me working. Erin says I'm reliable. Dana met me here. Kevin heard about me here.", "Ana"], ["P", "So the badges are like a very slow interview.", "Erica"], ["S", "A very slow, very cold interview. Close the door, the wind is coming in.", "Ana"]], "words": 238, "kind": "story", "scene": "December, the BC Project Leaders Network holiday mixer. Ana and a new volunteer at the door.", "F": "Asking someone to spell their name is normal and polite: \"Could you spell your last name for me?\" Listen carefully to the spellings; they're good practice. Ana explains why volunteering matters: people see her working, so they can recommend her. Erica is from Vitória, in the state of Espírito Santo.", "V": "", "t": [[2.0, 3.58], [3.93, 6.72], [7.07, 7.76], [8.36, 11.83], [12.18, 14.84], [15.44, 18.97], [19.32, 19.92], [20.27, 21.17], [21.52, 22.57], [23.17, 23.86], [24.21, 25.28], [25.63, 27.03], [27.63, 29.81], [30.41, 32.44], [33.04, 33.72], [34.07, 35.18], [35.53, 38.11], [38.71, 39.42], [39.77, 40.9], [41.25, 42.74], [43.09, 44.51], [45.11, 46.2], [46.55, 47.07], [47.42, 48.55], [48.9, 49.97], [50.57, 51.37], [51.72, 53.17], [53.52, 54.16], [54.51, 55.27], [55.62, 57.03], [57.63, 58.63], [58.98, 60.42], [61.02, 63.11], [63.71, 64.71], [65.06, 66.98], [67.58, 68.81], [69.16, 70.37], [70.97, 73.54], [73.89, 75.47], [76.07, 76.75], [77.1, 77.89], [78.49, 79.24], [79.59, 82.06], [82.66, 84.45], [84.8, 86.65], [87.0, 89.28], [89.88, 90.57], [90.92, 91.85], [92.2, 94.88], [95.23, 98.43], [98.78, 100.18], [100.53, 101.55], [101.9, 103.2], [103.8, 106.53], [107.13, 109.35], [109.7, 111.76]], "R": [["Someone says their name too quickly at a check-in desk.", "Jen", "Kowalczyk. Jen Kowalczyk.", "Sorry, could you spell your last name for me?"], ["A new volunteer asks if volunteering helps you find a job.", "Erica", "Do you really think it helps?", "Not directly, but people see you working, and that's how recommendations happen."]]}, {"num": 54, "title": "\"Will You Be My Mentor?\"", "lines": [["S", "Grace, can I ask you something a bit formal?", "Camila"], ["P", "Uh-oh. Are you proposing?", "Grace"], ["S", "Ha! No. I wanted to ask if you'd be my mentor. Officially.", "Camila"], ["P", "Oh, Camila. That's so nice. Can I be honest about the word, though?", "Grace"], ["S", "Of course.", "Camila"], ["P", "When someone says \"Will you be my mentor?\", it sounds like a big job. Like I'm signing a contract. And honestly, I'm busy, so my first reaction is to panic a little.", "Grace"], ["S", "Oh. I'm sorry. I didn't mean to give you a job.", "Camila"], ["P", "No, no, I want to help you. I already help you! What if we don't call it mentorship? What if we just have coffee once a month, and you bring me one problem each time?", "Grace"], ["S", "One problem a month.", "Camila"], ["P", "One problem. And you tell me what you've already tried. That way, I don't feel like I'm doing your homework.", "Grace"], ["S", "That sounds perfect. And I can help you too. I mean, I know you're more senior, but...", "Camila"], ["P", "Actually, you can. I have no idea how to do loyalty programs. Our agency keeps getting asked about them. You could tell me what I'm doing wrong.", "Grace"], ["S", "Oh, you're doing many things wrong.", "Camila"], ["P", "Ha! See? It's already working.", "Grace"], ["S", "So, first coffee. My problem this month: how do I learn that technology platform Northwind wanted? It's expensive to take the course.", "Camila"], ["P", "Okay. Ask them if they have a free partner certification. A lot of those platforms do. And post about it on LinkedIn when you finish.", "Grace"], ["S", "Done. Same day next month?", "Camila"], ["P", "Same day next month. You're buying.", "Grace"]], "words": 255, "kind": "story", "scene": "December, a café in Mount Pleasant. Camila and Grace.", "F": "In Canada, a formal request like \"Will you be my mentor?\" can feel like a big commitment. Grace suggests something lighter: \"coffee once a month\" and \"one problem each time.\" Good mentoring relationships go both ways. Camila offers her expertise too. \"Are you proposing?\" is a joke about asking someone to marry you.", "V": "", "t": [[2.0, 4.41], [5.01, 5.73], [6.08, 7.48], [8.08, 8.69], [9.04, 9.68], [10.03, 12.31], [12.66, 13.56], [14.16, 15.41], [15.76, 16.92], [17.27, 19.54], [20.14, 21.01], [21.61, 23.54], [23.89, 25.76], [26.11, 29.89], [30.49, 31.16], [31.51, 32.47], [32.82, 34.54], [35.14, 36.8], [37.15, 38.5], [38.85, 40.86], [41.21, 45.27], [45.87, 47.39], [47.99, 49.09], [49.44, 51.58], [51.93, 54.44], [55.04, 56.48], [56.83, 58.42], [58.77, 60.92], [61.52, 62.87], [63.22, 66.11], [66.46, 68.82], [69.17, 71.09], [71.69, 73.58], [74.18, 74.82], [75.17, 75.81], [76.16, 77.49], [78.09, 79.53], [79.88, 84.63], [84.98, 86.97], [87.57, 88.37], [88.72, 91.66], [92.01, 93.82], [94.17, 96.67], [97.27, 97.91], [98.26, 99.71], [100.31, 101.78], [102.13, 103.07]], "R": [["You want to ask someone for regular advice, without making it feel like a big commitment.", "Grace", "So, what did you want to ask me?", "Would you be open to a coffee once a month? I'd bring one specific problem each time."], ["Your mentor asks what problem you'd like to discuss.", "Grace", "So what's your problem this month?", "I need to learn a technology platform, but the course is expensive. Do you have any ideas?"]]}, {"num": 55, "title": "The First Mentoring Meeting", "lines": [["P", "Graziela? Hi, I'm Tom. I guess the program matched us.", "Tom"], ["S", "Hi, Tom. Thank you for volunteering your time. I read your profile. Twenty years in learning and development.", "Graziela"], ["P", "Twenty-two, but who's counting. Okay, let me start with a question I ask everyone. What do you want from these six months? Be specific.", "Tom"], ["S", "I want a job in corporate training.", "Graziela"], ["P", "Okay. That's the destination. But what do you want from me? What would make you say, in June, \"That was worth it\"?", "Tom"], ["S", "Hmm. Okay. Three things. First, I want to understand how training works in Canadian companies. Second, I want to rewrite my LinkedIn and resume in corporate language. And third, I want to meet five people in the field.", "Graziela"], ["P", "Okay, that's a great answer. I can help with all three. The third one is the most important.", "Tom"], ["S", "More important than the resume?", "Graziela"], ["P", "Much more. Nobody's going to read your resume until somebody says your name. Let's make that happen.", "Tom"], ["S", "How do I meet them? I don't want to just send messages to strangers.", "Graziela"], ["P", "You won't. I'll introduce you to one person each month. You'll meet them, and then you'll tell me what you learned. Deal?", "Tom"], ["S", "Deal. Can I ask one thing about you?", "Graziela"], ["P", "Sure.", "Tom"], ["S", "Why do you volunteer as a mentor?", "Graziela"], ["P", "Honestly? My mother came from Germany in the sixties. She was a teacher there, and here she cleaned offices for ten years because nobody gave her a chance. I'm trying to be the person she needed.", "Tom"], ["S", "Thank you for telling me that.", "Graziela"], ["P", "So, shall we start?", "Tom"]], "words": 257, "kind": "story", "scene": "January, a meeting room at a downtown library. Graziela meets her assigned mentor.", "F": "Tom pushes Graziela to make her goals specific: \"What would make you say, in June, 'That was worth it'?\" Her answer has three clear parts. Notice why meeting people matters most: \"Nobody's going to read your resume until somebody says your name.\"", "V": "", "t": [[2.0, 3.13], [3.48, 5.33], [5.68, 8.01], [8.61, 9.4], [9.75, 11.64], [11.99, 13.12], [13.47, 15.52], [16.12, 18.54], [18.89, 22.49], [22.84, 25.43], [25.78, 27.08], [27.68, 29.63], [30.23, 31.24], [31.59, 33.36], [33.71, 35.71], [36.06, 39.28], [39.88, 40.35], [40.7, 41.34], [41.69, 42.51], [42.86, 46.95], [47.3, 51.59], [51.94, 54.58], [55.18, 57.64], [57.99, 60.11], [60.46, 63.18], [63.78, 65.29], [65.89, 67.04], [67.39, 71.64], [71.99, 73.83], [74.43, 75.51], [75.86, 78.61], [79.21, 80.31], [80.66, 83.85], [84.2, 87.14], [87.49, 88.39], [88.99, 89.51], [89.86, 91.47], [92.07, 92.82], [93.42, 95.28], [95.88, 96.9], [97.25, 100.36], [100.71, 106.59], [106.94, 109.56], [110.16, 111.61], [112.21, 114.0]], "R": [["A new mentor asks what you want from the program.", "Tom", "What do you want from these six months? Be specific.", "Three things: to understand how training works here, to rewrite my profile in corporate language, and to meet five people in the field."], ["You want to ask your mentor a personal question politely.", "Graziela", "Can I ask one thing about you?", "Why did you decide to become a volunteer mentor?"]]}, {"num": 56, "title": "Running the Meeting", "lines": [["S", "Okay, it's seven o'clock. Let's start. Thanks, everyone, for joining. We have three items tonight and we'll finish by seven forty-five. First, the budget for the Festa Junina in June.", "Bruno"], ["P", "Before we start, can I say something about the parking at the community centre? It's terrible.", "Gord"], ["S", "Thanks, Gord. Parking is important. Let's add it to the end of the agenda, so we can finish the budget first. Is that okay?", "Bruno"], ["P", "Sure, sure.", "Gord"], ["S", "Thank you. Denise, you prepared the numbers?", "Bruno"], ["P", "Yes. Last year, the festa cost eight thousand dollars and we brought in nine thousand five hundred. This year, the hall is more expensive. Plus fifteen percent.", "Denise"], ["S", "Okay. So, if we keep ticket prices the same, we still make a small profit, but less. Do we want to raise ticket prices?", "Bruno"], ["P", "In João Pessoa, if you raise the price of a festa junina, people riot.", "Denise"], ["S", "Ha! In Porto Alegre too. What if we keep the price, and find one more sponsor? Denise, could you contact the Brazilian bakery on Commercial Drive?", "Bruno"], ["P", "Sure. I'll call them this week.", "Denise"], ["S", "Great. And Gord, you know the hardware store owner, right?", "Bruno"], ["P", "Doug? Yes. He loves this festival. He came last year in a cowboy hat.", "Gord"], ["S", "Could you ask Doug if he'd sponsor the music?", "Bruno"], ["P", "I'll ask him tomorrow.", "Gord"], ["S", "Perfect. So, actions: Denise calls the bakery, Gord asks Doug, and I'll update the budget by Friday. Next item. Gord, now we can talk about parking.", "Bruno"], ["P", "Finally.", "Gord"]], "words": 240, "kind": "story", "scene": "January, a video call. Bruno chairs the finance committee of the Brazilian-Canadian Community Association.", "F": "Volunteering in a leadership role gives you Canadian experience you can talk about in interviews. Bruno runs the meeting well: he states the end time, moves Gord's topic \"to the end of the agenda,\" and finishes with clear actions. Festa Junina is a Brazilian June festival. Denise is from João Pessoa, in the northeast of Brazil.", "V": "", "t": [[2.0, 3.92], [4.27, 5.39], [5.74, 7.66], [8.01, 11.81], [12.16, 15.17], [15.77, 20.5], [20.85, 21.95], [22.55, 23.81], [24.16, 25.94], [26.29, 30.31], [30.66, 32.03], [32.63, 33.69], [34.29, 35.15], [35.5, 37.5], [38.1, 38.8], [39.15, 44.33], [44.68, 47.07], [47.42, 48.85], [49.45, 50.37], [50.72, 55.31], [55.66, 57.8], [58.4, 62.93], [63.53, 64.2], [64.55, 66.44], [66.79, 69.76], [70.11, 74.36], [74.96, 75.55], [75.9, 77.32], [77.92, 78.66], [79.01, 81.87], [82.47, 83.15], [83.5, 84.22], [84.57, 86.39], [86.74, 89.41], [90.01, 92.53], [93.13, 94.88], [95.48, 96.32], [96.67, 102.46], [102.81, 103.99], [104.34, 106.67], [107.27, 108.14]], "R": [["Someone raises an unrelated topic at the start of a meeting you're chairing.", "Gord", "Can I say something about the parking? It's terrible.", "Thanks, Gord. Let's add that to the end of the agenda so we can finish the budget first."], ["You want to summarize the actions at the end of a discussion.", "Bruno", "So, what are the next steps?", "Denise will call the bakery, Gord will ask Doug about sponsoring the music, and I'll update the budget by Friday."]]}, {"num": 57, "title": "The Chairlift", "lines": [["P", "Mind if I join you?", "Ryan"], ["S", "Of course. There's room.", "Thiago"], ["P", "Beautiful day. You can see all the way to Vancouver Island.", "Ryan"], ["S", "It's amazing. It's my first time skiing, actually. Well, my third time. The first two were mostly falling.", "Thiago"], ["P", "Ha! That's skiing. Where are you from?", "Ryan"], ["S", "Brazil. Florianópolis. We have beaches, not mountains. It's my first winter with snow.", "Thiago"], ["P", "And you chose to learn to ski? That's brave.", "Ryan"], ["S", "My colleagues said it's the Vancouver thing to do. Ski in the morning, work in the afternoon.", "Thiago"], ["P", "That's the dream. What do you do?", "Ryan"], ["S", "I'm a software developer. I just started a new job, actually, remote, for a company in Toronto.", "Thiago"], ["P", "Congrats! Toronto. Do they make you go there?", "Ryan"], ["S", "Twice a year. I'm very happy to stay here.", "Thiago"], ["P", "I don't blame you. I run a small software company in Gastown. We build tools for ski resorts, funnily enough. Lift tickets, that kind of thing.", "Ryan"], ["S", "So this chairlift is research?", "Thiago"], ["P", "Exactly. This is a business trip. Don't tell my wife.", "Ryan"], ["S", "Ha! Your secret is safe.", "Thiago"], ["P", "Okay, we're almost at the top. Lift the bar. What's your name, by the way?", "Ryan"], ["S", "Thiago.", "Thiago"], ["P", "Ryan. Hey, if you're ever in Gastown, come by for a coffee. We like meeting developers. Even happily employed ones.", "Ryan"], ["S", "I'd like that. Good luck with your research.", "Thiago"], ["P", "Keep your skis straight when we get off!", "Ryan"], ["S", "I'll try. No promises.", "Thiago"]], "words": 227, "kind": "story", "scene": "February, Cypress Mountain. Thiago shares a chairlift with a stranger.", "F": "Networking happens in unexpected places, like a chairlift. Thiago keeps it relaxed and friendly, and he doesn't ask for anything, because he already has a job. Ryan's invitation, \"come by for a coffee,\" comes naturally from good small talk. \"I don't blame you\" means \"I understand why.\" Thiago finally has a job, at Priscilla's company.", "V": "", "t": [[2.0, 3.14], [3.74, 4.45], [4.8, 5.49], [6.09, 6.98], [7.33, 9.62], [10.22, 11.04], [11.39, 13.23], [13.58, 14.74], [15.09, 16.62], [17.22, 17.71], [18.06, 18.89], [19.24, 20.11], [20.71, 21.32], [21.67, 22.64], [22.99, 24.54], [24.89, 26.39], [26.99, 28.45], [28.8, 29.62], [30.22, 32.55], [32.9, 34.76], [35.36, 36.23], [36.58, 37.41], [38.01, 39.25], [39.6, 43.75], [44.35, 45.04], [45.39, 46.2], [46.55, 47.79], [48.39, 49.18], [49.53, 50.95], [51.55, 52.54], [52.89, 55.4], [55.75, 58.41], [58.76, 60.3], [60.9, 62.42], [63.02, 63.8], [64.15, 65.32], [65.67, 66.74], [67.34, 67.83], [68.18, 69.35], [69.95, 71.51], [71.86, 72.7], [73.05, 74.24], [74.84, 75.53], [76.13, 76.7], [77.05, 79.7], [80.05, 81.52], [81.87, 83.42], [84.02, 84.82], [85.17, 86.45], [87.05, 88.78], [89.38, 90.07], [90.42, 91.32]], "R": [["A stranger starts a conversation on a chairlift.", "Ryan", "Beautiful day. Where are you from?", "Brazil, from Florianópolis. We have beaches, not mountains, so this is all new for me!"], ["Someone invites you to visit their company.", "Ryan", "If you're ever in Gastown, come by for a coffee.", "I'd really like that. Thanks, Ryan. I'll send you a message."]]}, {"num": 58, "title": "Lunar New Year", "lines": [["P", "Camila! Come in, come in. Happy Lunar New Year! Take your shoes off, there are slippers by the door.", "Grace"], ["S", "Happy New Year! Thank you for inviting me. I brought brigadeiros. They're Brazilian chocolate sweets.", "Camila"], ["P", "Oh, perfect. My uncle is going to eat all of them. Uncle Henry, this is Camila, my friend from work. Well, my friend from networking.", "Grace"], ["P", "Camila! Grace talks about you. You're the loyalty program expert.", "Henry"], ["S", "That's very kind. I'm not sure about \"expert.\"", "Camila"], ["P", "Grace says expert, so you're an expert. Try the dumplings. My mother made them. She made two hundred.", "Henry"], ["S", "Two hundred? That's amazing. They're delicious.", "Camila"], ["P", "So, Camila, can I ask you a question? My business. I have six bakeries. Richmond, Burnaby, two in Vancouver. We have a stamp card. Buy ten buns, get one free.", "Henry"], ["S", "The paper card.", "Camila"], ["P", "The paper card. Customers lose it. My daughter wants an app. Is an app a good idea?", "Henry"], ["S", "Honestly? Maybe not first. Many small businesses make an app, and nobody downloads it. Do you know who your best customers are?", "Camila"], ["P", "The aunties. Every morning, eight a.m.", "Henry"], ["S", "Then maybe start simple. A digital stamp card, connected to the phone number. Nothing to download. The aunties just say their number at the counter.", "Camila"], ["P", "Just the phone number?", "Henry"], ["S", "Just the phone number. And then you learn who comes every day, and you can thank them.", "Camila"], ["P", "Grace, she's good. Camila, would you come to the Richmond bakery one morning? I'll pay you, of course.", "Henry"], ["S", "I'd love to. As long as there are buns.", "Camila"], ["P", "Unlimited buns.", "Henry"]], "words": 254, "kind": "story", "scene": "February, Grace's family's home in Richmond.", "F": "Celebrations are a natural way to meet people outside work. Camila gives useful advice without trying to sell herself, and Henry offers paid work. Listen to her advice: \"start simple,\" \"nothing to download.\" Brigadeiros are traditional Brazilian chocolate sweets. Taking your shoes off is common in many Vancouver homes.", "V": "", "t": [[2.0, 2.85], [3.2, 4.51], [4.86, 6.48], [6.83, 9.56], [10.16, 11.35], [11.7, 13.41], [13.76, 15.36], [15.71, 17.76], [18.36, 19.68], [20.03, 22.29], [22.64, 25.5], [25.85, 27.76], [28.36, 29.44], [29.79, 31.86], [32.21, 34.93], [35.53, 36.87], [37.22, 38.97], [39.57, 42.51], [42.86, 44.57], [44.92, 46.75], [47.1, 48.99], [49.59, 50.52], [50.87, 52.03], [52.38, 53.57], [54.17, 57.06], [57.41, 58.78], [59.13, 61.32], [61.67, 64.72], [65.07, 66.93], [67.28, 69.87], [70.47, 71.64], [72.24, 73.66], [74.01, 75.63], [75.98, 77.74], [78.09, 80.08], [80.68, 81.53], [81.88, 83.18], [83.53, 87.03], [87.38, 89.43], [90.03, 91.13], [91.48, 92.2], [92.8, 94.46], [94.81, 97.81], [98.16, 99.57], [99.92, 102.41], [103.01, 104.64], [105.24, 106.67], [107.02, 110.16], [110.76, 112.46], [112.81, 116.47], [116.82, 118.86], [119.46, 120.56], [120.91, 122.51], [123.11, 124.84]], "R": [["You arrive at a friend's family celebration.", "Grace", "Happy Lunar New Year! Come in.", "Happy New Year! Thank you for inviting me. I brought some brigadeiros, Brazilian chocolate sweets."], ["Someone asks your professional opinion at a party.", "Henry", "My daughter wants an app. Is an app a good idea?", "Maybe not first. A simple digital stamp card linked to the phone number could be easier for your customers."]]}, {"num": 59, "title": "The Hardest Coffee", "lines": [["P", "You look tired.", "Michael"], ["S", "I am tired. The interface coordinator job. Kevin wants me. But HR says I need a Canadian construction safety certificate before they can make an offer.", "Ana"], ["P", "Ah. How long does that take?", "Michael"], ["S", "Six weeks. And the course starts in March. So they might give the job to someone else.", "Ana"], ["P", "Did Kevin say that?", "Michael"], ["S", "No. Kevin said, \"We'll figure it out.\" But I don't know what that means here.", "Ana"], ["P", "In Kevin's case, it means he's going to fight HR for you. I've known him for fifteen years.", "Michael"], ["S", "Really?", "Ana"], ["P", "Really. If Kevin didn't want you, he'd say \"Let's see what happens.\" That's the phrase to worry about.", "Michael"], ["S", "\"We'll figure it out\" is good. \"Let's see what happens\" is bad.", "Ana"], ["P", "You're learning the language.", "Michael"], ["S", "Michael, can I tell you something? Sometimes I'm so tired of starting again. In São Paulo, I was a senior manager. People asked me for advice. Here, I'm learning how to say hello at meetups.", "Ana"], ["P", "I know. My father was an engineer in Hong Kong. When he arrived here in nineteen eighty-two, he drove a taxi for four years.", "Michael"], ["S", "I didn't know that.", "Ana"], ["P", "He used to say, \"The second time you build a career, you build it faster, because you know where the foundations go.\" He became a city engineer. He retired as a director.", "Michael"], ["S", "That's a beautiful sentence.", "Ana"], ["P", "He was a very annoying man. But he was right about that.", "Michael"], ["S", "So I sign up for the safety course?", "Ana"], ["P", "You sign up today. And you tell Kevin you've signed up today. Then he has something to show HR.", "Michael"]], "words": 262, "kind": "story", "scene": "February, the café in Yaletown. Ana and Michael.", "F": "Michael helps Ana decode two phrases: \"We'll figure it out\" (positive, he's committed) and \"Let's see what happens\" (a warning sign). He shares a personal story about his father, which makes the advice stronger. \"Where the foundations go\" is a building metaphor: you know where to start. \"Sign up\" means register.", "V": "", "t": [[2.0, 3.07], [3.67, 4.58], [4.93, 6.74], [7.09, 8.1], [8.45, 14.29], [14.89, 15.4], [15.75, 17.22], [17.82, 18.64], [18.99, 20.45], [20.8, 22.75], [23.35, 24.5], [25.1, 25.58], [25.93, 27.73], [28.08, 29.64], [30.24, 34.17], [34.52, 36.41], [37.01, 37.61], [38.21, 38.89], [39.24, 42.69], [43.04, 44.76], [45.36, 46.77], [47.12, 48.66], [49.26, 50.65], [51.25, 52.99], [53.34, 55.81], [56.16, 58.56], [58.91, 60.39], [60.74, 63.27], [63.87, 64.59], [64.94, 67.42], [67.77, 72.69], [73.29, 74.29], [74.89, 81.98], [82.33, 83.98], [84.33, 86.06], [86.66, 88.08], [88.68, 90.35], [90.7, 92.18], [92.78, 94.62], [95.22, 96.42], [96.77, 98.89], [99.24, 101.37]], "R": [["A mentor notices you look tired.", "Michael", "You look tired.", "I am. A job I really want depends on a certificate, and the course doesn't start until March."], ["You want to show an employer you're committed.", "Michael", "Tell Kevin you've signed up today.", "That's a great idea. I'll register for the course this afternoon and email him right away."]]}, {"num": 60, "title": "Paying It Forward", "lines": [["P", "Hi. They said you're the engineer? Fausto?", "Rodrigo"], ["S", "That's me. Sit down, please. You're Rodrigo?", "Fausto"], ["P", "Yes. I arrived three weeks ago. From Belém.", "Rodrigo"], ["S", "Belém! I'm from Manaus. We're almost neighbours. Only a few days by boat.", "Fausto"], ["P", "Ha! Exactly. So, I'm a civil engineer. Fifteen years, mostly roads and drainage. And I've sent maybe forty applications. Nothing. Not even one interview.", "Rodrigo"], ["S", "Forty applications in three weeks. You've been busy. Can I ask you something? For what jobs?", "Fausto"], ["P", "Engineer jobs. Project engineer, design engineer.", "Rodrigo"], ["S", "Do you have your licence here yet?", "Fausto"], ["P", "No. I didn't start the process. It looks very complicated.", "Rodrigo"], ["S", "I know. I said the exact same words, last year, to a woman named Ana. In a Tim Hortons.", "Fausto"], ["P", "And what did she say?", "Rodrigo"], ["S", "She said, \"I don't think the problem is your age, I think the problem is the licence.\" For you, it's not age. But it's the licence.", "Fausto"], ["P", "So I'm applying for the wrong jobs.", "Rodrigo"], ["S", "For now. Start the licence process this week. And in the meantime, apply for roles that don't need it. Inspection, construction coordination, drainage technician. I'm working as a site inspector right now, while I finish mine.", "Fausto"], ["P", "Is it good?", "Rodrigo"], ["S", "It's good. It's Canadian experience, and I'm on real projects. And my licence interview is in April.", "Fausto"], ["P", "Okay. I'll start this week. Thank you, Fausto.", "Rodrigo"], ["S", "And Rodrigo? Next month, come to Dev's meetup. There's someone I want you to meet.", "Fausto"], ["P", "Who?", "Rodrigo"], ["S", "Ana. She'll tell you to stop sending forty applications.", "Fausto"]], "words": 244, "kind": "story", "scene": "February, a newcomer employment centre in Burnaby. Fausto is volunteering.", "F": "A year after script 22, Fausto gives Rodrigo the same advice Ana gave him. \"Paying it forward\" means helping someone because someone once helped you. Listen for how Fausto has progressed: site inspector, licence interview in April. Belém and Manaus are both cities in the Amazon region. Rodrigo is from Belém.", "V": "", "t": [[2.0, 2.71], [3.06, 4.73], [5.08, 6.07], [6.67, 7.46], [7.81, 9.12], [9.47, 10.45], [11.05, 11.8], [12.15, 14.01], [14.36, 15.46], [16.06, 16.71], [17.06, 18.18], [18.53, 19.8], [20.15, 21.76], [22.36, 23.03], [23.38, 24.38], [24.73, 26.64], [26.99, 29.74], [30.09, 32.64], [32.99, 33.83], [34.18, 35.97], [36.57, 38.55], [38.9, 39.93], [40.28, 41.75], [42.1, 43.17], [43.77, 45.3], [45.65, 48.01], [48.61, 50.21], [50.81, 51.56], [51.91, 53.7], [54.05, 55.9], [56.5, 57.23], [57.58, 60.88], [61.23, 62.58], [63.18, 64.71], [65.31, 69.69], [70.04, 71.57], [71.92, 73.21], [73.81, 76.03], [76.63, 77.32], [77.67, 79.67], [80.02, 82.8], [83.15, 86.44], [86.79, 89.94], [90.54, 91.58], [92.18, 92.9], [93.25, 96.25], [96.6, 98.79], [99.39, 100.31], [100.66, 102.25], [102.6, 104.12], [104.72, 105.66], [106.01, 107.93], [108.28, 110.01], [110.61, 111.25], [111.85, 112.51], [112.86, 115.49]], "R": [["A newcomer tells you they've sent many applications with no answer.", "Rodrigo", "I've sent forty applications. Nothing. Not even one interview.", "That's really frustrating. Can I ask what kind of jobs you're applying for?"], ["Someone thanks you for your advice.", "Rodrigo", "Thank you, Fausto.", "You're welcome. Someone helped me the same way last year. Come to the meetup next month, I'll introduce you to people."]]}]}, {"part": 8, "title": "Reading the Signals", "desc": "Polite phrases, real offers, brush-offs, and good news in plain words.", "scripts": [{"num": 61, "title": "What Did They Really Mean?", "lines": [["P", "Okay, new game. I say something a Canadian said to me, and you guess what they really meant.", "Camila"], ["P", "This is going to be painful.", "Bruno"], ["P", "First one. \"Let's grab a coffee sometime.\"", "Camila"], ["P", "That means... maybe never?", "Juliana"], ["P", "Correct! \"Sometime\" with no date means maybe never.", "Camila"], ["S", "Unless they say the day. \"Let's grab coffee Thursday\" is real.", "Ana"], ["P", "Exactly. Next. \"That's an interesting idea.\"", "Camila"], ["S", "Oh, I know this one. Michael taught me. It often means, \"I don't agree, but I'm too polite to say so.\"", "Ana"], ["P", "Wait, really? My manager at the non-profit says that every time I suggest something.", "Bruno"], ["P", "Bruno.", "Camila"], ["P", "I'm going to cry into my feijoada.", "Bruno"], ["P", "Okay, my turn. A nurse said to me, \"You might want to double-check that order.\" What does that mean?", "Juliana"], ["P", "It means you made a mistake, and she's being nice about it.", "Nathalia"], ["P", "Yes! I checked, and I had the wrong dose. \"You might want to\" is never a suggestion.", "Juliana"], ["P", "Okay, last one. This is the hardest. \"I'll see what I can do.\"", "Camila"], ["P", "That's positive. They're going to try.", "Bruno"], ["P", "Not always. It depends what happens next. If they ask you to send something, it's real. If they just smile and change the subject, it's polite.", "Nathalia"], ["S", "Sarah said that to me in October. And then she called me with the transit client.", "Ana"], ["P", "Because she asked you questions afterwards. That's the signal. Real interest asks for details.", "Nathalia"], ["P", "Real interest asks for details. Somebody write that down.", "Camila"], ["P", "I'm writing it on my napkin.", "Bruno"], ["P", "In Salvador, we just say what we mean.", "Juliana"], ["P", "In Santos too. And then we're surprised when people cry.", "Nathalia"]], "words": 259, "kind": "story", "scene": "March, a Brazilian potluck at Camila's apartment.", "F": "Many polite phrases have hidden meanings. \"Sometime\" with no date often means maybe never. \"You might want to double-check\" means \"there's a mistake.\" \"I'll see what I can do\" depends on what comes next. The key rule: \"Real interest asks for details.\" Feijoada is a traditional Brazilian bean stew.", "V": "", "t": [[2.0, 3.32], [3.67, 7.79], [8.39, 10.31], [10.91, 11.92], [12.27, 14.28], [14.88, 15.71], [16.06, 16.89], [17.49, 18.33], [18.68, 21.24], [21.84, 23.13], [23.48, 25.74], [26.34, 27.3], [27.65, 28.38], [28.73, 30.6], [31.2, 32.37], [32.72, 33.75], [34.1, 37.85], [38.45, 39.65], [40.0, 44.25], [44.85, 45.62], [46.22, 48.76], [49.36, 50.39], [50.74, 54.03], [54.38, 55.31], [55.91, 59.15], [59.75, 60.27], [60.62, 62.38], [62.73, 65.03], [65.63, 66.99], [67.34, 68.91], [69.26, 70.76], [71.36, 72.72], [73.07, 74.52], [75.12, 76.33], [76.68, 78.69], [79.04, 81.53], [81.88, 85.07], [85.67, 87.41], [87.76, 90.01], [90.61, 93.09], [93.44, 94.73], [95.08, 97.51], [98.11, 100.3], [100.65, 102.26], [102.86, 104.87], [105.47, 107.63], [108.23, 109.9], [110.25, 112.63]], "R": [["Someone says \"Let's grab a coffee sometime\" and you want to make it real.", "Camila", "Let's grab a coffee sometime!", "I'd love that. Would next Thursday morning work for you?"], ["A colleague says \"You might want to double-check that.\"", "Juliana", "You might want to double-check that order.", "Thank you for catching that. I'll check it right now."]]}, {"num": 62, "title": "A Real Offer", "lines": [["P", "So Tom says you were a teacher for eleven years. Honestly, teachers make the best trainers. You already know how to keep a room awake.", "Nadia"], ["S", "Thank you. Keeping teenagers awake at eight a.m. is my special skill.", "Graziela"], ["P", "Ha! I believe it. So what are you looking for?", "Nadia"], ["S", "A role in corporate training or learning design. I'm doing a certificate in instructional design right now, and I finish in April.", "Graziela"], ["P", "Okay. Here's the thing. We have a new safety training program launching in the summer, for our warehouse staff. Two hundred people, three languages.", "Nadia"], ["S", "Three languages?", "Graziela"], ["P", "English, Punjabi, and Tagalog. Mostly. Which is a nightmare.", "Nadia"], ["S", "In Belo Horizonte, I taught classes where half the students spoke a different first language. You design for the person in the back who's lost, not the person in the front who's perfect.", "Graziela"], ["P", "Okay, I'm writing that down. Graziela, I want to be clear about something. I'm not just being polite now. Can you send me your resume today?", "Nadia"], ["S", "Today? Yes, of course.", "Graziela"], ["P", "And one of your lesson plans. Anything. Translate it if you need to. I want to show my director what you can do.", "Nadia"], ["S", "I can send you something tonight.", "Graziela"], ["P", "Perfect. The contract role gets posted in two weeks, and I want her to know your name before it's posted.", "Nadia"], ["S", "Thank you, Nadia. Can I ask, what's the best way to follow up?", "Graziela"], ["P", "Email me. If I don't reply in three days, text me. I'm terrible with email.", "Nadia"], ["S", "Three days, then a text. Okay.", "Graziela"], ["P", "And tell Tom he owes me lunch.", "Nadia"]], "words": 257, "kind": "story", "scene": "March, a café in Kitsilano. Graziela meets Nadia, one of Tom's contacts.", "F": "This is what a real offer sounds like. Nadia asks for specific things (\"your resume today,\" \"one of your lesson plans\"), gives a deadline (\"two weeks\"), and explains how to follow up. Compare this with vague phrases like \"Let's stay in touch.\" Nadia even says it directly: \"I'm not just being polite now.\"", "V": "", "t": [[2.0, 4.86], [5.21, 7.66], [8.01, 10.34], [10.94, 11.61], [11.96, 15.69], [16.29, 16.93], [17.28, 18.41], [18.76, 20.3], [20.9, 23.54], [23.89, 28.98], [29.58, 30.38], [30.73, 31.91], [32.26, 36.38], [36.73, 38.98], [39.58, 40.59], [41.19, 43.25], [43.6, 44.42], [44.77, 46.1], [46.7, 52.11], [52.46, 57.35], [57.95, 59.85], [60.2, 62.75], [63.1, 65.02], [65.37, 67.39], [67.99, 68.55], [68.9, 69.83], [70.43, 72.14], [72.49, 73.3], [73.65, 75.42], [75.77, 78.18], [78.78, 80.46], [81.06, 81.95], [82.3, 87.39], [87.99, 88.98], [89.33, 91.66], [92.26, 93.39], [93.74, 96.15], [96.5, 98.15], [98.75, 100.09], [100.44, 101.08], [101.68, 103.66]], "R": [["Someone shows real interest and asks for something specific.", "Nadia", "Can you send me your resume today?", "Yes, of course. I'll send it this afternoon, along with one of my lesson plans."], ["A contact explains how to follow up with them.", "Nadia", "Email me. If I don't reply in three days, text me.", "Perfect. I'll email you tonight, and text you if I haven't heard back by Friday."]]}, {"num": 63, "title": "The Polite Brush-Off", "lines": [["S", "Hi, excuse me. I'm Sergio. I'm an electrician, working with Pacific Spark on the Burquitlam project.", "Sergio"], ["P", "Oh, hey. Brian.", "Brian"], ["S", "Nice to meet you, Brian. Which company are you with?", "Sergio"], ["P", "Northshore Builders.", "Brian"], ["S", "Oh, I've heard of them. You're building the tower near Lougheed, right?", "Sergio"], ["P", "Mm-hmm.", "Brian"], ["S", "How's it going? It looks like a big project.", "Sergio"], ["P", "Yeah, it's fine. Busy.", "Brian"], ["S", "I can imagine. I worked on a lot of high-rises in Goiânia. Are you a superintendent?", "Sergio"], ["P", "Project manager. Sorry, I'm just looking for someone. Have you seen a guy in a grey suit? Tall?", "Brian"], ["S", "Sorry, no.", "Sergio"], ["P", "Okay. Well, good to meet you, Sergio. Enjoy the evening.", "Brian"], ["S", "You too, Brian. Good luck with the tower.", "Sergio"], ["P", "Sergio! What was that? He looked like he wanted to escape.", "Miguel"], ["S", "He did want to escape. Short answers, looking over my shoulder, \"good to meet you, enjoy the evening.\"", "Sergio"], ["P", "Did he do something wrong?", "Miguel"], ["S", "No. Maybe he's busy. Maybe he's tired. Maybe he only wants to talk to his boss tonight. It's not personal.", "Sergio"], ["P", "In Natal, if someone talked to me like that, I'd think he hated me.", "Miguel"], ["S", "In Goiânia too. Here, it just means \"not now.\" So I leave fast and smile. Maybe next time he remembers me as the polite electrician.", "Sergio"], ["P", "You're very calm about it.", "Miguel"], ["S", "I've been practising. Come on, there's a woman from the electrical union over there. She's smiling. That's a good sign.", "Sergio"]], "words": 229, "kind": "story", "scene": "March, a construction industry mixer at a hotel in Burnaby.", "F": "Learn to recognize a polite brush-off: short answers (\"Mm-hmm,\" \"Yeah, it's fine\"), looking for someone else, and a closing phrase like \"Good to meet you, enjoy the evening.\" Sergio leaves quickly and politely, without taking it personally. That leaves a good impression for the future.", "V": "", "t": [[2.0, 3.03], [3.38, 4.23], [4.58, 8.97], [9.57, 10.54], [10.89, 11.73], [12.33, 13.57], [13.92, 15.16], [15.76, 17.31], [17.91, 18.93], [19.28, 21.29], [21.89, 22.88], [23.48, 24.35], [24.7, 26.25], [26.85, 28.23], [28.58, 29.31], [29.91, 30.84], [31.19, 33.64], [33.99, 35.27], [35.87, 37.31], [37.66, 39.88], [40.23, 42.77], [43.12, 43.85], [44.45, 45.22], [45.82, 46.7], [47.05, 49.21], [49.56, 51.1], [51.7, 52.65], [53.0, 54.16], [54.76, 55.58], [55.93, 57.02], [57.37, 59.2], [59.8, 61.02], [61.37, 65.78], [66.38, 67.95], [68.55, 69.07], [69.42, 70.44], [70.79, 71.8], [72.15, 74.76], [75.11, 76.13], [76.73, 80.12], [80.72, 81.8], [82.15, 83.78], [84.13, 85.62], [85.97, 89.38], [89.98, 91.58], [92.18, 93.28], [93.63, 97.05], [97.4, 98.22], [98.57, 99.56]], "R": [["The person you're talking to gives short answers and looks for someone else.", "Brian", "Well, good to meet you, Sergio. Enjoy the evening.", "You too, Brian. Good luck with the tower."], ["A friend asks why someone was cold to you.", "Miguel", "Did he do something wrong?", "No, I think he's just busy tonight. It's not personal. I'll say hi again another time."]]}, {"num": 64, "title": "Lauren, Months Later", "lines": [["P", "Camila? Oh my gosh. Camila from Recife?", "Lauren"], ["S", "Lauren! Hi. Wow, hello.", "Camila"], ["P", "Okay, I owe you a huge apology. You sent me those lovely messages last summer, and I never answered. I'm so embarrassed.", "Lauren"], ["S", "Oh, it's okay, really.", "Camila"], ["P", "No, it's not. Can I explain? Two weeks after our coffee, my company had layoffs. I lost my job. And honestly, I couldn't look at my inbox for about three months.", "Lauren"], ["S", "Oh, Lauren. I'm so sorry. I had no idea.", "Camila"], ["P", "How would you know? I didn't tell anyone. I was too proud. So your messages just sat there, and every time I saw them I felt worse.", "Lauren"], ["S", "That sounds really hard. Are you okay now?", "Camila"], ["P", "I'm good now. I started at Tidewater Brands in January. Head of customer marketing.", "Lauren"], ["S", "Congratulations! That's wonderful.", "Camila"], ["P", "Thanks. And actually, this is funny. We're redesigning our loyalty program, and the first person I thought of was you. Grace told me you're doing freelance work for her uncle's bakeries?", "Lauren"], ["S", "Yes! Six bakeries. We moved them to digital stamp cards, and repeat visits are up eighteen percent.", "Camila"], ["P", "See, I knew it. Are you free next week? For a real coffee this time. I promise I'll answer my phone.", "Lauren"], ["S", "Next week works. Tuesday?", "Camila"], ["P", "Tuesday at ten. I'll send you an invite right now, so I can't escape.", "Lauren"], ["S", "You know, my friend told me \"silence is the answer.\" I guess sometimes silence is just someone having a bad year.", "Camila"], ["P", "That's exactly what it was. Thank you for being kind about it.", "Lauren"]], "words": 249, "kind": "story", "scene": "April, a marketing conference at Canada Place.", "F": "This is the end of the story from scripts 21 and 29. Lauren's silence wasn't about Camila at all. She had lost her job. Sometimes silence means \"not interested,\" and sometimes it means \"life happened.\" Camila's kind response, and her number (\"up eighteen percent\"), turns an awkward moment into an opportunity.", "V": "", "t": [[2.0, 3.16], [3.51, 4.65], [5.0, 6.43], [7.03, 7.76], [8.11, 8.8], [9.15, 10.12], [10.72, 12.88], [13.23, 16.99], [17.34, 18.72], [19.32, 20.88], [21.48, 22.64], [22.99, 24.23], [24.58, 27.47], [27.82, 29.28], [29.63, 32.9], [33.5, 34.61], [34.96, 36.15], [36.5, 37.78], [38.38, 39.52], [39.87, 41.3], [41.65, 42.93], [43.28, 47.54], [48.14, 49.74], [50.09, 51.47], [52.07, 53.19], [53.54, 56.02], [56.37, 58.03], [58.63, 60.04], [60.39, 61.57], [62.17, 63.04], [63.39, 64.97], [65.32, 69.63], [69.98, 73.26], [73.86, 74.56], [74.91, 76.14], [76.49, 81.06], [81.66, 82.8], [83.15, 84.62], [84.97, 86.76], [87.11, 89.08], [89.68, 90.91], [91.26, 92.07], [92.67, 93.95], [94.3, 97.04], [97.64, 100.5], [100.85, 104.16], [104.76, 106.45], [106.8, 108.75]], "R": [["Someone apologizes for not answering your messages.", "Lauren", "I owe you a huge apology. I never answered your messages.", "Oh, please don't worry about it. I hope everything's okay with you."], ["Someone suggests meeting, and you want to fix a date.", "Lauren", "Are you free next week? For a real coffee this time.", "Yes, next week works. How about Tuesday morning?"]]}, {"num": 65, "title": "Reading Between the Lines", "lines": [["S", "Okay. Email number one. From Paul, the director at Cascadia. After my panel interview. \"Hi Bruno, thanks for your time today. We're meeting a few more candidates this week and will be in touch.\"", "Bruno"], ["P", "Hmm. Neutral. Very neutral. That's a standard email. They send it to everyone.", "Nathalia"], ["S", "I knew it. It's over.", "Bruno"], ["P", "It's not over. It's just neutral. What's email number two?", "Nathalia"], ["S", "Email number two arrived this morning. From Melissa in HR. \"Hi Bruno, could you please send us the names and contact details of two references? Ideally one from Canada and one from your previous role in Brazil.\"", "Bruno"], ["P", "Bruno!", "Nathalia"], ["S", "What?", "Bruno"], ["P", "That's very good news! Companies don't usually check references for people they're not considering. It's one of the last steps.", "Nathalia"], ["S", "Really? It doesn't say anything positive.", "Bruno"], ["P", "It doesn't have to. HR emails are never excited. You have to read between the lines. They asked for one from Canada and one from Brazil. That means they've thought about your background.", "Nathalia"], ["S", "So,
