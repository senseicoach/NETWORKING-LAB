one when you're a big-shot project director.", "Michael"], ["S", "Then I'll owe you. Thank you. So, can I ask my first question?", "Ana"], ["P", "Go ahead.", "Michael"], ["S", "In Brazil, the big public projects are mostly decided at the top. Here, it seems like there are many more steps. Consultations, approvals, community meetings. Is that right?", "Ana"], ["P", "That's very right. Here, a project can take two years before anyone touches a shovel. People find that frustrating, but it's also why projects don't get cancelled halfway through.", "Michael"], ["S", "In São Paulo, we had a project cancelled after the elections. Three years of work.", "Ana"], ["P", "Ouch. So you know why the steps exist.", "Michael"], ["S", "I do now. My second question: what do hiring managers here look for that's different from Brazil?", "Ana"], ["P", "Good question. Two things. They want to know you understand the local rules, safety, procurement, all that. And they want to know you can communicate with people who aren't engineers. Community groups, politicians, angry neighbours.", "Michael"], ["S", "Angry neighbours I have plenty of experience with.", "Ana"], ["P", "Then you'll be fine. What's your bad question? I'm waiting for it.", "Michael"], ["S", "Okay. Is it true that Canadians never say what they really think?", "Ana"], ["P", "Ha! That's not a bad question. That's the best question. The answer is, we do. Just very, very quietly.", "Michael"], ["S", "How quietly?", "Ana"], ["P", "Ask me again at our next coffee.", "Michael"]], "words": 242, "kind": "story", "scene": "Thursday, 8:05 a.m., a café in Yaletown.", "F": "Michael says \"Let me get these\" and \"I insist,\" so Ana accepts gracefully and offers to pay next time. Listen to Ana's structure: she says \"my first question,\" \"my second question,\" so Michael knows she's organized. \"Before anyone touches a shovel\" means before construction begins.", "V": "", "t": [[2.0, 3.18], [3.53, 4.51], [5.11, 6.22], [6.57, 7.36], [7.96, 8.82], [9.17, 10.17], [10.52, 11.7], [12.05, 13.19], [13.54, 17.39], [17.99, 19.02], [19.37, 20.05], [20.4, 22.36], [22.96, 23.77], [24.37, 28.37], [28.72, 31.02], [31.37, 34.17], [34.52, 35.39], [35.99, 37.11], [37.46, 41.55], [41.9, 47.76], [48.36, 52.06], [52.41, 53.57], [54.17, 54.82], [55.17, 57.09], [57.69, 58.44], [58.79, 63.66], [64.26, 65.27], [65.62, 66.47], [66.82, 71.88], [72.23, 76.51], [76.86, 79.76], [80.36, 83.12], [83.72, 84.94], [85.29, 86.65], [87.0, 88.15], [88.75, 89.35], [89.7, 92.77], [93.37, 93.91], [94.26, 95.82], [96.17, 97.52], [97.87, 99.29], [99.64, 101.41], [102.01, 102.91], [103.51, 105.38]], "R": [["The person you invited offers to pay.", "Michael", "Let me get these. No, I insist.", "That's very kind, thank you. Then the next one is on me."], ["The person asks you to ask your first question.", "Michael", "Go ahead. What's your first question?", "I'd love to know what hiring managers here look for that's different from Brazil."]]}, {"num": 19, "title": "It Feels Like an Interview", "lines": [["P", "Okay, I've got about half an hour. What would you like to know?", "Hannah"], ["S", "Thank you. I prepared some questions. First, what are the main responsibilities of your team?", "Bruno"], ["P", "We handle budgeting, forecasting, and reporting for the whole credit union. Five people.", "Hannah"], ["S", "Thank you. Second, what software do you use?", "Bruno"], ["P", "Mostly Excel, plus a planning tool that everyone hates.", "Hannah"], ["S", "Third, what is the biggest challenge for the department this year?", "Bruno"], ["P", "Bruno, can I stop you for a second?", "Hannah"], ["S", "Yes, of course.", "Bruno"], ["P", "This is starting to feel a bit like you're interviewing me. Which is fine, but you're allowed to just talk to me.", "Hannah"], ["S", "Oh. I'm sorry. In Brazil, I think I would be too informal if I didn't prepare.", "Bruno"], ["P", "No, preparing is great. But a coffee chat is more like a conversation. You can react to what I say. You can tell me what you think.", "Hannah"], ["S", "Okay. Then I'll react. The planning tool that everyone hates. Why do they hate it?", "Bruno"], ["P", "Ha! Now we're talking. It was set up by a consultant three years ago, and nobody understands the formulas.", "Hannah"], ["S", "That happened to us in Porto Alegre. A consultant built a beautiful model, and then he left, and it became a black box.", "Bruno"], ["P", "Exactly! A black box. What did you do?", "Hannah"], ["S", "I rebuilt it with my team. It took four months, but after that, everyone could use it.", "Bruno"], ["P", "Four months. Okay, Bruno, now I'm the one with questions.", "Hannah"]], "words": 237, "kind": "story", "scene": "April, a café near Cascadia Credit Union's head office.", "F": "Bruno asks a list of prepared questions, so it feels like an interview. Hannah stops him kindly: \"Can I stop you for a second?\" When he reacts to something she said (\"Why do they hate it?\"), the conversation comes alive. \"Now we're talking\" means \"this is much better.\" A \"black box\" is a system nobody understands.", "V": "", "t": [[2.0, 3.77], [4.12, 5.21], [5.81, 6.67], [7.02, 8.93], [9.28, 12.21], [12.81, 17.15], [17.5, 18.39], [18.99, 19.85], [20.2, 22.35], [22.95, 26.3], [26.9, 30.42], [31.02, 32.97], [33.57, 34.93], [35.53, 38.4], [38.75, 41.22], [41.82, 42.48], [42.83, 43.92], [44.27, 47.95], [48.55, 49.87], [50.22, 52.78], [53.13, 54.53], [54.88, 56.25], [56.85, 57.77], [58.12, 59.61], [59.96, 62.37], [62.72, 64.1], [64.7, 65.16], [65.51, 66.48], [66.83, 71.91], [72.51, 74.98], [75.33, 80.15], [80.75, 81.52], [81.87, 82.78], [83.13, 83.97], [84.57, 86.51], [86.86, 90.19], [90.79, 91.58], [91.93, 94.34]], "R": [["The person tells you the conversation feels too formal.", "Hannah", "This is starting to feel like you're interviewing me.", "Sorry about that! I prepared a lot of questions. Can I go back to what you said about the planning tool?"], ["Someone mentions a problem their team has.", "Hannah", "Nobody understands the formulas in our planning tool.", "That happened to us too. A consultant built a model, then left, and nobody could use it. What are you planning to do?"]]}, {"num": 20, "title": "You're on Mute", "lines": [["S", "Hi, Priscilla? Can you hear me? Hello? Priscilla? I think you're on mute.", "Thiago"], ["P", "Sorry! Sorry. Classic. Can you hear me now?", "Priscilla"], ["S", "Yes, perfectly. Thank you for making time for this.", "Thiago"], ["P", "Of course. Owen said you were worth talking to, and Owen never says that about anyone. So, you're in Vancouver?", "Priscilla"], ["S", "Yes. Near Commercial Drive.", "Thiago"], ["P", "Nice. I lived on The Drive for two years before... sorry, you froze. Thiago? Are you there?", "Priscilla"], ["S", "Sorry, my internet... can you hear me? I'm going to turn off my camera. Maybe that helps.", "Thiago"], ["P", "Okay, good, you're back. Better. So, Owen mentioned you're interested in ferry software. That's what my team does, but we're in Toronto. Would you work remotely?", "Priscilla"], ["S", "Yes. I worked remotely for three years in Florianópolis, with clients in the United States.", "Thiago"], ["P", "Three years remote is good. What's the biggest thing you learned?", "Priscilla"], ["S", "Write everything down. When people are in different time zones, nobody remembers what was decided in a meeting.", "Thiago"], ["P", "Okay, I love that answer. We have that problem every week.", "Priscilla"], ["S", "Sorry, I lost you again. You said you have that problem every week?", "Thiago"], ["P", "Every week! Listen, my internet isn't great either. Can I send you a few questions by email, and you can send me something you've built?", "Priscilla"], ["S", "Of course. I'll send you my GitHub link today.", "Thiago"], ["P", "Perfect. And Thiago? Fix your internet before the real interview.", "Priscilla"]], "words": 226, "kind": "story", "scene": "May, a video call. Thiago is in his apartment; Priscilla is in Toronto.", "F": "Video calls create special listening problems: mute, freezing, delays. Useful phrases: \"I think you're on mute,\" \"You froze,\" \"I lost you again,\" \"You're back.\" Thiago repeats what he thinks he heard to check it: \"You said you have that problem every week?\" Priscilla's last line hints that a real interview might come.", "V": "", "t": [[2.0, 2.89], [3.24, 4.06], [4.41, 4.99], [5.34, 6.01], [6.36, 7.39], [7.99, 8.86], [9.21, 10.16], [10.51, 11.49], [11.84, 13.17], [13.77, 14.77], [15.12, 16.74], [17.34, 18.4], [18.75, 23.08], [23.43, 25.19], [25.79, 26.32], [26.67, 27.9], [28.5, 29.45], [29.8, 32.23], [32.58, 34.06], [34.41, 35.27], [35.62, 36.67], [37.27, 38.42], [38.77, 39.59], [39.94, 41.39], [41.74, 42.63], [43.23, 45.02], [45.37, 46.24], [46.59, 49.86], [50.21, 52.89], [53.24, 54.91], [55.51, 56.04], [56.39, 61.38], [61.98, 63.88], [64.23, 66.0], [66.6, 67.72], [68.07, 72.88], [73.48, 75.43], [75.78, 77.98], [78.58, 79.75], [80.1, 82.05], [82.65, 83.76], [84.11, 86.53], [86.88, 91.33], [91.93, 92.64], [92.99, 94.67], [95.27, 96.34], [96.69, 97.94], [98.29, 100.81]], "R": [["Your video freezes during a call.", "Priscilla", "Thiago? You froze. Are you there?", "Sorry, my internet isn't great today. I'm going to turn off my camera. Can you hear me now?"], ["The connection drops and you miss something.", "Priscilla", "...we have that problem every week.", "Sorry, I lost you for a second. Did you say you have that problem every week?"]]}, {"num": 21, "title": "Not Really Listening", "lines": [["P", "Sorry, sorry, I'm here. The bridge was a nightmare. Hi, you must be Camila.", "Lauren"], ["S", "Yes, hi! Thank you so much for meeting me. Grace said wonderful things about you.", "Camila"], ["P", "Oh, Grace is great. Sorry, give me one second. I just need to answer this.", "Lauren"], ["S", "Of course.", "Camila"], ["P", "Okay. Sorry. So, Grace said you're in marketing?", "Lauren"], ["S", "Yes. Brand and loyalty marketing. I was at a big pharmacy chain in Brazil, and now I'm doing some freelance work while I look for a full-time role.", "Camila"], ["P", "Cool. Cool. And what kind of companies are you looking at?", "Lauren"], ["S", "Retail, mostly. Maybe consumer goods. Your company works with a lot of retail brands, right?", "Camila"], ["P", "Mm-hmm. We do. Sorry, it's been a crazy week. We're launching something on Friday, and nothing is ready.", "Lauren"], ["S", "That sounds stressful. I remember those weeks.", "Camila"], ["P", "Yeah. Sorry, what were you saying?", "Lauren"], ["S", "No problem. Can I ask what your team is focused on right now?", "Camila"], ["P", "Oh, you know. A bit of everything. It's hard to explain. It changes every week.", "Lauren"], ["S", "That sounds busy.", "Camila"], ["P", "Super busy. Sorry. I'm terrible today.", "Lauren"], ["S", "Lauren, it sounds like this is a really hard week for you. Should we try another time? I don't want to take up your morning.", "Camila"], ["P", "Oh, would you mind? That would actually be amazing. I'm so sorry.", "Lauren"], ["S", "Not at all. Maybe in a few weeks?", "Camila"], ["P", "Definitely. Let's definitely do that. Send me a note.", "Lauren"], ["S", "I will. Good luck with your week.", "Camila"], ["P", "Thanks, Camila. You're a star.", "Lauren"]], "words": 242, "kind": "story", "scene": "May, a café on Granville Street.", "F": "Lauren gives many signals that she isn't really available: she arrives late, checks her phone, apologizes again and again, and gives vague answers (\"a bit of everything,\" \"it's hard to explain\"). Camila reads the signals and offers an exit. That leaves a good impression. \"Let's definitely do that\" may or may not happen. Script 64 shows what happens next.", "V": "", "t": [[2.0, 3.5], [3.85, 5.4], [5.75, 7.41], [8.01, 8.98], [9.33, 11.19], [11.54, 13.76], [14.36, 15.89], [16.24, 17.96], [18.31, 19.93], [20.53, 21.4], [22.0, 22.79], [23.14, 24.08], [24.43, 26.3], [26.9, 27.6], [27.95, 29.89], [30.24, 36.65], [37.25, 38.13], [38.48, 39.36], [39.71, 41.89], [42.49, 43.93], [44.28, 45.88], [46.23, 49.24], [49.84, 51.18], [51.53, 52.55], [52.9, 54.72], [55.07, 58.09], [58.69, 60.14], [60.49, 62.09], [62.69, 63.33], [63.68, 65.12], [65.72, 66.75], [67.1, 69.93], [70.53, 71.54], [71.89, 73.2], [73.55, 75.08], [75.43, 77.04], [77.64, 78.92], [79.52, 80.57], [80.92, 81.86], [82.21, 83.59], [84.19, 87.53], [87.88, 89.51], [89.86, 91.6], [92.2, 93.49], [93.84, 95.57], [95.92, 97.13], [97.73, 98.75], [99.1, 100.46], [101.06, 102.0], [102.35, 103.98], [104.33, 105.45], [106.05, 106.88], [107.23, 108.72], [109.32, 110.5], [110.85, 111.82]], "R": [["The person you're meeting seems distracted and busy.", "Lauren", "Sorry, it's been a crazy week.", "No problem at all. Should we try another time? I don't want to take up your morning."], ["The person gives you a vague answer.", "Lauren", "Oh, you know. A bit of everything.", "That sounds busy. Is there one project that's taking most of your time right now?"]]}, {"num": 22, "title": "Coffee With Someone Like You", "lines": [["P", "Thank you for meeting me, Ana. Dev said you were the person to talk to.", "Fausto"], ["S", "Dev says that about everyone. But I'm happy to help. Dev said you're an engineer?", "Ana"], ["P", "Civil engineer. Twenty-six years. Bridges, mostly. In Manaus, I worked on the bridge over the Rio Negro.", "Fausto"], ["S", "The big one? That's a famous bridge.", "Ana"], ["P", "It is. And here, I can't get an interview for a junior position.", "Fausto"], ["S", "How long have you been here?", "Ana"], ["P", "Seven months. My daughter lives in Burnaby, so my wife and I decided to come. But honestly, Ana, I'm fifty-four. Maybe it's too late for me.", "Fausto"], ["S", "Can I be honest with you?", "Ana"], ["P", "Please.", "Fausto"], ["S", "I don't think the problem is your age. I think the problem is the licence. Did you start the process with Engineers and Geoscientists BC?", "Ana"], ["P", "Not yet. It looks very complicated.", "Fausto"], ["S", "It is complicated. But without it, companies can't put you on a bridge project. With it, twenty-six years of bridges is incredible.", "Ana"], ["P", "So I'm applying for the wrong jobs before the licence.", "Fausto"], ["S", "Maybe. In the meantime, you could look at roles that don't need the licence. Inspection, project controls, things like that. That's how my friend from Curitiba started.", "Ana"], ["P", "You know, my daughter told me the same thing. I didn't listen to her.", "Fausto"], ["S", "Children are always right. It's very annoying.", "Ana"], ["P", "Very annoying. Okay. I'll start the application this week.", "Fausto"], ["S", "And Fausto, come to Dev's next meetup. There's an engineer there you should meet. I'll introduce you.", "Ana"]], "words": 243, "kind": "story", "scene": "May, a Tim Hortons near Joyce-Collingwood Station.", "F": "Coffee chats aren't only with senior people. Talking to someone who arrived a little before you is very useful. Ana says \"Can I be honest with you?\" before saying something difficult, which is polite and common. Engineers and Geoscientists BC is the body that licenses engineers in British Columbia. Fausto is from Manaus, in the Amazon.", "V": "", "t": [[2.0, 3.66], [4.01, 6.2], [6.8, 8.31], [8.66, 9.86], [10.21, 11.59], [12.19, 13.25], [13.6, 14.77], [15.12, 16.46], [16.81, 19.59], [20.19, 20.98], [21.33, 22.61], [23.21, 23.94], [24.29, 27.09], [27.69, 29.01], [29.61, 30.56], [30.91, 34.31], [34.66, 36.75], [37.1, 38.66], [39.26, 40.47], [41.07, 41.77], [42.37, 44.21], [44.56, 46.42], [46.77, 50.74], [51.34, 52.08], [52.43, 54.11], [54.71, 55.93], [56.28, 59.42], [59.77, 62.75], [63.35, 66.2], [66.8, 67.42], [67.77, 71.25], [71.6, 74.39], [74.74, 77.01], [77.61, 79.72], [80.07, 81.39], [81.99, 83.52], [83.87, 84.94], [85.54, 86.5], [86.85, 87.54], [87.89, 89.89], [90.49, 92.72], [93.07, 94.93], [95.28, 96.39]], "R": [["A fellow newcomer tells you they feel it's too late for them.", "Fausto", "I'm fifty-four. Maybe it's too late for me.", "I don't think it's your age. Can I share something that helped me?"], ["Someone offers to introduce you to a contact.", "Ana", "Come to Dev's next meetup. There's an engineer you should meet.", "Thank you, Ana. I'd really appreciate that. I'll be there."]]}, {"num": 23, "title": "\"Who Else Should I Talk To?\"", "lines": [["P", "So. You asked me last time if Canadians ever say what they really think.", "Michael"], ["S", "You promised you'd answer.", "Ana"], ["P", "I'm about to. If a Canadian says, \"That's an interesting idea,\" what do you think it means?", "Michael"], ["S", "That they think the idea is interesting?", "Ana"], ["P", "Sometimes. Often it means, \"I think that idea is terrible, but I'm too polite to say so.\"", "Michael"], ["S", "Ha! In Brazil, we'd just say it's terrible. And then we'd have lunch together.", "Ana"], ["P", "Here, we skip the terrible and go straight to lunch. Okay, what else is on your list?", "Michael"], ["S", "One more thing, and then I'll let you go. You've been very generous with your time. Is there anyone else you think I should talk to?", "Ana"], ["P", "Good. That's the right question. Two people. First, Erin MacLeod. She runs volunteers for the BC Project Leaders Network. If you volunteer there, you'll meet half the project managers in the city.", "Michael"], ["S", "That sounds perfect.", "Ana"], ["P", "Second, I have a former colleague at a firm that does transit work. I'm not going to promise anything. But I can introduce you.", "Michael"], ["S", "Thank you, Michael. That means a lot.", "Ana"], ["P", "Here's what would help me. Send me a short email I can forward. Three or four sentences about who you are and what you're looking for. That way I don't have to write it myself.", "Michael"], ["S", "I'll send it tonight.", "Ana"], ["P", "Tomorrow's fine. I can't forward anything tonight. I have a hockey game.", "Michael"], ["S", "I thought you didn't like hockey.", "Ana"], ["P", "I don't. My son does.", "Michael"]], "words": 244, "kind": "story", "scene": "June, the same café in Yaletown. Ana and Michael's second coffee.", "F": "Asking \"Is there anyone else you think I should talk to?\" at the end of a coffee chat is one of the most powerful networking questions. Michael asks for a short email he can forward, called a \"blurb.\" That makes his introduction easy. \"That's an interesting idea\" can be a polite way of disagreeing.", "V": "", "t": [[2.0, 2.61], [2.96, 6.97], [7.57, 8.81], [9.41, 10.37], [10.72, 15.8], [16.4, 18.33], [18.93, 19.84], [20.19, 25.34], [25.94, 26.43], [26.78, 28.83], [29.18, 30.72], [31.32, 34.2], [34.55, 36.53], [37.13, 39.26], [39.61, 41.53], [41.88, 44.18], [44.78, 45.37], [45.72, 47.06], [47.41, 48.28], [48.63, 50.12], [50.47, 54.37], [54.72, 59.09], [59.69, 60.88], [61.48, 65.47], [65.82, 67.83], [68.18, 69.81], [70.41, 71.4], [71.75, 72.72], [73.32, 74.71], [75.06, 77.36], [77.71, 81.66], [82.01, 84.41], [85.01, 86.16], [86.76, 87.83], [88.18, 90.09], [90.44, 91.74], [92.34, 93.88], [94.48, 95.18], [95.53, 96.49]], "R": [["You want to finish a coffee chat by asking for introductions.", "Michael", "Okay, what else is on your list?", "One last question, and then I'll let you go. Is there anyone else you think I should talk to?"], ["Someone offers to introduce you and asks for a short email.", "Michael", "Send me a short email I can forward.", "Of course. I'll send you three or four sentences about who I am and what I'm looking for, so it's easy to share."]]}, {"num": 24, "title": "Who Pays?", "lines": [["P", "You survived your first month! How's volunteering?", "Karen"], ["S", "I love it. I fold blankets and bring people water, but I watch everything.", "Juliana"], ["P", "That's exactly what you should do. Let's grab a coffee. I've got fifteen minutes.", "Karen"], ["S", "Let me get it. You're giving me your time.", "Juliana"], ["P", "Don't be silly, I'll get it.", "Karen"], ["S", "No, really, please. I asked you so many questions this month. It's the least I can do.", "Juliana"], ["P", "Okay, okay. Thank you. Medium coffee, two milks. Not fancy. I've been awake since four.", "Karen"], ["S", "Medium coffee, two milks. And a tea for me. I can't drink coffee after noon, or I'll be awake until four.", "Juliana"], ["P", "So, any news on the exam?", "Karen"], ["S", "I wrote it last week. I get the results in about a month.", "Juliana"], ["P", "How do you feel?", "Karen"], ["S", "Honestly? I don't know. Some questions were easy. Some were about medications we don't use in Brazil.", "Juliana"], ["P", "Everyone says that. I bet you did better than you think. While you wait, have you looked at the transition programs?", "Karen"], ["S", "I read about one at a college in Burnaby. It's about the Canadian health system, documentation, that kind of thing.", "Juliana"], ["P", "That's a good one. A few of my nurses did it. Put my name down as a reference if you apply.", "Karen"], ["S", "Really? You'd do that?", "Juliana"], ["P", "I've watched you fold blankets for a month. You're the most organized blanket folder I've ever seen.", "Karen"], ["S", "Is that a compliment?", "Juliana"], ["P", "In an emergency department, that's the highest compliment there is.", "Karen"]], "words": 240, "kind": "story", "scene": "June, the hospital cafeteria after Juliana's volunteer shift.", "F": "Who pays for coffee? Usually, the person who asked for help offers to pay. Here, the other person says \"Don't be silly,\" and Juliana insists politely once more: \"It's the least I can do.\" \"Put my name down as a reference\" means she can give Karen's name to the program. Notice Karen's joke about blankets is really praise.", "V": "", "t": [[2.0, 3.72], [4.07, 5.44], [6.04, 6.76], [7.11, 10.72], [11.32, 13.14], [13.49, 14.9], [15.25, 16.8], [17.4, 18.28], [18.63, 19.89], [20.49, 22.15], [22.75, 23.93], [24.28, 26.44], [26.79, 28.13], [28.73, 30.01], [30.36, 31.46], [31.81, 33.53], [33.88, 34.96], [35.31, 36.87], [37.47, 38.93], [39.28, 40.25], [40.6, 44.18], [44.78, 46.57], [47.17, 48.37], [48.72, 50.46], [51.06, 52.11], [52.71, 53.41], [53.76, 54.52], [54.87, 56.35], [56.7, 59.56], [60.16, 61.52], [61.87, 63.75], [64.1, 66.87], [67.47, 69.71], [70.06, 74.13], [74.73, 75.83], [76.18, 77.98], [78.33, 80.76], [81.36, 81.95], [82.3, 83.1], [83.7, 85.9], [86.25, 89.2], [89.8, 90.95], [91.55, 95.18]], "R": [["You want to pay for the coffee of the person who's helping you.", "Karen", "Don't be silly, I'll get it.", "No, really, please. You've helped me so much. It's the least I can do."], ["Someone offers to be your reference.", "Karen", "Put my name down as a reference if you apply.", "Really? Thank you so much. I'll let you know as soon as I apply."]]}, {"num": 25, "title": "The Thank-You Note", "lines": [["P", "Okay, Bruno. Read it to me.", "Nathalia"], ["S", "\"Dear Ms. Okafor. I would like to express my sincere gratitude for the opportunity to meet with you on Tuesday, the fourth of June. Our conversation was extremely valuable for my professional development. I remain at your entire disposal.\"", "Bruno"], ["P", "Bruno. Who are you? A lawyer from eighteen ninety?", "Nathalia"], ["S", "That's how we write in Brazil!", "Bruno"], ["P", "I know. I worked in HR in Santos for ten years. I've seen a thousand emails like that. But here, it sounds very stiff. First, she told you to call her Hannah, right?", "Nathalia"], ["S", "Yes.", "Bruno"], ["P", "So, \"Hi Hannah.\" Not \"Dear Ms. Okafor.\"", "Nathalia"], ["S", "Okay. \"Hi Hannah.\"", "Bruno"], ["P", "And \"I remain at your entire disposal\" sounds a bit strange in English. Say something specific. What did you really learn?", "Nathalia"], ["S", "That their planning tool is a black box, and that their team wants someone who can explain numbers to people who aren't in finance.", "Bruno"], ["P", "Perfect. Put that in. Short and specific.", "Nathalia"], ["S", "Okay. \"Hi Hannah, thanks again for the coffee on Tuesday. I really enjoyed hearing about the planning tool, and it made me think about how we rebuilt ours in Porto Alegre. If it's ever useful, I'd be happy to share how we did it. Thanks again, Bruno.\"", "Bruno"], ["P", "Much better. Four sentences, one offer, no lawyers.", "Nathalia"], ["S", "Should I send it now? It's ten p.m.", "Bruno"], ["P", "Schedule it for tomorrow morning. Nobody wants a thank-you at ten p.m.", "Nathalia"]], "words": 231, "kind": "story", "scene": "June, Bruno's kitchen. Nathalia is reviewing his message.", "F": "A Canadian thank-you note is short, warm and specific: thank them, mention one thing from the conversation, offer something small, and stop. Brazilian formal phrases like \"I remain at your entire disposal\" sound stiff in English. Nathalia is from Santos, a port city on the coast near São Paulo.", "V": "", "t": [[2.0, 3.45], [3.8, 5.0], [5.6, 7.46], [7.81, 14.13], [14.48, 18.82], [19.17, 21.68], [22.28, 23.37], [23.72, 24.78], [25.13, 27.02], [27.62, 29.61], [30.21, 31.12], [31.47, 34.49], [34.84, 37.32], [37.67, 39.71], [40.06, 42.62], [43.22, 43.97], [44.57, 45.98], [46.33, 48.46], [49.06, 49.98], [50.33, 51.39], [51.99, 56.32], [56.67, 58.41], [58.76, 60.26], [60.86, 67.84], [68.44, 69.51], [69.86, 70.97], [71.32, 72.85], [73.45, 74.37], [74.72, 77.85], [78.2, 84.29], [84.64, 87.83], [88.18, 89.86], [90.46, 91.54], [91.89, 94.55], [95.15, 96.69], [97.04, 97.72], [98.32, 100.32], [100.67, 101.39]], "R": [["A friend asks you to read your thank-you message aloud.", "Nathalia", "Okay, read it to me.", "Hi Hannah, thanks again for the coffee on Tuesday. I really enjoyed hearing about your team's planning tool."], ["A friend says your message is too formal.", "Nathalia", "It sounds very stiff. Say something specific.", "You're right. I'll mention the planning tool, and offer to share how we rebuilt ours."]]}, {"num": 26, "title": "What Hannah Said", "lines": [["S", "Who was the guy you had coffee with last week? The Brazilian.", "Raj"], ["P", "Bruno. He sent me a really nice thank-you note this morning, actually.", "Hannah"], ["S", "Was he good?", "Raj"], ["P", "Honestly? The first time I met him, he talked for five minutes about his entire career and I escaped to find my colleague.", "Hannah"], ["S", "Ha! Classic.", "Raj"], ["P", "But the second time, completely different. Thirty seconds, one number, done. And at coffee, he started out a bit like a robot, asking me questions from a list.", "Hannah"], ["S", "Oh no.", "Raj"], ["P", "But then I told him to relax, and he did. And guess what he did in Brazil?", "Hannah"], ["S", "What?", "Raj"], ["P", "He rebuilt a planning model after a consultant left. Four months. Exactly our problem with the planning tool.", "Hannah"], ["S", "Wait, really? Did you tell him about the contract role?", "Raj"], ["P", "Not yet. It's not posted yet. And I don't want to promise him something we haven't approved.", "Hannah"], ["S", "When does it get approved?", "Raj"], ["P", "Maybe September. If the budget goes through.", "Hannah"], ["S", "You should tell him to watch for it.", "Raj"], ["P", "I'll tell him when it's real. If I tell him now and it gets cancelled, I'll feel terrible.", "Hannah"], ["S", "Fair. Remember the last time? We told that analyst about a role, and then the hiring freeze happened.", "Raj"], ["P", "Don't remind me. She still sends me sad emails.", "Hannah"], ["S", "So keep in touch with Bruno, at least.", "Raj"], ["P", "That's the plan. He offered to show me how he rebuilt his model. I think I'll take him up on that.", "Hannah"], ["S", "Smart. Free consulting.", "Raj"], ["P", "It's not free. I'm buying the coffee next time.", "Hannah"]], "words": 251, "kind": "story", "scene": "June, Cascadia Credit Union, the finance team's kitchen.", "F": "Another conversation the newcomer never hears. Hannah has a possible job, but she won't mention it until it's approved, because Canadians often avoid promising things that might not happen. This is why staying in touch matters. \"Take him up on that\" means accept his offer. Bruno's small offer in his thank-you note is already working.", "V": "", "t": [[2.0, 4.32], [4.67, 5.89], [6.49, 7.13], [7.48, 10.81], [11.41, 12.43], [13.03, 13.73], [14.08, 20.63], [21.23, 21.82], [22.17, 22.95], [23.55, 25.79], [26.14, 27.77], [28.12, 32.97], [33.57, 34.44], [35.04, 37.33], [37.68, 39.23], [39.83, 40.42], [41.02, 43.99], [44.34, 45.13], [45.48, 47.68], [48.28, 49.36], [49.71, 51.71], [52.31, 53.02], [53.37, 54.63], [54.98, 58.14], [58.74, 60.3], [60.9, 61.97], [62.32, 63.67], [64.27, 66.02], [66.62, 67.9], [68.25, 71.5], [72.1, 72.75], [73.1, 74.67], [75.02, 78.93], [79.53, 80.51], [80.86, 82.64], [83.24, 85.39], [85.99, 86.89], [87.24, 89.83], [90.18, 91.83], [92.43, 93.09], [93.44, 94.74], [95.34, 96.32], [96.67, 98.34]], "R": [["A colleague asks about someone you met.", "Raj", "Was he good?", "Yes, he was. He started a bit formal, but he had really relevant experience with our exact problem."], ["A colleague suggests you keep in touch with someone.", "Raj", "Keep in touch with him, at least.", "That's the plan. He offered to show me how he rebuilt his model, so I'll follow up on that."]]}]}, {"part": 4, "title": "Following Up", "desc": "LinkedIn notes, follow-up calls, silence, and reconnecting after months.", "scripts": [{"num": 27, "title": "Requests in the Inbox", "lines": [["S", "Okay, LinkedIn game. I read a request, you say accept or ignore.", "Josh"], ["P", "Fine. Go.", "Grace"], ["S", "Number one. No message. Just a name. \"Brandon, Sales Professional.\"", "Josh"], ["P", "Do I know Brandon?", "Grace"], ["S", "You've never met Brandon.", "Josh"], ["P", "Ignore. Next.", "Grace"], ["S", "Number two. \"Dear Sir or Madam, I would like to add you to my professional network.\"", "Josh"], ["P", "Sir or madam. So they don't even know if I'm a man or a woman. Ignore.", "Grace"], ["S", "Harsh, but fair. Number three. \"Hi Grace, we met at Dev's meetup in October. You told me about the ferry campaign, and I've been thinking about it ever since. I'd love to stay in touch. Camila.\"", "Josh"], ["P", "Accept! That's Camila. She's great.", "Grace"], ["S", "Okay, see, that one's good because she said where you met and one specific thing.", "Josh"], ["P", "Exactly. I meet forty people a month. Give me a clue.", "Grace"], ["S", "Number four. \"Hi Grace, I'm a recent graduate looking for marketing opportunities. Can you refer me to your HR department? Please find my resume attached.\"", "Josh"], ["P", "Who's that from?", "Grace"], ["S", "Tyler Brooks.", "Josh"], ["P", "Tyler! Oh, Tyler. He sent me the same thing in March.", "Grace"], ["S", "Accept or ignore?", "Josh"], ["P", "I'll accept, but I'm not referring him. I'll send him a short message. Something kind. Like, \"Happy to connect. Let's chat at the next meetup.\"", "Grace"], ["S", "You're too nice.", "Josh"], ["P", "He's twenty-two. Somebody was nice to me at twenty-two.", "Grace"], ["S", "Number five is a man selling solar panels.", "Josh"], ["P", "Ignore. Definitely ignore.", "Grace"], ["S", "Okay, last one. It's from your mother.", "Josh"], ["P", "Accept. Obviously. And then ask her to stop sharing my posts with her book club.", "Grace"]], "words": 247, "kind": "story", "scene": "June, Saltwater Creative. Grace and Josh are looking at their LinkedIn requests over lunch.", "F": "A LinkedIn connection request works best with a short note: where you met, one specific thing you talked about, and a friendly line. Camila's note works. \"Dear Sir or Madam\" and \"Please find my resume attached\" don't. \"Harsh, but fair\" means \"that's tough, but reasonable.\" \"Give me a clue\" means \"help me remember who you are.\"", "V": "", "t": [[2.0, 3.53], [3.88, 6.38], [6.98, 7.68], [8.03, 8.66], [9.26, 10.06], [10.41, 11.31], [11.66, 12.64], [12.99, 14.77], [15.37, 16.81], [17.41, 18.87], [19.47, 20.31], [20.66, 21.48], [22.08, 22.89], [23.24, 26.94], [27.54, 28.95], [29.3, 31.85], [32.2, 33.04], [33.64, 34.78], [35.13, 35.96], [36.31, 38.96], [39.31, 42.97], [43.32, 44.99], [45.34, 46.05], [46.65, 47.46], [47.81, 49.07], [49.42, 50.45], [51.05, 54.9], [55.5, 56.43], [56.78, 58.63], [58.98, 60.14], [60.74, 61.56], [61.91, 65.75], [66.1, 68.3], [68.65, 70.73], [71.33, 72.6], [73.2, 74.19], [74.79, 75.52], [75.87, 77.02], [77.37, 79.47], [80.07, 81.38], [81.98, 84.17], [84.52, 86.34], [86.69, 88.04], [88.39, 90.03], [90.38, 92.11], [92.71, 93.7], [94.3, 95.73], [96.08, 98.56], [99.16, 101.7], [102.3, 103.14], [103.49, 104.91], [105.51, 106.8], [107.15, 108.21], [108.81, 109.62], [109.97, 110.94], [111.29, 114.4]], "R": [["You're writing a LinkedIn note to someone you met at an event.", "Josh", "So what should a good note say? Give me an example.", "Hi Grace, we met at Dev's meetup in October and talked about your ferry campaign. I'd love to stay in touch."], ["A colleague says you're too nice to someone.", "Josh", "You're too nice.", "Maybe. But somebody was nice to me when I was starting out."]]}, {"num": 28, "title": "The Follow-Up Call", "lines": [["P", "Hannah Okafor.", "Hannah"], ["S", "Hi Hannah, it's Bruno Carvalho. Is now a good time?", "Bruno"], ["P", "Bruno! Yes, I've got a few minutes. How are you?", "Hannah"], ["S", "Good, thank you. I said in my note that I could show you how we rebuilt our planning model in Porto Alegre. I made a simple version with fake numbers, so there's nothing confidential.", "Bruno"], ["P", "You made a version? With fake numbers? That's very thorough.", "Hannah"], ["S", "I had some free time. Maybe too much free time.", "Bruno"], ["P", "Ha! Okay, honestly, I'd love to see it. Our team is still fighting with that tool every month.", "Hannah"], ["S", "Would a thirty-minute video call work? I can share my screen.", "Bruno"], ["P", "That works. Can I bring Raj? He's the one who suffers the most with the tool.", "Hannah"], ["S", "Of course. The more people suffering, the better.", "Bruno"], ["P", "Ha! Okay. How's next Wednesday at two?", "Hannah"], ["S", "Wednesday at two is perfect.", "Bruno"], ["P", "Great. Oh, and send me the file the day before, so I can look at it first.", "Hannah"], ["S", "Of course. I'll send it Tuesday morning.", "Bruno"], ["P", "I'll send an invite. And Bruno, can I ask, how's the search going?", "Hannah"], ["S", "Slowly. I've had two interviews, but nothing yet.", "Bruno"], ["P", "That's normal. It usually takes longer than people expect. Listen, I can't say much, but you might want to keep an eye on our careers page in the fall.", "Hannah"], ["S", "Oh. Okay. I will.", "Bruno"], ["P", "I'm not promising anything. Budgets are budgets.", "Hannah"], ["S", "I understand. Thank you for telling me.", "Bruno"], ["P", "See you Wednesday. Bring your fake numbers.", "Hannah"], ["S", "They're very beautiful fake numbers.", "Bruno"]], "words": 245, "kind": "story", "scene": "July, a phone call. Bruno calls Hannah.", "F": "Bruno follows up by doing exactly what he offered in his thank-you note, and he makes it easy: \"nothing confidential,\" \"a thirty-minute video call,\" \"I can share my screen.\" Hannah's hint, \"keep an eye on our careers page in the fall,\" is important but careful. \"I'm not promising anything\" and \"budgets are budgets\" protect her if the job doesn't happen.", "V": "", "t": [[2.0, 2.97], [3.57, 5.87], [6.22, 8.03], [8.63, 9.26], [9.61, 11.01], [11.36, 12.14], [12.74, 14.01], [14.36, 19.48], [19.83, 23.99], [24.59, 25.53], [25.88, 26.96], [27.31, 28.35], [28.95, 30.67], [31.02, 32.89], [33.49, 33.95], [34.3, 36.25], [36.6, 39.26], [39.86, 42.18], [42.53, 44.21], [44.81, 45.57], [45.92, 46.97], [47.32, 49.71], [50.31, 51.34], [51.69, 53.77], [54.37, 54.83], [55.18, 55.82], [56.17, 57.67], [58.27, 60.34], [60.94, 61.53], [61.88, 65.72], [66.32, 67.35], [67.7, 69.56], [70.16, 71.3], [71.65, 74.09], [74.69, 75.54], [75.89, 78.33], [78.93, 79.72], [80.07, 82.47], [82.82, 88.02], [88.62, 89.28], [89.63, 90.55], [90.9, 91.78], [92.38, 93.79], [94.14, 95.28], [95.88, 97.18], [97.53, 99.13], [99.73, 100.69], [101.04, 102.27], [102.87, 105.16]], "R": [["You call someone to follow up on an offer you made.", "Hannah", "Bruno! How are you?", "Good, thanks! I said I could show you how we rebuilt our planning model. Would a thirty-minute video call work?"], ["Someone gives you a careful hint about a future job.", "Hannah", "You might want to keep an eye on our careers page in the fall.", "Thank you, I will. I really appreciate you telling me."]]}, {"num": 29, "title": "Gone Quiet", "lines": [["S", "Can I ask you something? You worked in HR. How long do you wait before you give up on someone?", "Camila"], ["P", "Give up how? Who is it?", "Nathalia"], ["S", "Lauren. Grace's friend. The coffee chat that didn't happen in May. She said, \"Let's definitely do that, send me a note.\" So I sent a note in June. Nothing. I sent another one two weeks ago. Nothing.", "Camila"], ["P", "What did your notes say?", "Nathalia"], ["S", "The first one was, \"Hi Lauren, I hope the launch went well! Would you have time for a coffee in the next few weeks?\" The second one was shorter. \"Just following up on my last message.\"", "Camila"], ["P", "Okay. Both are fine. Very polite. But here's the thing. \"Just following up\" sounds like you're waiting for an answer, so she feels guilty.", "Nathalia"], ["S", "I don't want her to feel guilty!", "Camila"], ["P", "I know. So if you write a third one, make it easy to ignore. Something like, \"No pressure at all, I know summer is busy. If you're ever free in the fall, I'd still love to chat.\"", "Nathalia"], ["S", "And if she doesn't answer that?", "Camila"], ["P", "Then you stop. And you don't take it personally. Maybe she's overwhelmed. Maybe she changed jobs. Maybe she just isn't interested. You'll never know.", "Nathalia"], ["S", "In Recife, if someone didn't answer three messages, I'd call their mother.", "Camila"], ["P", "In Santos too. But here, silence is the answer.", "Nathalia"], ["S", "Silence is the answer. Okay. That's depressing, but okay.", "Camila"], ["P", "It's not depressing. It frees you. You put your energy into people who do answer.", "Nathalia"]], "words": 247, "kind": "story", "scene": "July, a park bench at English Bay.", "F": "When someone doesn't reply, two polite follow-ups are usually the limit. A third message should be easy to ignore: \"No pressure at all.\" Nathalia's advice, \"silence is the answer,\" is an important Canadian idea. Notice that \"Just following up\" can create guilt. Nathalia is from Santos, on the coast near São Paulo.", "V": "", "t": [[2.0, 3.55], [3.9, 5.31], [5.66, 8.23], [8.83, 9.92], [10.27, 11.34], [11.94, 12.67], [13.02, 14.23], [14.58, 16.89], [17.24, 20.21], [20.56, 22.44], [22.79, 23.59], [23.94, 26.15], [26.5, 27.3], [27.9, 29.12], [29.72, 33.05], [33.4, 35.97], [36.32, 37.84], [38.19, 40.63], [41.23, 42.12], [42.47, 43.81], [44.16, 45.33], [45.68, 47.04], [47.39, 51.79], [52.39, 54.05], [54.65, 55.56], [55.91, 58.81], [59.16, 62.55], [62.9, 66.02], [66.62, 68.34], [68.94, 70.14], [70.49, 72.28], [72.63, 74.44], [74.79, 76.73], [77.08, 79.41], [79.76, 80.92], [81.52, 85.7], [86.3, 87.97], [88.32, 90.44], [91.04, 92.69], [93.04, 93.9], [94.25, 96.12], [96.72, 98.18], [98.53, 99.65], [100.0, 102.67]], "R": [["A friend asks how long to wait for a reply.", "Camila", "How long do you wait before you give up on someone?", "Usually I send two polite follow-ups. If there's still no answer, I let it go and focus on people who do reply."], ["You want to write a last, gentle follow-up message.", "Nathalia", "Make it easy to ignore.", "No pressure at all, I know summer is busy. If you're ever free in the fall, I'd still love to chat."]]}, {"num": 30, "title": "Bumping Into Someone", "lines": [["P", "Ana? Is that you?", "Sarah"], ["S", "Sarah! Hi! I almost didn't recognize you without a name tag.", "Ana"], ["P", "Ha! I'm off duty. This is my daughter, Maya. Maya, say hi.", "Sarah"], ["P", "Hi.", "Maya"], ["S", "Hi, Maya. I like your sunglasses.", "Ana"], ["P", "They're Mom's.", "Maya"], ["P", "They're not Mom's anymore, apparently. So, how are things? How's the search?", "Sarah"], ["S", "Honestly, up and down. I'm volunteering with the BC Project Leaders Network now. That's been great. I've met a lot of people.", "Ana"], ["P", "Oh, good. Erin's group? She's lovely.", "Sarah"], ["S", "She is. She put me in charge of name tags at the last event.", "Ana"], ["P", "Name tags! The most powerful job in networking. You decide who everyone is.", "Sarah"], ["S", "And I had two interviews last month. One for a coordinator role, which I think I was too senior for, and one for a project manager role, but they chose someone with more Canadian experience.", "Ana"], ["P", "Ugh. That Canadian-experience thing. I hear it every week. It's frustrating.", "Sarah"], ["S", "It is. Any news on your client? The transit firm?", "Ana"], ["P", "That's the bad news, sort of. The project is on hold until the fall. Funding.", "Sarah"], ["S", "Oh. I understand.", "Ana"], ["P", "But it's on hold, not cancelled. I still have your profile at the top of my list. When it starts again, you'll be the first person I call.", "Sarah"], ["S", "Thank you. That's good to know.", "Ana"], ["P", "Mom, the pie place is closing.", "Maya"], ["P", "The pie place is not closing. It's nine-thirty in the morning. Sorry, Ana. Priorities.", "Sarah"], ["S", "Go! Pie is important.", "Ana"], ["P", "Pie is very important. Let's catch up properly soon.", "Sarah"]], "words": 244, "kind": "story", "scene": "August, a Saturday at the Granville Island Public Market.", "F": "Running into a contact on the weekend is common in Vancouver. Keep it short and friendly, with a quick update. Sarah gives bad news gently: \"on hold, not cancelled.\" \"Let's catch up properly soon\" is friendly, but it isn't a real plan. \"Off duty\" means not working.", "V": "", "t": [[2.0, 2.77], [3.12, 4.26], [4.86, 5.42], [5.77, 6.26], [6.61, 9.46], [10.06, 10.79], [11.14, 12.35], [12.7, 14.48], [14.83, 16.2], [16.8, 17.49], [18.09, 18.84], [19.19, 20.57], [21.17, 22.24], [22.84, 25.24], [25.59, 27.09], [27.44, 28.84], [29.44, 30.83], [31.18, 34.74], [35.09, 36.05], [36.4, 37.62], [38.22, 39.34], [39.69, 40.93], [41.28, 42.45], [43.05, 43.66], [44.01, 46.92], [47.52, 48.72], [49.07, 51.4], [51.75, 53.71], [54.31, 56.11], [56.46, 66.27], [66.87, 67.6], [67.95, 69.97], [70.32, 71.9], [72.25, 73.59], [74.19, 74.85], [75.2, 76.54], [76.89, 77.93], [78.53, 80.41], [80.76, 83.38], [83.73, 84.61], [85.21, 85.64], [85.99, 86.92], [87.52, 89.55], [89.9, 92.68], [93.03, 95.91], [96.51, 97.19], [97.54, 98.52], [99.12, 101.22], [101.82, 103.93], [104.28, 106.14], [106.49, 107.72], [108.07, 109.21], [109.81, 110.29], [110.64, 111.78], [112.38, 114.21], [114.56, 116.51]], "R": [["You run into a professional contact on the weekend.", "Sarah", "So, how are things? How's the search?", "Up and down, honestly. I'm volunteering with the BC Project Leaders Network, and I've had a couple of interviews."], ["Someone tells you a project has been delayed.", "Sarah", "The project is on hold until the fall.", "I understand. Thanks for letting me know. I'm still very interested when it starts again."]]}, {"num": 31, "title": "It's Been a While", "lines": [["S", "Hi Priscilla. Thanks for answering my message. I know it's been a while.", "Thiago"], ["P", "Thiago! Florianópolis! Yes, it has. What happened? You disappeared after I sent you the questions.", "Priscilla"], ["S", "I know. I'm sorry. I answered your questions, but then I got the job at the ferry startup, and I was so busy I didn't follow up properly.", "Thiago"], ["P", "Wait, you got the job? Congratulations! That's great news.", "Priscilla"], ["S", "Thank you. But that's actually why I'm calling. The startup ran out of money. They let half the team go last week. Including me.", "Thiago"], ["P", "Oh, no. I'm so sorry. That's awful.", "Priscilla"], ["S", "It's okay. It was only four months, but I learned a lot. And I felt bad, because I only contacted you again when I needed something.", "Thiago"], ["P", "Thiago, honestly, everybody does that. At least you're honest about it.", "Priscilla"], ["S", "So I wanted to ask, without pressure, is your team still growing?", "Thiago"], ["P", "We are, slowly. We're hiring one back-end developer in September. Remote is possible.", "Priscilla"], ["S", "That's exactly what I do.", "Thiago"], ["P", "I know. Here's what I'd suggest. Apply through the website, so HR has you in the system. Then send me a message, and I'll tell the hiring manager to look for your name.", "Priscilla"], ["S", "That would be amazing. Thank you.", "Thiago"], ["P", "And Thiago?", "Priscilla"], ["S", "Yes?", "Thiago"], ["P", "This time, keep in touch even when you don't need something.", "Priscilla"], ["S", "I promise. I'll send you photos of the rain.", "Thiago"], ["P", "Please don't.", "Priscilla"]], "words": 227, "kind": "story", "scene": "August, a video call. Thiago reconnects with Priscilla after three months.", "F": "Reconnecting after a long silence is easier if you're honest: \"I know it's been a while\" and \"I only contacted you again when I needed something.\" Priscilla explains a common process: apply online so HR has your application, then the contact tells the hiring manager to look for your name. \"They let half the team go\" means they fired half the staff.", "V": "", "t": [[2.0, 2.88], [3.23, 4.68], [5.03, 6.11], [6.71, 7.58], [7.93, 9.26], [9.61, 10.88], [11.23, 12.4], [12.75, 15.36], [15.96, 16.57], [16.92, 17.71], [18.06, 24.48], [25.08, 26.73], [27.08, 28.59], [28.94, 30.34], [30.94, 31.63], [31.98, 33.58], [33.93, 35.29], [35.64, 37.29], [37.64, 38.49], [39.09, 40.1], [40.45, 41.79], [42.14, 43.38], [43.98, 44.73], [45.08, 47.18], [47.53, 51.44], [52.04, 54.8], [55.15, 56.99], [57.59, 60.92], [61.52, 62.86], [63.21, 66.25], [66.6, 68.28], [68.88, 70.22], [70.82, 71.73], [72.08, 73.69], [74.04, 77.41], [77.76, 82.07], [82.67, 83.69], [84.04, 84.73], [85.33, 86.58], [87.18, 87.7], [88.3, 91.4], [92.0, 92.79], [93.14, 94.62], [95.22, 96.4]], "R": [["You contact someone after months of silence.", "Priscilla", "It's been a while! What happened?", "I know, I'm sorry. I got busy with a new job and didn't follow up properly. How have you been?"], ["Someone tells you about a job opening and offers to help.", "Priscilla", "Apply through the website, then send me a message.", "That's perfect. I'll apply today and let you know as soon as I do."]]}, {"num": 32, "title": "I Passed", "lines": [["S", "Karen! Do you have one second?", "Juliana"], ["P", "For you, one second. What's up? You look like you're about to explode.", "Karen"], ["S", "I passed! The exam. I got the results this morning. I passed.", "Juliana"], ["P", "You passed? Juliana! Come here. Congratulations!", "Karen"], ["S", "I cried in the parking lot for twenty minutes. A security guard asked if I was okay.", "Juliana"], ["P", "Ha! That's the right reaction. Have you told your family?", "Karen"], ["S", "I called my mother in Salvador. She screamed so loud my husband heard it from the kitchen.", "Juliana"], ["P", "I love that. Okay, so what's next? You have to finish the registration?", "Karen"], ["S", "Yes. A few more documents, and then I'm officially a registered nurse in British Columbia. Maybe four weeks.", "Juliana"], ["P", "Four weeks. Okay. Now listen to me, because this is important. We're posting two positions on this unit in September. Casual positions, mostly nights.", "Karen"], ["S", "Nights are fine. In Salvador, I worked nights for three years.", "Juliana"], ["P", "When the posting goes up, apply right away. Put me down as a reference. And mention your volunteer hours here. Everyone on the unit knows you now.", "Karen"], ["S", "The blanket folder.", "Juliana"], ["P", "The famous blanket folder. Some of the nurses actually asked me when you're starting.", "Karen"], ["S", "Really?", "Juliana"], ["P", "Really. I can't promise you the job. There's a process. But you're not a stranger anymore, and that matters a lot.", "Karen"], ["S", "Thank you, Karen. For everything.", "Juliana"], ["P", "Thank me by surviving your first night shift. Now go, I have a patient waiting.", "Karen"]], "words": 233, "kind": "story", "scene": "August, a hospital hallway. Juliana finds Karen between patients.", "F": "Juliana shares good news with the person who helped her, and that keeps the relationship going. Karen explains why volunteering mattered: \"You're not a stranger anymore.\" \"Casual positions\" are jobs without fixed hours, often a first step into a hospital. \"Put me down as a reference\" means use Karen's name.", "V": "", "t": [[2.0, 2.56], [2.91, 4.15], [4.75, 6.25], [6.6, 7.39], [7.74, 9.67], [10.27, 10.99], [11.34, 12.07], [12.42, 13.97], [14.32, 15.02], [15.62, 16.78], [17.13, 18.08], [18.43, 19.24], [19.59, 20.98], [21.58, 24.11], [24.46, 26.66], [27.26, 27.86], [28.21, 29.72], [30.07, 31.46], [32.06, 33.83], [34.18, 37.36], [37.96, 38.98], [39.33, 40.9], [41.25, 43.28], [43.88, 44.41], [44.76, 49.69], [50.04, 51.11], [51.71, 52.65], [53.0, 53.79], [54.14, 56.56], [56.91, 59.76], [60.11, 62.17], [62.77, 63.73], [64.08, 66.54], [67.14, 69.54], [69.89, 71.5], [71.85, 73.91], [74.26, 76.25], [76.85, 77.93], [78.53, 80.21], [80.56, 83.31], [83.91, 84.5], [85.1, 86.11], [86.46, 88.22], [88.57, 89.8], [90.15, 93.22], [93.82, 94.77], [95.12, 95.99], [96.59, 99.04], [99.39, 101.46]], "R": [["You share good news with someone who helped you.", "Karen", "What's up? You look like you're about to explode.", "I passed the exam! I got the results this morning, and you were the first person I wanted to tell here."], ["Someone tells you about upcoming job postings.", "Karen", "We're posting two positions in September. Apply right away.", "Thank you, I will. Can I still put you down as a reference?"]]}, {"num": 33, "title": "Too Much", "lines": [["S", "Hello?", "Dev"], ["P", "Dev! It's Tyler. Sorry, I know I called yesterday.", "Tyler"], ["S", "And on Monday. Hi, Tyler. What's going on?", "Dev"], ["P", "So, I saw that a company posted a job, and I think you know someone there, so I wanted to ask if you could introduce me today.", "Tyler"], ["S", "Which company?", "Dev"], ["P", "Harbourline Logistics.", "Tyler"], ["S", "I know one person there, and I met her once, two years ago.", "Dev"], ["P", "Perfect. Can you message her tonight?", "Tyler"], ["S", "Tyler, I'm going to be honest with you, because I like you.", "Dev"], ["P", "Uh-oh.", "Tyler"], ["S", "When you call me three times in one week, it feels like pressure. And I can't introduce you to someone I barely know. It would look strange for both of us.", "Dev"], ["P", "Oh. I didn't think about it like that.", "Tyler"], ["S", "Most people don't, at your age. I didn't either. I once sent a CEO four emails in one day.", "Dev"], ["P", "What happened?", "Tyler"], ["S", "Nothing. That was the problem. Look, you're enthusiastic, and that's good. But people here need a bit more space. If you push too hard, they back away.", "Dev"], ["P", "So what should I do?", "Tyler"], ["S", "Apply to the Harbourline job yourself. Come to the meetup next week. Actually talk to people about something other than jobs. Ask them about their weekend.", "Dev"], ["P", "Their weekend.", "Tyler"], ["S", "Their weekend. People help people they like, Tyler. And they like people who are interested in them.", "Dev"], ["P", "Okay. Okay. That's fair. Sorry, Dev.", "Tyler"], ["S", "Don't be sorry. Just call me less. Maybe once a month.", "Dev"], ["P", "Once a month. Got it. Can I text you, though?", "Tyler"], ["S", "Goodbye, Tyler.", "Dev"]], "words": 247, "kind": "story", "scene": "August, a phone call. Dev answers while walking his dog.", "F": "Dev sets a boundary kindly but clearly: \"I'm going to be honest with you, because I like you.\" He explains that too much contact \"feels like pressure.\" This is the opposite of Camila's problem in script 29. Canadians usually prefer more space between follow-ups. \"They back away\" means they slowly avoid you.", "V": "", "t": [[2.0, 2.59], [3.19, 3.82], [4.17, 5.16], [5.51, 7.57], [8.17, 9.06], [9.41, 10.21], [10.56, 11.5], [12.1, 18.69], [19.29, 20.19], [20.79, 22.42], [23.02, 26.34], [26.94, 27.72], [28.07, 29.72], [30.32, 33.47], [34.07, 34.77], [35.37, 39.07], [39.42, 42.17], [42.52, 44.28], [44.88, 45.47], [45.82, 47.52], [48.12, 49.74], [50.09, 50.96], [51.31, 54.01], [54.61, 55.66], [56.26, 56.87], [57.22, 58.28], [58.63, 60.52], [60.87, 62.85], [63.2, 65.04], [65.64, 66.99], [67.59, 69.73], [70.08, 71.56], [71.91, 74.93], [75.28, 76.66], [77.26, 78.39], [78.99, 79.82], [80.17, 82.02], [82.37, 84.51], [85.11, 85.92], [86.27, 87.08], [87.43, 88.31], [88.66, 89.81], [90.41, 91.31], [91.66, 92.7], [93.05, 94.12], [94.72, 95.82], [96.17, 96.89], [97.24, 98.77], [99.37, 100.32]], "R": [["Someone keeps calling you too often.", "Tyler", "Sorry, I know I called yesterday.", "No problem, but I'll be honest: I can't always answer during the week. A message is easier for me."], ["Someone asks you to introduce them to a person you barely know.", "Tyler", "Can you message her tonight?", "I'm sorry, I only met her once, so it wouldn't feel right. But you should definitely apply directly."]]}, {"num": 34, "title": "The Voicemail", "lines": [["S", "Fausto, help me. A contractor left me a message, and he speaks very fast. Listen.", "Sergio"], ["P", "Hey, Sergio, it's Darren from Pacific Spark Electric. Got your name from Dev Sharma. So, we've got a crew starting on a mid-rise in Burquitlam next month, and we might need an extra journeyman, depending on your ticket situation. Give me a shout back at six-oh-four, five-five-five, two-one-eight-seven. I'm on site till three, so after that's best. Cheers.", "Darren"], ["S", "You see? I understood \"Sergio\" and \"cheers.\"", "Sergio"], ["P", "Play it again. Slowly. Okay, his name is Darren. The company is Pacific Spark Electric.", "Fausto"], ["S", "Yes, I got that part. What is \"a mid-rise\"?", "Sergio"], ["P", "A building that's not too tall. Maybe six to twelve floors.", "Fausto"], ["S", "And Burquitlam?", "Sergio"], ["P", "It's an area between Burnaby and Coquitlam. Near the SkyTrain.", "Fausto"], ["S", "Okay. And \"journeyman\"?", "Sergio"], ["P", "A fully qualified electrician. Not an apprentice.", "Fausto"], ["S", "And \"ticket situation\"? I don't have a ticket. I took the bus.", "Sergio"], ["P", "Ha! No. \"Ticket\" means your certification. Your Red Seal, or your provincial licence. He wants to know if you're certified here.", "Fausto"], ["S", "Ah. My assessment is almost finished. Okay. And the number?", "Sergio"], ["P", "Six-oh-four, five-five-five, two-one-eight-seven. Call after three. He's on the job site until then.", "Fausto"], ["S", "And \"give me a shout\"?", "Sergio"], ["P", "Call me back.", "Fausto"], ["S", "Why don't they just say \"call me back\"?", "Sergio"], ["P", "Because then it would be too easy for us.", "Fausto"], ["S", "In Goiânia, people leave voice messages that are five minutes long. This was twenty seconds, and I understood nothing.", "Sergio"]], "words": 237, "kind": "story", "scene": "September, Fausto's kitchen. Sergio plays a voicemail on speaker.", "F": "Voicemails are fast and full of workplace slang. Listen for: \"Give me a shout back\" (call me back), \"ticket\" (certification in the trades), \"journeyman\" (fully qualified tradesperson), \"mid-rise\" (medium-height building), and \"on site\" (at the construction site). Practise writing down the phone number. Sergio is from Goiânia, in central Brazil.", "V": "", "t": [[2.0, 3.02], [3.37, 6.63], [6.98, 7.6], [8.2, 12.08], [12.43, 14.76], [15.11, 24.54], [24.89, 29.71], [30.06, 33.03], [33.38, 34.22], [34.82, 35.52], [35.87, 37.7], [38.3, 39.28], [39.63, 40.31], [40.66, 42.38], [42.73, 45.01], [45.61, 46.76], [47.11, 48.24], [48.84, 50.61], [50.96, 52.84], [53.44, 54.4], [55.0, 57.54], [57.89, 59.23], [59.83, 60.47], [60.82, 61.71], [62.31, 64.17], [64.52, 65.71], [66.31, 67.66], [68.01, 69.07], [69.42, 70.36], [70.96, 71.45], [71.8, 72.35], [72.7, 74.88], [75.23, 77.52], [77.87, 79.94], [80.54, 81.03], [81.38, 83.06], [83.41, 84.05], [84.4, 85.15], [85.75, 88.54], [88.89, 90.07], [90.42, 92.36], [92.96, 93.97], [94.57, 95.43], [96.03, 97.84], [98.44, 100.49], [101.09, 105.02], [105.37, 107.98]], "R": [["You call back someone who left you a voicemail.", "Darren", "Darren speaking.", "Hi Darren, it's Sergio returning your call. Dev Sharma gave you my name. You mentioned a project in Burquitlam?"], ["Someone asks about your certification.", "Darren", "What's your ticket situation?", "My provincial assessment is almost finished. I should have it within a few weeks, and I have twelve years of experience."]]}]}, {"part": 5, "title": "Panels and Workshops", "desc": "Questions in public, talking to speakers, group activities, and webinars.", "scripts": [{"num": 35, "title": "One Good Question", "lines": [["P", "Okay, we have time for a few questions. Yes, the gentleman in the blue shirt. Could you say your name first?", "Moderator"], ["S", "Thank you. My name is Marcio. I worked in logistics in Campinas, in Brazil, for fifteen years. My question is for Linda. You said the port is planning to double container traffic in ten years. What's the biggest bottleneck right now? Is it the trucks, the rail, or the people?", "Marcio"], ["P", "Ooh. Great question. Honestly? The people. We can buy more cranes. We can't buy more experienced planners.", "Linda"], ["P", "Is that a common problem across the industry?", "Moderator"], ["P", "Very. Half our senior planners will retire in the next eight years. And the younger people don't always want to work night shifts at a port.", "Linda"], ["S", "In Campinas, we had the same problem with the airport cargo terminal. We solved part of it with a training program for people from other industries.", "Marcio"], ["P", "That's interesting. What kind of people?", "Linda"], ["S", "Truck drivers, warehouse supervisors, even bus dispatchers. They already understand schedules and pressure.", "Marcio"], ["P", "Huh. Bus dispatchers. I like that. Come find me after the panel, I want to hear more.", "Linda"], ["P", "Well, that's the first time a question has turned into a job interview on stage. Thank you, Marcio.", "Moderator"], ["S", "Thank you.", "Marcio"], ["P", "Okay, next question. Yes, in the back.", "Moderator"], ["P", "Hi, I'm Tyler. So, this is more of a comment than a question, but I just graduated, and I think companies should hire more young people, because we're really good with technology, and also...", "Tyler"], ["P", "Do you have a question for the panel, Tyler?", "Moderator"], ["P", "Um. Are you hiring?", "Tyler"]], "words": 258, "kind": "story", "scene": "September, a supply-chain panel at the Vancouver Board of Trade.", "F": "Marcio's question is a model: his name, one sentence about his background, then one clear question with options (\"the trucks, the rail, or the people?\"). His follow-up adds real value. Tyler's \"more of a comment than a question\" is a phrase moderators dread. Marcio is from Campinas, near São Paulo.", "V": "", "t": [[2.0, 4.43], [4.78, 6.95], [7.3, 9.22], [9.82, 10.51], [10.86, 11.96], [12.31, 16.05], [16.4, 17.78], [18.13, 21.9], [22.25, 24.05], [24.4, 26.22], [26.82, 27.27], [27.62, 28.58], [28.93, 29.63], [29.98, 30.72], [31.07, 32.41], [32.76, 34.84], [35.44, 38.23], [38.83, 39.37], [39.72, 43.0], [43.35, 47.13], [47.73, 51.66], [52.01, 56.22], [56.82, 57.82], [58.17, 59.23], [59.83, 63.26], [63.61, 65.72], [66.32, 66.77], [67.12, 68.18], [68.53, 69.4], [69.75, 72.43], [73.03, 77.34], [77.69, 79.04], [79.64, 80.33], [80.93, 82.61], [82.96, 84.27], [84.87, 86.3], [86.65, 95.51], [96.11, 98.47], [99.07, 99.66], [100.01, 101.22]], "R": [["The moderator invites you to ask a question at a panel.", "Moderator", "Yes, you in the blue shirt. Could you say your name first?", "Thank you. I'm Marcio. I worked in logistics in Brazil for fifteen years. What's the biggest bottleneck at the port right now?"], ["A speaker asks you to find them after the panel.", "Linda", "Come find me after the panel, I want to hear more.", "I'd be happy to. Thank you, I'll come and say hi."]]}, {"num": 36, "title": "The Wrong Thing, Out Loud", "lines": [["P", "We've got time for one more question. Ana? Go ahead.", "Erin"], ["S", "Thank you. I'm Ana. I managed a metro project in São Paulo. My question is for Dana. You mentioned that the new line is two years behind schedule. In Brazil, honestly, the contractor would be in very big trouble for a delay like that. Why is it acceptable here?", "Ana"], ["P", "Well...", "Dana"], ["S", "Sorry, that came out wrong. I didn't mean it's acceptable. I mean... I'm very curious about how delays are handled here.", "Ana"], ["P", "Ha! No, it's fine. It's a fair question, even if it hurt a little.", "Dana"], ["S", "I'm so sorry. In my head, it sounded much more polite.", "Ana"], ["P", "Everything sounds more polite in our heads. Okay, honest answer. Here, most delays come before construction, not during. Permits, environmental reviews, consultations with First Nations and communities. Those take time, and they should.", "Dana"], ["S", "So the schedule was too optimistic from the beginning?", "Ana"], ["P", "Let's just say that schedules made by politicians are always optimistic. I didn't say that, by the way. Erin, cut that from the recording.", "Dana"], ["P", "Ha! Cut.", "Erin"], ["P", "But you're right that the contractor side is different too. Our contracts share the risk more. Nobody's going to be in \"very big trouble.\" We'd all be in medium trouble together.", "Dana"], ["S", "Medium trouble together. I like that. In Brazil, we'd say we're all in the same boat.", "Ana"], ["P", "Same here. Same boat. Very slow boat. Thank you, Ana. That was the most honest question I've had all year.", "Dana"], ["P", "Okay, let's thank our panel.", "Erin"]], "words": 246, "kind": "story", "scene": "October, a transit panel hosted by the BC Project Leaders Network.", "F": "Ana's question sounds like criticism, and she recovers well: \"Sorry, that came out wrong,\" then a softer version. Dana responds with humour. Canadians often soften direct questions with phrases like \"I'm curious about...\" \"I didn't say that, by the way\" is a joke meaning she said something she shouldn't have. \"We're all in the same boat\" means we share the same problem.", "V": "", "t": [[2.0, 4.14], [4.49, 5.08], [5.43, 6.3], [6.9, 7.58], [7.93, 8.61], [8.96, 11.3], [11.65, 13.2], [13.55, 16.71], [17.06, 22.31], [22.66, 24.22], [24.82, 25.43], [26.03, 27.54], [27.89, 29.39], [29.74, 30.4], [30.75, 33.67], [34.27, 34.73], [35.08, 36.0], [36.35, 38.7], [39.3, 40.25], [40.6, 42.99], [43.59, 45.78], [46.13, 47.42], [47.77, 50.89], [51.24, 56.46], [56.81, 58.27], [58.87, 61.6], [62.2, 66.72], [67.07, 68.58], [68.93, 70.58], [71.18, 71.82], [72.17, 72.8], [73.4, 76.25], [76.6, 78.26], [78.61, 81.02], [81.37, 83.47], [84.07, 85.47], [85.82, 86.67], [87.02, 89.65], [90.25, 90.98], [91.33, 92.14], [92.49, 93.55], [93.9, 94.77], [95.12, 97.78], [98.38, 100.13]], "R": [["Your question at a panel comes out sounding rude.", "Dana", "Well...", "Sorry, that came out wrong. I'm just very curious about how delays are handled here."], ["You want to ask a direct question politely.", "Erin", "Go ahead with your question.", "I'm curious about how project delays are handled here. Is it different from how contractors are managed in Brazil?"]]}, {"num": 37, "title": "Going Up to the Speaker", "lines": [["S", "Dana? Hi. I'm Ana. The one with the terrible question.", "Ana"], ["P", "The one with the excellent question. Don't apologize. You woke everyone up.", "Dana"], ["S", "I've been embarrassed for forty minutes.", "Ana"], ["P", "Please stop. Honestly, most questions at these things are just speeches. Yours was real. Can I ask what happened with your metro project in São Paulo? Was it late?", "Dana"], ["S", "Three weeks late. Nine kilometres, six stations.", "Ana"], ["P", "Three weeks? What did you do differently?", "Dana"], ["S", "We spent a lot of time on the interfaces. Where the tunnel contractor finishes and the station contractor starts. In my experience, that's where most delays come from. Not the big problems. The handovers.", "Ana"], ["P", "Oh, that's very true. We've had the same thing on our line. The tunnel team blames the station team, and the station team blames the tunnel team.", "Dana"], ["S", "And the project manager blames everybody.", "Ana"], ["P", "Ha! Exactly. Okay, Ana, what are you doing now?", "Dana"], ["S", "I'm looking for a project management role on transit or infrastructure projects. I volunteer with Erin's group in the meantime.", "Ana"], ["P", "Okay. I can't promise anything, and I'm not hiring personally. But our interface management team is understaffed. Send me your LinkedIn, and I'll pass it to the person who runs that team.", "Dana"], ["S", "Thank you. That's very generous.", "Ana"], ["P", "It's selfish, actually. If you fix our handovers, my life gets easier.", "Dana"], ["S", "Then I'll do my best to make your life easier.", "Ana"], ["P", "Good. And next time, ask the terrible question again. Just a little more quietly.", "Dana"]], "words": 240, "kind": "story", "scene": "Same evening, after the panel, near the coffee table.", "F": "Approaching a speaker after a panel is a great opportunity. Ana mentions her question with humour (\"the one with the terrible question\"), then gives a specific insight: delays come from \"the handovers.\" Dana's offer is careful: \"I can't promise anything, and I'm not hiring personally.\" \"Pass it to\" means give it to.", "V": "", "t": [[2.0, 2.57], [2.92, 3.41], [3.76, 4.44], [4.79, 6.52], [7.12, 8.82], [9.17, 10.27], [10.62, 11.78], [12.38, 14.21], [14.81, 15.63], [15.98, 19.13], [19.48, 20.47], [20.82, 24.42], [24.77, 25.57], [26.17, 27.18], [27.53, 29.53], [30.13, 30.89], [31.24, 32.54], [33.14, 35.49], [35.84, 39.63], [39.98, 42.91], [43.26, 44.58], [44.93, 45.85], [46.45, 47.59], [47.94, 49.68], [50.03, 55.02], [55.62, 57.96], [58.56, 59.02], [59.37, 60.14], [60.49, 62.25], [62.85, 67.68], [68.03, 70.44], [71.04, 71.68], [72.03, 75.34], [75.69, 78.53], [78.88, 82.9], [83.5, 84.18], [84.53, 85.72], [86.32, 87.62], [87.97, 90.56], [91.16, 93.61], [94.21, 94.69], [95.04, 97.63], [97.98, 99.38]], "R": [["You approach a speaker after a panel.", "Dana", "Hi! You asked a question earlier, right?", "Yes, I'm Ana. I asked the slightly terrible question. I wanted to say thank you for answering it so honestly."], ["Someone asks what you're doing now.", "Dana", "So what are you doing now?", "I'm looking for a project management role on transit projects. In the meantime, I volunteer with the BC Project Leaders Network."]]}, {"num": 38, "title": "The Breakout Group", "lines": [["P", "Okay, everyone, you have ten minutes in your groups. Share your headline, and the group gives feedback. Go.", "Facilitator"], ["P", "I'll go first. My headline says, \"Ambitious Business Graduate, Open to All Opportunities, Hard Worker, Team Player, Fast Learner.\"", "Tyler"], ["S", "That's a lot of things.", "Camila"], ["P", "I want to cover everything.", "Tyler"], ["S", "Okay, but... sorry, we haven't heard from... what's your name?", "Camila"], ["P", "Graziela. Thank you. I was trying to...", "Graziela"], ["P", "So do you think \"Team Player\" is too much?", "Tyler"], ["S", "Tyler, one second. Let's hear from Graziela first, and then we'll come back to you. Graziela?", "Camila"], ["P", "Thank you. Okay, mine says, \"Teacher.\" Just \"Teacher.\" I taught high school in Belo Horizonte for eleven years, but now I want to work in corporate training.", "Graziela"], ["S", "Then I think your headline should say that. Something like, \"Corporate Trainer, eleven years designing and delivering learning programs.\"", "Camila"], ["P", "But I wasn't a corporate trainer. I was a teacher.", "Graziela"], ["S", "You designed courses, right? You presented to big groups every day? You managed difficult audiences?", "Camila"], ["P", "Very difficult. Thirty-five teenagers at eight a.m.", "Graziela"], ["P", "That's honestly harder than any corporate job.", "Tyler"], ["P", "Thank you, Tyler.", "Graziela"], ["S", "Tyler is right. A room of managers is easy after that.", "Camila"], ["P", "Can I say something about my headline now?", "Tyler"], ["S", "Yes. Cut it to three words.", "Camila"], ["P", "Three?", "Tyler"], ["S", "Three. And \"Team Player\" isn't one of them.", "Camila"], ["P", "Okay. \"Business Graduate. Operations.\"", "Tyler"], ["S", "That's two.", "Camila"], ["P", "\"Business Graduate, Operations, Supply Chain.\"", "Tyler"], ["S", "Better. Much better.", "Camila"], ["P", "Two minutes left, everyone.", "Facilitator"]], "words": 229, "kind": "story", "scene": "October, a LinkedIn workshop at the Vancouver Public Library. Four strangers at one table.", "F": "Group activities need turn-taking. Tyler keeps talking, so Camila politely brings Graziela in: \"Let's hear from Graziela first, and then we'll come back to you.\" Graziela learns to describe her teaching experience in corporate language. \"We haven't heard from...\" is a polite way to invite a quiet person to speak. Graziela is from Belo Horizonte, in the state of Minas Gerais.", "V": "", "t": [[2.0, 4.89], [5.24, 7.75], [8.1, 8.73], [9.33, 10.57], [10.92, 17.22], [17.82, 19.28], [19.88, 21.5], [22.1, 23.22], [23.57, 25.25], [25.6, 26.69], [27.29, 28.05], [28.4, 29.07], [29.42, 30.58], [31.18, 33.38], [33.98, 35.42], [35.77, 39.03], [39.38, 40.32], [40.92, 41.59], [41.94, 43.61], [43.96, 44.98], [45.33, 51.39], [51.99, 54.32], [54.67, 59.86], [60.46, 62.04], [62.39, 63.44], [64.04, 65.79], [66.14, 68.36], [68.71, 70.8], [71.4, 72.35], [72.7, 73.19], [73.79, 76.28], [76.88, 77.82], [78.42, 79.56], [79.91, 82.43], [83.03, 85.54], [86.14, 86.84], [87.19, 88.64], [89.24, 89.94], [90.54, 91.26], [91.61, 93.56], [94.16, 94.97], [95.32, 96.63], [96.98, 98.2], [98.8, 99.72], [100.32, 103.07], [103.67, 104.36], [104.71, 105.65], [106.25, 107.94]], "R": [["Someone keeps talking in a group, and another person hasn't spoken yet.", "Tyler", "So do you think \"Team Player\" is too much?", "One second, Tyler. Let's hear from Graziela first, and then we'll come back to you."], ["You're asked to share your professional headline in a group.", "Facilitator", "Share your headline with your group.", "Mine says, \"Corporate Trainer, eleven years designing and delivering learning programs.\" I'd love your feedback."]]}, {"num": 39, "title": "Lunch With Strangers", "lines": [["S", "Excuse me, is this seat free?", "Bruno"], ["P", "All yours. Grab it before the dessert disappears.", "Gary"], ["S", "Thank you. I'm Bruno.", "Bruno"], ["P", "Gary. And this is Priya, and that's Cristiane. We're the table that got here early for the cookies.", "Gary"], ["P", "Oi! You're Brazilian?", "Cristiane"], ["S", "Yes! From Porto Alegre. How did you know?", "Bruno"], ["P", "Your accent. And you said \"excuse me\" exactly like my brother. I'm from Brasília.", "Cristiane"], ["P", "Uh-oh. Are you two going to switch to Portuguese and leave us out?", "Gary"], ["S", "No, no. We practise English. It's our rule.", "Bruno"], ["P", "It's a good rule. So, Bruno, what do you do?", "Cristiane"], ["S", "I'm a financial analyst. I'm working on contract right now, reviewing budgets for a non-profit, and looking for something permanent.", "Bruno"], ["P", "Have you started your CPA?", "Priya"], ["S", "Not yet. Is it necessary?", "Bruno"], ["P", "Not for every job. But for the jobs you probably want, it helps a lot. I did mine at thirty-eight. Worst year of my life. Best decision.", "Gary"], ["P", "I'm doing it now. Two modules finished. I'm exhausted, but my salary is already better.", "Cristiane"], ["S", "How long does it take?", "Bruno"], ["P", "For us, with foreign experience, maybe two years, part-time.", "Cristiane"], ["P", "Do it while you're job-hunting. Employers like seeing it in progress.", "Priya"], ["S", "Okay. I didn't plan to talk about exams at lunch.", "Bruno"], ["P", "That's what finance people do at lunch. We talk about exams and complain about the coffee.", "Gary"], ["P", "The coffee here is actually terrible.", "Priya"], ["P", "In Brasília, this would be illegal.", "Cristiane"]], "words": 227, "kind": "story", "scene": "October, a finance conference at the Vancouver Convention Centre. A round table at lunch.", "F": "Conference lunches are easy networking: ask \"Is this seat free?\" and introduce yourself. Notice how the group shares useful information naturally, without anyone asking for help. \"All yours\" means \"you can take it.\" CPA is the Canadian accounting designation, Chartered Professional Accountant. Cristiane is from Brasília, the capital of Brazil.", "V": "", "t": [[2.0, 4.1], [4.7, 5.86], [6.21, 9.05], [9.65, 10.51], [10.86, 11.95], [12.55, 13.42], [13.77, 16.71], [17.06, 20.21], [20.81, 21.47], [21.82, 23.01], [23.61, 24.37], [24.72, 26.29], [26.64, 27.82], [28.42, 29.61], [29.96, 32.84], [33.19, 34.65], [35.25, 36.17], [36.52, 40.26], [40.86, 41.99], [42.34, 43.92], [44.27, 45.46], [46.06, 47.41], [47.76, 49.44], [50.04, 51.97], [52.32, 58.32], [58.92, 60.84], [61.44, 62.43], [62.78, 64.22], [64.82, 66.52], [66.87, 70.45], [70.8, 73.04], [73.39, 75.37], [75.72, 77.19], [77.79, 79.18], [79.53, 81.1], [81.45, 84.18], [84.78, 86.39], [86.99, 90.49], [91.09, 92.88], [93.23, 95.73], [96.33, 97.25], [97.6, 100.31], [100.91, 103.75], [104.1, 107.54], [108.14, 110.46], [111.06, 113.24]], "R": [["You want to sit at a table with strangers at a conference lunch.", "Gary", "Hi there. Looking for a seat?", "Excuse me, is this seat free? I'm Bruno, nice to meet you all."], ["Someone at the table asks what you do.", "Cristiane", "So, what do you do?", "I'm a financial analyst. I'm on a contract right now, and I'm looking for something permanent."]]}, {"num": 40, "title": "What the Panel Thought", "lines": [["S", "So, how did you find the audience tonight?", "Erin"], ["P", "Better than usual. Usually I get three speeches and one question about parking.", "Dana"], ["S", "We did get the question about parking.", "Erin"], ["P", "We always get the question about parking. But Ana, the Brazilian woman. That question was something.", "Dana"], ["S", "I wanted to hide under the table.", "Erin"], ["P", "I didn't. I loved it. She asked what everyone in that room was thinking and nobody would say.", "Dana"], ["S", "She's one of my best volunteers, you know. She reorganized our whole event check-in. People used to wait twenty minutes. Now it's three.", "Erin"], ["P", "That doesn't surprise me. She talked to me afterwards about interfaces. Tunnel teams and station teams.", "Dana"], ["S", "She told me. She was very excited.", "Erin"], ["P", "She was right, that's the annoying part. I'm going to send her name to Kevin.", "Dana"], ["S", "Kevin who runs interface management?", "Erin"], ["P", "That Kevin. He's been complaining for months that he can't find anyone with real experience.", "Dana"], ["S", "Do you want me to put in a good word too?", "Erin"], ["P", "Please. A volunteer coordinator who says \"she fixed our check-in\" is worth more than any reference letter.", "Dana"], ["S", "Should I tell Ana?", "Erin"], ["P", "Not yet. Let Kevin call her himself. If I tell her and he doesn't call, she'll feel worse.", "Dana"], ["S", "Fair. You're very Canadian about this.", "Erin"], ["P", "I'm extremely Canadian about this.", "Dana"], ["S", "Then I'll put in a good word and say nothing. Oh, look, we're moving. Three whole metres.", "Erin"], ["P", "Vancouver traffic. Maybe Ana can fix that next.", "Dana"], ["S", "Give her a year.", "Erin"]], "words": 240, "kind": "story", "scene": "October, after the transit panel. Dana and Erin in Erin's car, stuck in traffic on the Granville Street Bridge.", "F": "Another conversation the newcomer never hears. Ana's volunteer work becomes a reason to recommend her: Erin can say \"she fixed our check-in\" from real experience. \"Put in a good word\" means speak positively about someone to help them. \"How did you find the audience?\" means \"what did you think of the audience?\"", "V": "", "t": [[2.0, 4.3], [4.9, 5.9], [6.25, 9.94], [10.54, 12.71], [13.31, 15.5], [15.85, 17.43], [17.78, 19.16], [19.76, 21.7], [22.3, 23.02], [23.37, 24.16], [24.51, 28.47], [29.07, 31.48], [31.83, 34.23], [34.58, 36.62], [36.97, 38.22], [38.82, 40.18], [40.53, 43.05], [43.4, 45.15], [45.75, 46.86], [47.21, 48.79], [49.39, 51.28], [51.63, 53.49], [54.09, 56.42], [57.02, 57.78], [58.13, 62.87], [63.47, 65.54], [66.14, 66.73], [67.08, 72.94], [73.54, 74.92], [75.52, 76.23], [76.58, 78.1], [78.45, 81.18], [81.78, 82.32], [82.67, 84.77], [85.37, 87.35], [87.95, 90.34], [90.69, 92.16], [92.51, 93.87], [94.47, 95.6], [95.95, 97.62], [98.22, 99.39]], "R": [["A colleague asks your opinion of an event.", "Erin", "So, how did you find the audience tonight?", "Better than usual, honestly. There were some really thoughtful questions."], ["Someone offers to recommend a person you both know.", "Erin", "Do you want me to put in a good word too?", "Yes, please. Your opinion would really help."]]}, {"num": 41, "title": "Questions in the Chat", "lines": [["P", "Welcome back, everyone. We've got a ton of questions in the chat, so let's get to some. First one is from... Thigh-ah-go?", "Host"], ["S", "Thiago. It's okay.", "Thiago"], ["P", "Oh, sorry, I see Thiago has unmuted himself. Thiago, go ahead.", "Host"], ["S", "Hi, thanks. It's pronounced Chee-AH-goo, but don't worry. My question is for Ken. I'm a back-end developer, and my last company used one cloud provider for everything. Is it worth learning a second one, or is it better to go deeper in one?", "Thiago"], ["P", "Great question. Honestly, go deeper first. Companies care much more that you really understand one platform than that you know a little about three.", "Ken"], ["S", "Okay. Thank you.", "Thiago"], ["P", "Great. Next question, from Ana Karina. Ana Karina asks, \"How important is a certification compared to real projects?\"", "Host"], ["P", "Real projects, every time. A certification gets you through the first filter. A project you built gets you through the interview.", "Ken"], ["P", "Love that. Ana Karina, I hope that helps. And Thiago, you've got your hand up again?", "Host"], ["S", "Sorry, just a quick follow-up. When you say \"a project you built,\" does it count if it's a personal project? Not for a company?", "Thiago"], ["P", "Absolutely. If it solves a real problem, and you can explain the decisions you made, it counts. I once hired someone because of an app she built to track her grandmother's medications.", "Ken"], ["S", "That's great. Thank you.", "Thiago"], ["P", "Okay, we're almost out of time. Ken, one last piece of advice for people job-hunting in tech right now?", "Host"], ["P", "Keep building, keep talking to people, and don't take rejection personally. The market is tough. It's not you.", "Ken"]], "words": 258, "kind": "story", "scene": "October, an online webinar about cloud careers. Thiago is watching from home.", "F": "Webinars are a new kind of networking. Thiago asks a clear question with two options, then a short follow-up to check what \"a project you built\" means. Listen for \"unmuted,\" \"you've got your hand up,\" and \"go deeper first.\" The host mispronounces Thiago's name, and he corrects it kindly. Ana Karina is another Brazilian in the webinar.", "V": "", "t": [[2.0, 3.51], [3.86, 6.81], [7.16, 8.19], [8.54, 9.41], [10.01, 10.7], [11.05, 11.8], [12.4, 15.19], [15.54, 16.83], [17.43, 18.22], [18.57, 20.64], [20.99, 22.32], [22.67, 27.65], [28.0, 31.69], [32.29, 33.51], [33.86, 35.9], [36.25, 42.4], [43.0, 43.64], [43.99, 44.68], [45.28, 45.9], [46.25, 48.23], [48.58, 53.31], [53.91, 56.2], [56.55, 60.04], [60.39, 63.64], [64.24, 64.96], [65.31, 67.15], [67.5, 69.6], [70.2, 71.77], [72.12, 76.33], [76.68, 77.71], [78.
