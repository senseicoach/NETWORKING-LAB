<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Networking Listening Lab | Ron Taylor Executive Class</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤝</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#23272c; --navy-2:#2e333a; --navy-3:#3c424a; --chalk:#e8eaec; --dim:#a3aab2;
  --paper:#f5f5f3; --white:#fff; --ink:#1e2226; --muted:#5b6168; --rule:#dcdfe2;
  --gold:#4e9c93; --gold-soft:#e2f1ef;
  --missed:#f7dca4; --missed-ink:#6a4300; --extra:#b3261e;
  --p1:#2f6f69; --p2:#7a3b2e; --p3:#2f4f86; --p4:#3d6b3a; --p5:#9a5a12; --p6:#8a3b5a; --p7:#5f5a1c;
  --p8:#4b3f8f; --p9:#1f5e7a; --p10:#6b2d5c; --p11:#384a62; --p12:#8a4b12; --p13:#2d6a4f;
  --part:var(--p1);
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
[data-part="1"]{--part:var(--p1)} [data-part="2"]{--part:var(--p2)} [data-part="3"]{--part:var(--p3)}
[data-part="4"]{--part:var(--p4)} [data-part="5"]{--part:var(--p5)} [data-part="6"]{--part:var(--p6)}
[data-part="7"]{--part:var(--p7)} [data-part="8"]{--part:var(--p8)} [data-part="9"]{--part:var(--p9)}
[data-part="10"]{--part:var(--p10)} [data-part="11"]{--part:var(--p11)} [data-part="12"]{--part:var(--p12)} [data-part="13"]{--part:var(--p13)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.55;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
a{color:var(--part)}

.shell{display:grid;grid-template-columns:330px 1fr;min-height:100vh}
aside{background:var(--navy);color:var(--chalk);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.brand{padding:26px 24px 20px;border-bottom:1px solid var(--navy-3);display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.crest{width:46px;height:46px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;color:var(--gold);font-size:17px;letter-spacing:.02em}
.brand h1{font-family:var(--serif);font-weight:600;font-size:23px;line-height:1.1;color:var(--white)}
.brand p{font-size:13px;color:var(--dim);margin-top:3px}
.search{padding:14px 24px;border-bottom:1px solid var(--navy-3)}
.search input{width:100%;background:var(--navy-2);border:1px solid var(--navy-3);border-radius:8px;padding:9px 12px;color:var(--white)}
.search input::placeholder{color:#8794ad}
.progress-mini{padding:12px 24px;border-bottom:1px solid var(--navy-3);font-size:13px;color:var(--dim)}
.progress-mini .bar{height:5px;background:var(--navy-3);border-radius:3px;margin-top:6px;overflow:hidden}
.progress-mini .bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
nav{overflow-y:auto;flex:1;padding:6px 0 24px}
.home-link{display:block;width:100%;text-align:left;background:none;border:0;color:var(--chalk);padding:12px 24px 8px;cursor:pointer;font-size:14.5px;font-weight:600}
.home-link:hover{color:var(--gold)}
details.part{margin-top:2px}
details.part summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:28px 1fr auto;align-items:baseline;gap:8px;padding:9px 24px;font-family:var(--serif);font-size:16.5px;font-weight:600;color:var(--white)}
details.part summary::-webkit-details-marker{display:none}
details.part summary b{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--navy);background:var(--dim);border-radius:4px;text-align:center;padding:1px 0}
details.part[open] summary b{background:var(--gold)}
details.part summary small{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--dim)}
details.part summary:hover{background:var(--navy-2)}
nav ol{list-style:none;padding:2px 0 8px}
nav li button{display:grid;grid-template-columns:30px 1fr 16px;gap:6px;width:100%;text-align:left;background:none;border:0;color:#c9d1df;padding:6px 20px 6px 40px;cursor:pointer;font-size:14px;line-height:1.35}
nav li button span:first-child{color:var(--dim);font-variant-numeric:tabular-nums}
nav li button:hover{background:var(--navy-2);color:var(--white)}
nav li button[aria-current="true"]{background:var(--navy-3);color:var(--white);box-shadow:inset 3px 0 0 var(--gold)}
nav li button .ck{color:var(--gold);font-size:12px}
.empty{padding:16px 24px;color:var(--dim);font-size:14px}

.scrim{display:none}
main{min-width:0;grid-column:2}
.topbar{display:none}
.wrap{max-width:800px;margin:0 auto;padding:48px 32px 90px}

/* home */
.hero{border-bottom:1px solid var(--rule);padding-bottom:30px;margin-bottom:10px}
.hero h2{font-family:var(--serif);font-size:48px;font-weight:600;line-height:1.05;letter-spacing:-.01em;color:var(--navy);margin-bottom:18px;max-width:17ch}
.hero p{font-size:17.5px;max-width:62ch;margin-bottom:12px;color:#2b3446}
.hero .exchange{margin:26px 0 6px;max-width:560px}
.sec{font-family:var(--serif);font-size:30px;font-weight:600;margin:40px 0 6px;color:var(--navy)}
.sub{color:var(--muted);max-width:62ch;margin-bottom:14px}
.steps{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:18px 0 8px;border:1px solid var(--rule);border-radius:10px;background:var(--white);overflow:hidden}
.steps li{padding:16px 18px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.steps li:nth-child(3n){border-right:0}
.steps li:nth-last-child(-n+3){border-bottom:0}
.steps b{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy)}
.steps b i{font-style:normal;font-family:var(--sans);font-size:13px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center}
.steps span{display:block;font-size:14px;color:var(--muted);margin-top:4px;line-height:1.4}
.parts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:16px}
.parts-grid button{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:16px 16px 14px;cursor:pointer;position:relative;overflow:hidden}
.parts-grid button::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--part)}
.parts-grid button:hover{border-color:var(--part)}
.parts-grid .pn{font-size:13px;font-weight:700;color:var(--part)}
.parts-grid strong{font-family:var(--serif);font-size:20px;line-height:1.15;color:var(--ink)}
.parts-grid .pd{font-size:14px;color:var(--muted);line-height:1.4}
.parts-grid .pc{font-size:13px;color:var(--part);font-weight:600;margin-top:auto;padding-top:6px}
.toc{columns:2 300px;column-gap:30px;margin:14px 0 30px}
.toc section{break-inside:avoid;margin-bottom:22px}
.toc h4{font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:4px;color:var(--part);padding-bottom:5px;border-bottom:2px solid var(--part)}
.toc ol{list-style:none}
.toc button{display:grid;grid-template-columns:32px 1fr auto;width:100%;text-align:left;background:none;border:0;padding:4px 0;cursor:pointer;font-size:15px;color:var(--ink);gap:4px}
.toc button span:first-child{color:var(--part);font-variant-numeric:tabular-nums;font-weight:600}
.toc button:hover{color:var(--part)}
.toc .ck{color:var(--gold);font-size:13px}
.notice{background:var(--white);border:1px solid var(--rule);border-left:4px solid var(--gold);padding:18px 20px;margin:22px 0;border-radius:0 8px 8px 0}
.notice h3{font-size:16px;margin-bottom:6px}
.notice p{font-size:15px;color:var(--muted)}
.resetrow{font-size:14px;color:var(--muted);margin-top:8px}
.linkbtn{background:none;border:0;color:var(--part);text-decoration:underline;cursor:pointer;padding:0}

/* script page */
.plate{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start;margin-bottom:24px}
.num{width:92px;height:92px;border-radius:12px;background:var(--part);color:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.num small{font-size:11.5px;font-weight:600;opacity:.8}
.num b{font-family:var(--serif);font-size:40px;line-height:1;font-weight:600}
.partname{font-size:14px;font-weight:600;color:var(--part)}
.script h2{font-family:var(--serif);font-size:38px;font-weight:600;line-height:1.1;margin:4px 0 10px;color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{font-size:13px;border:1px solid var(--rule);background:var(--white);border-radius:999px;padding:3px 10px;color:var(--muted)}
.facts span.kind{border-color:color-mix(in srgb,var(--part) 35%,#fff);color:var(--part);background:color-mix(in srgb,var(--part) 7%,#fff);font-weight:600}

.rounds{display:grid;grid-template-columns:repeat(6,1fr);list-style:none;margin:0 0 -1px;position:relative;z-index:1}
.rounds button{width:100%;background:transparent;border:1px solid transparent;border-bottom:0;border-radius:10px 10px 0 0;padding:10px 6px 11px;cursor:pointer;font-size:13px;line-height:1.25;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.rounds button i{font-style:normal;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--white)}
.rounds button:hover{color:var(--part)}
.rounds button.done i{background:var(--part);border-color:var(--part);color:var(--white)}
.rounds button[aria-current="step"]{background:var(--white);border-color:var(--rule);color:var(--ink);font-weight:600}
.rounds button[aria-current="step"] i{border-color:var(--part);color:var(--part);background:var(--white);box-shadow:0 0 0 3px color-mix(in srgb,var(--part) 18%,#fff)}
.panel{background:var(--white);border:1px solid var(--rule);border-radius:0 0 12px 12px;padding:24px 26px 22px}
.panel h3{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.1;margin-bottom:6px;color:var(--part)}
.panel .hint{font-size:15.5px;color:var(--muted);margin-bottom:16px;max-width:64ch}

/* player */
.deck{border:1px solid var(--rule);border-radius:10px;background:#f8f9fb;padding:14px 16px;margin-bottom:14px}
.deck-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.deck-row+.deck-row{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.btn{background:var(--part);color:var(--white);border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:15px}
.btn:hover{filter:brightness(.9)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.secondary{background:var(--white);color:var(--part);border:1px solid var(--rule)}
.btn.secondary:hover{border-color:var(--part);background:color-mix(in srgb,var(--part) 6%,#fff)}
.btn.big{padding:11px 20px;min-width:128px}
.btn.gold{background:var(--navy);color:var(--gold)}
.deck label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.deck select{border:1px solid var(--rule);border-radius:6px;padding:6px 8px;background:var(--white);max-width:210px;font-size:14px}
.deck .sp{margin-left:auto}
.nowline{font-size:14px;color:var(--muted);flex:1;min-width:180px}
.nowline b{color:var(--ink)}
.track{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:10px}
.track i{display:block;height:100%;width:0;background:var(--part);transition:width .2s}
.voice-note{font-size:13px;color:var(--muted);margin:2px 0 16px}
.recording audio{width:100%;margin-bottom:6px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);cursor:pointer}
.check input{accent-color:var(--part);width:17px;height:17px}

/* transcript as a dialogue script */
.dlg{margin-top:6px;border-top:1px solid var(--rule)}
.turn{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid #eceef2}
.who{font-size:13px;font-weight:700;padding-top:4px}
.turn.P .who{color:var(--part)}
.turn.S .who{color:#4d5a70}
.turn.S .say{background:#f3f5f8;border-radius:10px;padding:8px 12px;margin-left:-12px}
.say{font-family:var(--serif);font-size:18.5px;line-height:1.7}
.seg{border-radius:4px;transition:background .15s;cursor:pointer}
.seg:hover{background:color-mix(in srgb,var(--part) 8%,transparent)}
.seg.on{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold-soft)}
.masked{border:1px dashed #b9c1ce;border-radius:10px;padding:22px 24px;color:var(--muted);font-size:15px;background:#fafbfc}
.masked .turns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.masked .turns span{font-size:12.5px;font-weight:700;border-radius:4px;padding:3px 8px;background:var(--white);border:1px solid var(--rule)}
.masked .turns span.P{color:var(--part)}
.masked .turns span.on{background:var(--gold-soft);border-color:var(--gold)}

.field{margin-top:14px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.field input{width:100%;max-width:360px;border:1px solid var(--rule);border-radius:8px;padding:9px 12px;background:var(--white)}
textarea{width:100%;min-height:210px;border:1px solid var(--rule);border-radius:10px;padding:14px 16px;background:var(--white);font-size:17px;line-height:1.6;resize:vertical}
textarea.short{min-height:100px}
textarea:focus,.field input:focus{border-color:var(--part);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--part) 15%,#fff)}
.prompts{list-style:none;margin:6px 0 4px;display:grid;gap:6px}
.prompts li{font-size:15px;padding-left:18px;position:relative}
.prompts li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.nextrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--rule)}

.result{margin-top:22px;border:1px solid var(--rule);border-radius:10px;padding:20px 22px;background:#fbfbfc}
.score{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1;color:var(--part)}
.score small{font-family:var(--sans);font-size:15px;font-weight:400;color:var(--muted);margin-left:8px}
.legend{font-size:14px;color:var(--muted);margin:12px 0}
.legend mark,.legend del{padding:0 4px}
.diff{font-size:17px;line-height:1.9;font-family:var(--serif)}
mark{background:var(--missed);color:var(--missed-ink);border-radius:3px;padding:0 2px}
mark.small{outline:2px solid #c98a1a;outline-offset:-1px}
del{color:var(--extra);text-decoration:line-through}
.smalls{margin-top:14px;font-size:15px}
.rest{color:#9aa1a8}
.sendbox{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.sendbox p{font-size:14px;color:var(--muted);margin-top:8px}
.status{font-size:14px;color:var(--part);margin-top:8px;min-height:1.2em}
.done-banner{margin-top:16px;display:flex;gap:12px;align-items:center;background:var(--gold-soft);border:1px solid #e8d49f;border-radius:10px;padding:12px 16px;font-size:15px}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:22px;border-top:1px solid var(--rule)}
.pager button{background:none;border:0;cursor:pointer;text-align:left;max-width:48%;padding:4px 0}
.pager button:last-child{text-align:right;margin-left:auto}
.pager small{display:block;font-size:13px;color:var(--muted)}
.pager span{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink)}
.pager button:hover span{color:var(--part)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  main{grid-column:1}
  aside{position:fixed;inset:0 auto 0 0;width:min(340px,88vw);z-index:30;transform:translateX(-100%);transition:transform .2s ease}
  aside.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(10,18,32,.45);z-index:20;display:none}
  .scrim.open{display:block}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;background:var(--navy);color:var(--white);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .topbar button{background:var(--navy-3);color:var(--white);border:0;border-radius:6px;padding:8px 12px;cursor:pointer}
  .topbar strong{font-family:var(--serif);font-size:19px;font-weight:600}
  .wrap{padding:26px 16px 70px}
  .hero h2{font-size:36px}
  .script h2{font-size:29px}
  .plate{grid-template-columns:1fr;gap:12px}
  .num{width:70px;height:70px}.num b{font-size:30px}
  .rounds{grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px}
  .rounds button{border:1px solid var(--rule);border-radius:8px;background:var(--white)}
  .panel{border-radius:12px;padding:18px 16px}
  .steps{grid-template-columns:1fr}
  .steps li{border-right:0!important;border-bottom:1px solid var(--rule)!important}
  .steps li:last-child{border-bottom:0!important}
  .turn{grid-template-columns:1fr;gap:2px}
  .turn.S .say{margin-left:0}
  .say{font-size:17.5px}
  .deck .sp{margin-left:0}
}
@media (prefers-reduced-motion: reduce){aside,.track i,.seg{transition:none}}
@media print{
  aside,.topbar,.deck,.voice-note,.rounds,.pager,.nextrow,.actions,textarea,.field{display:none!important}
  .shell{display:block}.panel{border:0;padding:0}
}

.setting{font-size:15px;color:var(--muted);margin:-4px 0 10px}
.setting b{color:var(--ink);font-weight:600}
.star{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);border-radius:10px;background:var(--white);overflow:hidden;margin:16px 0 10px}
.star li{padding:16px 16px 14px;border-right:1px solid var(--rule)}
.star li:last-child{border-right:0}
.star b{display:block;font-family:var(--serif);font-size:30px;line-height:1;color:var(--gold)}
.star strong{display:block;font-family:var(--serif);font-size:19px;color:var(--navy);margin-top:6px}
.star em{display:block;font-style:normal;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:2px}
.star span{display:block;font-size:14px;color:var(--muted);margin-top:6px;line-height:1.4}
.star li.act{background:var(--gold-soft)}
.pitfalls{list-style:none;display:grid;gap:10px;margin:14px 0 6px}
.pitfalls li{background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:12px 16px;font-size:15px}
.pitfalls li b{color:var(--navy)}
.formula{counter-reset:f;list-style:none;display:grid;gap:10px;margin:14px 0}
.formula li{counter-increment:f;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;font-size:15.5px}
.formula li::before{content:counter(f);width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:14px}
.coach{margin-top:18px;background:var(--gold-soft);border:1px solid #edcfb2;border-radius:10px;padding:16px 18px}
.coach h4{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy);margin-bottom:4px}
.coach p{font-size:15.5px;color:#3a3a33}
.mine{margin-top:22px;padding-top:18px;border-top:1px solid var(--rule)}
.mine h4{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--part);margin-bottom:4px}
@media (max-width:900px){.star{grid-template-columns:1fr 1fr}.star li:nth-child(2){border-right:0}.star li:nth-child(-n+2){border-bottom:1px solid var(--rule)}}
.scene{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--muted);margin:-2px 0 10px;max-width:62ch}
.listenfor{margin-top:18px;background:var(--gold-soft);border:1px solid #bfe0dc;border-radius:10px;padding:16px 18px}
.listenfor h4{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy);margin-bottom:4px}
.listenfor p{font-size:15.5px;color:#2d3a38}
.listenfor p+p{margin-top:6px}
.respond{margin-top:22px}
.respond h4{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy);margin-bottom:4px}
.rsp{border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin-top:12px;background:var(--white)}
.rsit{font-size:14.5px;color:#55615f}
.rq{font-size:17px;margin:6px 0 10px}
.rsp .field{margin-bottom:10px}
.model{margin-top:10px;background:var(--gold-soft);border-radius:8px;padding:10px 12px;font-size:16px}
.model span{display:block;font-size:13.5px;color:#55615f;margin-top:4px}
.startlist{list-style:none;display:grid;gap:8px;margin:14px 0 8px}
.startlist button{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:12px 16px;cursor:pointer;font:inherit;color:var(--ink)}
.startlist button:hover{border-color:var(--gold)}
.startlist .n{width:32px;height:32px;border-radius:8px;background:var(--gold);color:#fff;display:grid;place-items:center;font-weight:700;font-variant-numeric:lining-nums}
.startlist b{display:block;font-family:var(--serif);font-size:18px}
.startlist small{color:var(--muted);font-size:13.5px}
.startlist .lv{font-size:12.5px;font-weight:700;color:var(--gold);text-align:right}
.startlist .ck{color:var(--gold);font-weight:700}

<script>
const BOOK = [{"part": 1, "title": "First Events", "desc": "Walking in alone, joining a group, small talk, and leaving a conversation politely.", "scripts": [{"num": 1, "title": "Walking In Alone", "lines": [["P", "Hi there! Welcome, welcome. Are you here for Vancouver New Professionals?", "Dev"], ["S", "Yes, I think so. Is this the right place?", "Ana"], ["P", "It's the right place. I'm Dev. I organize this thing, so if the music's too loud, it's my fault. And you are?", "Dev"], ["S", "Ana. Ana Ribeiro.", "Ana"], ["P", "Ana. Great to meet you. First time?", "Dev"], ["S", "First time. To be honest, I almost didn't come. I was standing outside in the rain for five minutes.", "Ana"], ["P", "Ha! Everybody does that. The rain is the easy part. Walking through the door is the hard part. What do you do, Ana?", "Dev"], ["S", "I'm a project manager. In São Paulo, I managed rail and road projects. I moved here in August.", "Ana"], ["P", "Oh, nice. Infrastructure. We have a few engineers here tonight. Come on, let me introduce you to someone. Tyler! Tyler, this is Ana. She just moved here from Brazil.", "Dev"], ["P", "Hey, nice to meet you. So, are you hiring?", "Tyler"], ["S", "Sorry?", "Ana"], ["P", "Is your company hiring? I just finished my business degree, and I'm applying everywhere. Do you know anyone in HR? I can send you my resume tonight.", "Tyler"], ["S", "Oh. Actually, I'm looking for work too.", "Ana"], ["P", "Oh. Okay. Well, good luck. Hey, Dev, is the guy from the bank here yet?", "Tyler"], ["P", "He's by the window, Tyler. Gently, okay? Gently.", "Dev"], ["S", "Is it always like this?", "Ana"], ["P", "No. Most people are much nicer than that. Tyler means well. He just hasn't learned the order yet. People first, jobs later. Come on, let's get you a drink.", "Dev"]], "words": 242, "kind": "story", "scene": "October, 6:30 p.m., a brewery in Gastown. Rain outside.", "F": "Dev's last line is the lesson of the whole lab: \"People first, jobs later.\" Tyler asks for a job in his first sentence, and the other person leaves. \"Gently\" is Dev's polite warning to Tyler. \"Tyler means well\" means he has good intentions but bad behaviour.", "V": "", "t": [[2.0, 2.65], [3.0, 4.03], [4.38, 6.61], [7.21, 8.34], [8.69, 9.97], [10.57, 11.61], [11.96, 12.66], [13.01, 16.8], [17.15, 17.85], [18.45, 18.98], [19.33, 20.22], [20.82, 21.33], [21.68, 22.7], [23.05, 23.84], [24.44, 25.26], [25.61, 27.46], [27.81, 30.41], [31.01, 31.5], [31.85, 32.97], [33.32, 34.68], [35.03, 37.12], [37.47, 38.52], [39.12, 40.46], [40.81, 44.03], [44.38, 45.7], [46.3, 47.02], [47.37, 48.31], [48.66, 50.5], [50.85, 52.99], [53.34, 53.94], [54.29, 55.42], [55.77, 57.4], [58.0, 59.53], [59.88, 61.3], [61.9, 62.49], [63.09, 64.72], [65.07, 68.43], [68.78, 70.75], [71.1, 73.12], [73.72, 74.15], [74.5, 76.51], [77.11, 77.7], [78.05, 78.86], [79.21, 80.47], [80.82, 83.3], [83.9, 85.29], [85.64, 86.6], [86.95, 87.61], [88.21, 89.54], [90.14, 90.66], [91.01, 92.93], [93.28, 94.24], [94.59, 96.25], [96.6, 98.19], [98.54, 99.99]], "R": [["You arrive at a networking event, and the host greets you.", "Dev", "Hi! First time here? What do you do?", "Yes, it's my first time. I'm a project manager. I moved here from Brazil a few months ago, so I'm hoping to meet people in my field."], ["Someone you just met asks you for a job right away.", "Tyler", "So, is your company hiring?", "Actually, I'm new here too and still getting to know people. What kind of work are you interested in?"]]}, {"num": 2, "title": "Joining a Group", "lines": [["P", "...and he skated the whole length of the ice and just missed. I actually screamed.", "Grace"], ["P", "The whole building screamed. Including me, and I don't even like hockey.", "Michael"], ["S", "Sorry, mind if I join you? I don't know anyone yet, and you look like the friendliest group.", "Camila"], ["P", "Of course! Please. I'm Grace.", "Grace"], ["P", "Michael. And we're only friendly until someone mentions the Canucks.", "Michael"], ["S", "I'm Camila. I heard \"hockey,\" so I'm going to be very quiet now, because I know nothing about hockey.", "Camila"], ["P", "That's okay. Neither does Michael.", "Grace"], ["P", "That's slander. I know where the arena is.", "Michael"], ["S", "In Recife, where I'm from, it's all football. Soccer, sorry. If you say \"hockey,\" people think of field hockey.", "Camila"], ["P", "Recife. That's in the north, right?", "Grace"], ["S", "The northeast. Very hot, beautiful beaches. Very different from this weather.", "Camila"], ["P", "Everything is different from this weather. You'll get used to it. Eventually. Maybe.", "Michael"], ["P", "He's been here thirty years, and he's still not used to it.", "Grace"], ["P", "So what brings you to Vancouver?", "Michael"], ["S", "My husband got a job here, so I came too, and now I'm looking for something in marketing. I was a marketing manager for eight years, for a big retail company, and I'm really excited about the market here, because Vancouver has so many interesting brands, and...", "Camila"], ["P", "Sorry, did you say marketing? I'm in marketing too.", "Grace"], ["S", "Oh! Where?", "Camila"], ["P", "Saltwater Creative. It's an agency in Mount Pleasant.", "Grace"], ["S", "I've heard of it! You did the campaign with the ferries, right?", "Camila"], ["P", "Guilty. Okay, you've done your homework.", "Grace"]], "words": 243, "kind": "story", "scene": "Same evening, a group of three standing near the bar.", "F": "\"Mind if I join you?\" is the easiest way into a group. Camila arrives at a natural pause and makes a joke, which works well. Then she speaks very fast and very long, and Grace has to interrupt. \"That's slander\" is a joke meaning \"that's not fair.\" \"Guilty\" means \"yes, that was me.\"", "V": "", "t": [[2.0, 5.08], [5.43, 6.97], [7.57, 9.06], [9.41, 12.16], [12.76, 14.59], [14.94, 17.93], [18.53, 19.53], [19.88, 20.65], [21.0, 21.96], [22.56, 23.26], [23.61, 27.32], [27.92, 28.97], [29.32, 34.32], [34.92, 36.07], [36.42, 37.83], [38.43, 39.37], [39.72, 41.35], [41.95, 44.64], [44.99, 46.19], [46.54, 49.62], [50.22, 51.12], [51.47, 53.1], [53.7, 54.76], [55.11, 57.17], [57.52, 59.28], [59.88, 62.15], [62.5, 63.66], [64.01, 64.93], [65.28, 65.94], [66.54, 69.55], [70.15, 71.94], [72.54, 77.82], [78.17, 88.0], [88.6, 90.33], [90.68, 92.19], [92.79, 93.44], [93.79, 94.42], [95.02, 96.53], [96.88, 99.0], [99.6, 100.71], [101.06, 103.32], [103.92, 104.65], [105.0, 106.92]], "R": [["You want to join a group of three people at an event. They pause and laugh.", "Grace", "...and then he just missed. Can you believe it?", "Hi, mind if I join you? I don't know many people here yet. I'm Camila."], ["Someone mentions the place you're from.", "Grace", "Recife? Is that in the north of Brazil?", "The northeast, actually. It's very hot, with beautiful beaches. Quite different from Vancouver in October!"]]}, {"num": 3, "title": "Small Talk That Isn't About Work", "lines": [["P", "Those little samosas are dangerous. I've had four.", "Michael"], ["S", "I've had three. I was trying to be polite.", "Bruno"], ["P", "Nobody's counting. Michael, by the way.", "Michael"], ["S", "Bruno. Nice to meet you.", "Bruno"], ["P", "So, Bruno, are you from Vancouver?", "Michael"], ["S", "No, from Brazil. From Porto Alegre, in the south.", "Bruno"], ["P", "Porto Alegre. I've never been. Is that the place with the tea in the metal straw?", "Michael"], ["S", "Yes! Chimarrão. Everybody drinks it there. My mother sent me some, but I can't find the right kind of cup here.", "Bruno"], ["P", "Well, you can find anything in Vancouver if you look hard enough. Except an affordable apartment.", "Michael"], ["S", "Yes. I noticed. I am a financial analyst, and I still don't understand the rent.", "Bruno"], ["P", "Nobody does. How long have you been here?", "Michael"], ["S", "Four months. I am looking for a job in finance. I have experience in budgeting and forecasting, and I would like to...", "Bruno"], ["P", "Sure. We can talk about that. But tell me first, what do you do on weekends? Have you been up the mountains yet?", "Michael"], ["S", "Not yet. I went to Stanley Park. I walked around the seawall.", "Bruno"], ["P", "The whole thing?", "Michael"], ["S", "The whole thing. It took three hours, because I stopped to take photos every five minutes.", "Bruno"], ["P", "That's the correct way to do it. Photos are mandatory. It's in the city bylaws. Next time, try the Grouse Grind. It'll destroy you, but you'll feel great afterwards.", "Michael"], ["S", "Is it difficult?", "Bruno"], ["P", "Very. I did it once in nineteen minutes. That was a lie. It was ninety minutes.", "Michael"]], "words": 243, "kind": "story", "scene": "Same evening, the snack table.", "F": "Michael brings the conversation back to small talk twice, and it's a good sign: he's getting to know Bruno as a person first. \"Chimarrão\" is the traditional tea from southern Brazil. Listen for Michael's dry humour: \"That was a lie\" means he's joking about his own time.", "V": "", "t": [[2.0, 4.33], [4.68, 5.69], [6.29, 7.56], [7.91, 9.69], [10.29, 11.52], [11.87, 13.09], [13.69, 14.46], [14.81, 16.22], [16.82, 19.01], [19.61, 21.05], [21.4, 23.66], [24.26, 25.3], [25.65, 26.66], [27.01, 29.72], [30.32, 31.08], [31.43, 32.38], [32.73, 34.39], [34.74, 38.33], [38.93, 42.88], [43.23, 45.21], [45.81, 46.56], [46.91, 47.94], [48.29, 52.1], [52.7, 53.82], [54.17, 55.69], [56.29, 57.28], [57.63, 60.1], [60.45, 64.38], [64.98, 65.57], [65.92, 67.32], [67.67, 70.54], [70.89, 72.61], [73.21, 74.2], [74.55, 76.28], [76.63, 78.32], [78.92, 79.9], [80.5, 81.66], [82.01, 86.33], [86.93, 88.52], [88.87, 90.56], [90.91, 92.46], [92.81, 94.87], [95.22, 98.22], [98.82, 100.09], [100.69, 101.31], [101.66, 103.64], [103.99, 105.06], [105.41, 106.73]], "R": [["Someone at the snack table starts a conversation.", "Michael", "Those samosas are dangerous. I've had four already.", "Me too! I'm trying to stop at three. I'm Bruno, by the way."], ["Someone asks what you do on weekends.", "Michael", "So what do you do on weekends? Have you explored much yet?", "A little. I walked the seawall in Stanley Park last weekend. Do you have any recommendations for hikes?"]]}, {"num": 4, "title": "Forgetting a Name", "lines": [["P", "Hey, we met earlier, right? By the coat rack.", "Sarah"], ["S", "Yes! Hi again. I'm so sorry, I'm terrible with names. Can you remind me?", "Ana"], ["P", "Sarah. Don't worry, I've forgotten everyone's name tonight. You're Ana?", "Sarah"], ["S", "Ana, yes. Wow, you remembered.", "Ana"], ["P", "I'm a recruiter. Remembering names is literally my job. It's the only thing I'm good at.", "Sarah"], ["S", "A recruiter? Oh, then maybe I can ask you...", "Ana"], ["P", "Let me stop you there, nicely. I'm not hiring tonight. I come to these to meet people, not to collect resumes.", "Sarah"], ["S", "Oh, no, of course. I wasn't going to give you my resume.", "Ana"], ["P", "You were a little bit going to.", "Sarah"], ["S", "Okay, maybe a little bit.", "Ana"], ["P", "Ha! It's fine. Everyone does. So, what's your story?", "Sarah"], ["S", "I'm a project manager. Rail and road projects, mostly. In São Paulo, I managed a team of forty people on a metro extension.", "Ana"], ["P", "Forty people on a metro project? That's not small. Was it on time?", "Sarah"], ["S", "Almost. Three weeks late, which in São Paulo is basically early.", "Ana"], ["P", "Ha! Same in Toronto.", "Sarah"], ["S", "And it was a big project. Nine kilometres, six stations.", "Ana"], ["P", "See, that's interesting. Most people tell me their job title. You just told me something I'll remember. Do you have a card, or are you on LinkedIn?", "Sarah"], ["S", "LinkedIn. Should I connect with you?", "Ana"], ["P", "Sure. Put \"met at Dev's thing\" in the note, otherwise I'll forget who you are by Thursday.", "Sarah"], ["S", "I thought you never forgot names.", "Ana"], ["P", "I lied. Recruiters lie sometimes.", "Sarah"]], "words": 239, "kind": "story", "scene": "Same evening, twenty minutes later.", "F": "Forgetting a name is normal. \"Can you remind me?\" or \"Remind me your name?\" is polite and common. Sarah says \"Let me stop you there, nicely\" to prevent a job request. She notices Ana because Ana gives numbers: forty people, nine kilometres, six stations.", "V": "", "t": [[2.0, 3.9], [4.25, 5.63], [6.23, 6.78], [7.13, 7.86], [8.21, 10.54], [10.89, 11.9], [12.5, 13.32], [13.67, 16.69], [17.04, 18.06], [18.66, 19.59], [19.94, 21.09], [21.69, 22.96], [23.31, 26.06], [26.41, 28.39], [28.99, 29.76], [30.11, 31.81], [32.41, 34.27], [34.62, 36.35], [36.7, 40.22], [40.82, 41.94], [42.29, 44.23], [44.83, 46.54], [47.14, 48.65], [49.25, 49.98], [50.33, 51.43], [51.78, 52.93], [53.28, 54.81], [55.41, 56.75], [57.1, 59.04], [59.39, 63.78], [64.38, 66.88], [67.23, 68.55], [68.9, 70.35], [70.95, 71.63], [71.98, 75.26], [75.86, 76.59], [76.94, 78.48], [79.08, 80.54], [80.89, 82.89], [83.49, 85.13], [85.48, 87.66], [88.01, 90.4], [90.75, 93.12], [93.72, 94.46], [94.81, 96.0], [96.6, 97.32], [97.67, 102.12], [102.72, 104.35], [104.95, 105.96], [106.31, 108.41]], "R": [["You see someone you met earlier, but you've forgotten their name.", "Sarah", "Hey, we met earlier, right?", "Yes, hi again! I'm sorry, I'm terrible with names. Can you remind me?"], ["Someone asks what you do.", "Sarah", "So what's your story?", "I'm a project manager. In São Paulo, I led a team of forty people on a nine-kilometre metro extension."]]}, {"num": 5, "title": "Too Loud to Hear", "lines": [["P", "...so we moved everything to the new stack last spring, and honestly it's been...", "Owen"], ["S", "Sorry, I missed that. It's really loud in here.", "Thiago"], ["P", "I said we moved everything to the new stack. The new system. Last spring.", "Owen"], ["S", "Ah, okay. And it's been good?", "Thiago"], ["P", "It's been chaos. Good chaos. What about you? What do you do?", "Owen"], ["S", "I'm a software developer. Mostly back-end. I'm Thiago.", "Thiago"], ["P", "Sorry, Tee-ah-go?", "Owen"], ["S", "Close! It's Thiago. Chee-AH-goo. But honestly, any version is fine.", "Thiago"], ["P", "Chee-AH-goo. Got it. I'm Owen. Where are you from?", "Owen"], ["S", "Florianópolis, in the south of Brazil.", "Thiago"], ["P", "Flori... can you say that one more time?", "Owen"], ["S", "Florianópolis. People in Brazil just call it Floripa. It's an island.", "Thiago"], ["P", "An island with developers. That sounds like a nice place to write code.", "Owen"], ["S", "It is. There are a lot of tech companies there. People call it the Silicon Island.", "Thiago"], ["P", "No way. Hey, do you want to step outside for a minute? I can't hear anything in here.", "Owen"], ["S", "Yes, please. My ears are tired.", "Thiago"], ["P", "Okay, that's better. So, what brought you all the way from an island in Brazil to the rain?", "Owen"], ["S", "My company in Floripa closed its office. I had always wanted to try Canada, so I said, now or never.", "Thiago"], ["P", "Now or never. I respect that. Are you looking at bigger companies or startups?", "Owen"], ["S", "Both. I like small teams, but I'm open.", "Thiago"], ["P", "Our team is twelve people. It's small, but nobody ever gets bored.", "Owen"], ["S", "That sounds like my last job. Can I ask what language you mostly use?", "Thiago"]], "words": 248, "kind": "story", "scene": "Early November, a crowded tech meetup in Mount Pleasant.", "F": "\"Sorry, I missed that\" and \"Can you say that one more time?\" are normal at loud events. Owen mispronounces Thiago's name, and Thiago corrects him in a friendly way, then says \"any version is fine.\" Suggesting \"Do you want to step outside for a minute?\" is a smart way to move a good conversation somewhere quieter.", "V": "", "t": [[2.0, 6.09], [6.69, 7.73], [8.08, 9.23], [9.83, 12.44], [12.79, 14.01], [14.36, 15.62], [16.22, 16.96], [17.31, 18.24], [18.84, 20.21], [20.56, 21.78], [22.13, 23.34], [23.69, 24.77], [25.37, 26.61], [26.96, 28.05], [28.4, 29.24], [29.84, 31.42], [32.02, 32.61], [32.96, 33.82], [34.17, 35.11], [35.46, 37.18], [37.78, 39.06], [39.41, 40.19], [40.54, 41.65], [42.0, 43.33], [43.93, 45.85], [46.45, 47.24], [47.59, 49.58], [50.18, 51.15], [51.5, 53.51], [53.86, 54.69], [55.29, 57.26], [57.61, 60.26], [60.86, 61.47], [61.82, 63.52], [63.87, 65.65], [66.25, 67.09], [67.44, 69.83], [70.18, 71.96], [72.56, 73.39], [73.74, 74.77], [75.37, 76.96], [77.31, 81.28], [81.88, 84.13], [84.48, 87.8], [88.4, 89.78], [90.13, 91.48], [91.83, 94.69], [95.29, 95.83], [96.18, 97.88], [98.48, 100.33], [100.68, 103.18], [103.78, 105.37], [105.72, 107.74]], "R": [["The room is loud, and you didn't hear what someone said.", "Owen", "...so we moved everything to the new stack last spring.", "Sorry, I missed that. It's really loud in here. Could you say it again?"], ["Someone mispronounces your name.", "Owen", "Sorry, was that Tee-ah-go?", "Close! It's Thiago. But don't worry, any version is fine."]]}, {"num": 6, "title": "The Exit", "lines": [["P", "...and then I told them, look, I have a business degree, I know Excel, I'm ready. And they still said no. Can you believe that?", "Tyler"], ["S", "That's frustrating. What kind of roles are you applying for?", "Camila"], ["P", "Everything. Sales, marketing, operations, banking. I'm flexible.", "Tyler"], ["S", "Maybe that's part of the problem? When I hire people, I look for someone who wants that specific job.", "Camila"], ["P", "Huh. I never thought about it like that. Anyway, I've applied to a hundred and twelve jobs. I have a spreadsheet. Do you want to see the spreadsheet?", "Tyler"], ["S", "Maybe another time. You've been really busy.", "Camila"], ["P", "Super busy. So, what does your husband do? Does his company have any openings?", "Tyler"], ["S", "He's an engineer. I don't think they're hiring right now.", "Camila"], ["P", "Could you ask him, though? Like, tonight?", "Tyler"], ["S", "Tyler, I'm going to be honest. I don't like asking him for things like that. But I hope your search goes well.", "Camila"], ["P", "Oh. Okay. No worries.", "Tyler"], ["S", "Listen, I'm going to grab a glass of water and say hi to Grace before she leaves. It was really nice to meet you.", "Camila"], ["P", "Wait, can I add you on LinkedIn?", "Tyler"], ["S", "Sure. Send me a request.", "Camila"], ["P", "Should I write anything in the message?", "Tyler"], ["S", "Maybe write something about our conversation, so I remember. Like, \"We talked about job searching at Dev's meetup.\"", "Camila"], ["P", "Smart. Hey, that's actually good advice.", "Tyler"], ["S", "Good luck, Tyler. Really.", "Camila"], ["P", "Thanks. Hey, you're nice. Most people just walk away.", "Tyler"], ["S", "Most people are tired. See you next month.", "Camila"]], "words": 241, "kind": "story", "scene": "Back at the October meetup, near the coat rack.", "F": "Camila leaves the conversation politely, in three steps: a reason (\"I'm going to grab a glass of water\"), a warm close (\"It was really nice to meet you\"), and a good wish (\"Good luck\"). She also says no to Tyler's request clearly but kindly: \"I'm going to be honest.\"", "V": "", "t": [[2.0, 5.81], [6.16, 7.74], [8.09, 9.45], [10.05, 11.38], [11.73, 13.87], [14.47, 15.37], [15.72, 18.2], [18.55, 19.64], [20.24, 22.0], [22.35, 26.18], [26.78, 27.4], [27.75, 29.59], [29.94, 32.81], [33.16, 34.63], [34.98, 36.63], [37.23, 38.66], [39.01, 40.43], [41.03, 42.12], [42.47, 44.1], [44.45, 46.45], [47.05, 48.35], [48.7, 50.74], [51.34, 52.8], [53.15, 54.24], [54.84, 56.83], [57.18, 59.47], [59.82, 61.66], [62.26, 62.85], [63.2, 64.01], [64.36, 65.53], [66.13, 70.83], [71.18, 72.99], [73.59, 75.55], [76.15, 76.74], [77.09, 78.42], [79.02, 81.05], [81.65, 84.95], [85.3, 88.17], [88.77, 89.43], [89.78, 91.8], [92.4, 93.7], [94.05, 94.8], [95.4, 96.05], [96.4, 97.67], [98.02, 99.9], [100.5, 102.08], [102.43, 103.65]], "R": [["Someone has been talking to you for a long time, and you want to leave politely.", "Tyler", "...and I have a spreadsheet of all my applications. Do you want to see it?", "Maybe another time! I'm going to grab some water and say hi to a friend. It was really nice talking to you."], ["Someone asks you for a favour you're not comfortable with.", "Tyler", "Could you ask your husband if his company is hiring?", "I'd rather not, to be honest. But I hope your search goes well."]]}, {"num": 7, "title": "What They Said Afterwards", "lines": [["S", "Okay, honest opinions. Who did you meet tonight?", "Dev"], ["P", "Fewer people than you. You talked to everyone. Twice.", "Michael"], ["S", "It's my job. Come on, tell me.", "Dev"], ["P", "Well, Tyler cornered me for fifteen minutes.", "Michael"], ["S", "Ah. Tyler.", "Dev"], ["P", "He asked me for a referral before he told me his last name. I like his energy, but I'd never recommend him to anyone right now.", "Michael"], ["S", "I'll talk to him. He's twenty-two. He'll learn.", "Dev"], ["P", "I hope so. I was terrible at twenty-two too, just quieter about it.", "Michael"], ["S", "Who else?", "Dev"], ["P", "The Brazilian project manager. Ana. She was stiff at first, very formal, but then she told me about a metro project. Six stations, nearly on time.", "Michael"], ["S", "Did she ask you for anything?", "Dev"], ["P", "No. That's the interesting part. She asked me how project management works on public projects here. Good question, actually.", "Michael"], ["S", "And Camila? The marketing one?", "Dev"], ["P", "Lovely. Talks at the speed of light. I understood about seventy percent.", "Michael"], ["S", "Did you tell her to slow down?", "Dev"], ["P", "After ten minutes? Of course not. You don't say that to someone you just met. Maybe at coffee number three.", "Michael"], ["S", "Ha! She was nervous.", "Dev"], ["P", "I know. I was nervous at my first one too. I spilled a drink on a vice-president.", "Michael"], ["S", "You never told me that.", "Dev"], ["P", "I've never told anyone. Keep stacking.", "Michael"], ["S", "So would you meet any of them again? For coffee?", "Dev"], ["P", "Ana, yes. She'll be fine here. Bruno too, the quiet one with the samosas.", "Michael"], ["S", "You'd meet Bruno? He barely said anything.", "Dev"], ["P", "He listened. You'd be surprised how rare that is.", "Michael"]], "words": 249, "kind": "story", "scene": "Later that night. The meetup is over, and Dev and Michael are stacking chairs.", "F": "This is what people really say after an event. Michael would meet Ana again because she asked a good question instead of asking for help. He'd never recommend Tyler \"right now,\" which means not yet, but maybe later. \"Talks at the speed of light\" means very fast. Michael values Bruno because \"he listened.\"", "V": "", "t": [[2.0, 3.43], [3.78, 4.94], [5.54, 6.88], [7.23, 8.52], [8.87, 9.5], [10.1, 11.04], [11.39, 12.35], [12.95, 15.5], [16.1, 16.59], [16.94, 17.53], [18.13, 21.97], [22.32, 26.69], [27.29, 28.29], [28.64, 29.68], [30.03, 30.74], [31.34, 32.26], [32.61, 36.16], [36.76, 37.39], [37.99, 40.0], [40.35, 40.93], [41.28, 46.78], [47.13, 49.23], [49.83, 51.17], [51.77, 52.35], [52.7, 54.25], [54.6, 58.95], [59.3, 60.81], [61.41, 62.18], [62.53, 63.51], [64.11, 64.81], [65.16, 66.62], [66.97, 69.02], [69.62, 71.04], [71.64, 72.84], [73.19, 74.22], [74.57, 76.78], [77.13, 78.84], [79.44, 79.93], [80.28, 81.15], [81.75, 82.47], [82.82, 85.18], [85.53, 87.69], [88.29, 89.48], [90.08, 91.61], [91.96, 92.97], [93.57, 95.11], [95.46, 96.25], [96.85, 97.74], [98.09, 99.3], [99.65, 102.5], [103.1, 104.13], [104.48, 105.68], [106.28, 107.15], [107.5, 109.55]], "R": [["A friend asks how the event went for you.", "Dev", "So, honest opinion. Who did you meet tonight?", "I met a project director, Michael. He was really funny, and he gave me a great hiking tip."], ["A new friend tells you they were nervous at their first event too.", "Michael", "I spilled a drink on a vice-president at my first one.", "No way! That makes me feel much better about forgetting someone's name tonight."]]}, {"num": 8, "title": "The Morning After", "lines": [["P", "Okay, so we practise in English, right? That was the rule.", "Bruno"], ["S", "That was the rule. Even if it's painful.", "Ana"], ["P", "Okay. So, how was your night? In English.", "Bruno"], ["S", "Honestly? Good, but I said some stupid things.", "Ana"], ["P", "Like what?", "Bruno"], ["S", "I forgot a recruiter's name ten minutes after I met her.", "Ana"], ["P", "And?", "Bruno"], ["S", "And she was fine. She laughed. She said she forgets names too, but I think she was lying to make me feel better.", "Ana"], ["P", "That's nice of her. I didn't talk to any recruiters. I talked to one person, Michael, about samosas and hiking.", "Bruno"], ["S", "Michael with the glasses? Grey hair?", "Ana"], ["P", "Yes. He told me to do the Grouse Grind. I looked it up. It's basically a staircase up a mountain.", "Bruno"], ["S", "He gave me his card. He said, \"Call me if you want to talk about public projects here.\"", "Ana"], ["P", "He gave you his card? He didn't give me his card.", "Bruno"], ["S", "You talked about samosas.", "Ana"], ["P", "Yes, but very professionally. Samosas and the seawall. And chimarrão. I think I talked about my mother's tea for five minutes.", "Bruno"], ["S", "Bruno.", "Ana"], ["P", "I know.", "Bruno"], ["S", "So, what do we do now? Do I just call him?", "Ana"], ["P", "Maybe send an email first. Short. Say thank you, remind him what you talked about.", "Bruno"], ["S", "Like what we learned in that workshop. Three sentences.", "Ana"], ["P", "Three sentences. And I'll go back next month. This time, I'll talk to at least three people.", "Bruno"], ["S", "Three people, and no samosa conversations.", "Ana"], ["P", "I can't promise that.", "Bruno"]], "words": 237, "kind": "story", "scene": "Saturday morning, a café on Main Street.", "F": "Two Brazilians practise in English on purpose, which is a great habit. Listen for the plans they make: a short thank-you email (three sentences) and talking to three people next time. Bruno doesn't realize yet that his samosa conversation with Michael was a success. Script 7 told us so.", "V": "", "t": [[2.0, 4.48], [4.83, 6.21], [6.81, 7.71], [8.06, 9.28], [9.88, 10.8], [11.15, 12.74], [13.09, 14.08], [14.68, 15.37], [15.72, 17.69], [18.29, 19.26], [19.86, 22.78], [23.38, 24.03], [24.63, 25.64], [25.99, 26.71], [27.06, 31.12], [31.72, 33.13], [33.48, 35.44], [35.79, 39.58], [40.18, 41.61], [41.96, 42.69], [43.29, 44.04], [44.39, 46.6], [46.95, 48.16], [48.51, 51.24], [51.84, 53.03], [53.38, 56.68], [57.28, 58.89], [59.24, 60.97], [61.57, 63.03], [63.63, 65.56], [65.91, 67.81], [68.16, 69.5], [69.85, 73.14], [73.74, 74.31], [74.91, 75.73], [76.33, 77.61], [77.96, 79.04], [79.64, 81.73], [82.08, 82.75], [83.1, 85.88], [86.48, 88.16], [88.51, 89.56], [90.16, 91.53], [91.88, 93.72], [94.07, 96.61], [97.21, 99.86], [100.46, 102.06]], "R": [["A friend asks how your first networking event went.", "Bruno", "So, how was your night?", "Good, but I was nervous. I forgot someone's name, but she was really nice about it."], ["A friend asks what you'll do differently next time.", "Bruno", "So what's your plan for next month?", "I want to talk to at least three people, and follow up with anyone I connect with."]]}]}, {"part": 2, "title": "Introducing Yourself", "desc": "The thirty-second introduction, results not job titles, and explaining your background.", "scripts": [{"num": 9, "title": "Explaining Your Job to an Auntie", "lines": [["P", "Ana! You made it. Mom, this is Ana, my friend from the meetups.", "Dev"], ["P", "Welcome, welcome. Happy Diwali. Have you eaten? You look like you haven't eaten.", "Mrs. Sharma"], ["S", "Happy Diwali. Thank you for having me. I ate a little before I came.", "Ana"], ["P", "A little is not enough. Dev, get her a plate. So, Ana, Dev says you're a project manager. What does that mean, exactly? Dev's cousin is a project manager, and I still don't know what he does.", "Mrs. Sharma"], ["S", "Ha! Most people don't. Okay, let me try. Do you know the new SkyTrain line they're building?", "Ana"], ["P", "The one that makes my drive to the temple twenty minutes longer? Yes.", "Mrs. Sharma"], ["S", "Yes, that kind of project. Hundreds of people work on it. Engineers, builders, suppliers. My job is to make sure everyone does the right thing at the right time, and that the money doesn't disappear.", "Ana"], ["P", "So you're the person who tells everyone what to do.", "Mrs. Sharma"], ["P", "Mom, that's not exactly...", "Dev"], ["P", "Let her answer, Dev.", "Mrs. Sharma"], ["S", "More or less. But politely.", "Ana"], ["P", "Like a mother.", "Mrs. Sharma"], ["S", "Exactly like a mother. With a very big spreadsheet.", "Ana"], ["P", "She managed a metro project in São Paulo, Mom. Nine kilometres.", "Dev"], ["P", "São Paulo. That's a big city, no?", "Mrs. Sharma"], ["S", "Very big. About twenty million people in the metropolitan area.", "Ana"], ["P", "Twenty million! And you came here, to the rain.", "Mrs. Sharma"], ["S", "For the rain, and for the samosas.", "Ana"], ["P", "Then you're in the right house. Dev! Bring more samosas.", "Mrs. Sharma"]], "words": 231, "kind": "story", "scene": "November, Diwali at Dev's family home in Surrey.", "F": "Explaining your job to someone outside your field is a real networking skill, because family and friends often connect you to opportunities. Ana uses an example everyone knows (the SkyTrain) and a simple comparison (\"like a mother, with a very big spreadsheet\"). \"Have you eaten?\" is a warm welcome, not a real question.", "V": "", "t": [[2.0, 2.53], [2.88, 3.62], [3.97, 6.25], [6.85, 8.28], [8.63, 9.98], [10.33, 11.59], [11.94, 13.65], [14.25, 15.2], [15.55, 16.91], [17.26, 18.85], [19.45, 21.08], [21.43, 23.04], [23.39, 26.21], [26.56, 28.37], [28.72, 32.82], [33.42, 33.91], [34.26, 35.44], [35.79, 37.06], [37.41, 39.76], [40.36, 43.71], [44.06, 44.88], [45.48, 47.1], [47.45, 49.01], [49.36, 51.31], [51.66, 57.38], [57.98, 60.91], [61.51, 62.93], [63.53, 65.18], [65.78, 66.64], [66.99, 67.86], [68.46, 69.43], [70.03, 71.29], [71.64, 73.1], [73.7, 76.61], [76.96, 78.0], [78.6, 79.8], [80.15, 81.74], [82.34, 83.12], [83.47, 86.66], [87.26, 88.33], [88.68, 90.61], [91.21, 93.19], [93.79, 95.56], [95.91, 96.7], [97.05, 98.63]], "R": [["Someone outside your field asks what your job really means.", "Mrs. Sharma", "Project manager? What does that mean, exactly?", "Do you know the new SkyTrain line? On projects like that, my job is to make sure everyone does the right thing at the right time."], ["You're welcomed into someone's home for a celebration.", "Mrs. Sharma", "Welcome! Happy Diwali. Have you eaten?", "Happy Diwali, and thank you for having me! I ate a little, but everything smells wonderful."]]}, {"num": 10, "title": "Take One: The Long Version", "lines": [["P", "Morning. Is this seat taken?", "Hannah"], ["S", "No, please. Good morning.", "Bruno"], ["P", "Thanks. I'm Hannah. I'm at Cascadia Credit Union.", "Hannah"], ["S", "Nice to meet you. I'm Bruno.", "Bruno"], ["P", "So, Bruno, what do you do?", "Hannah"], ["S", "Well, I started my career in two thousand twelve at a small accounting firm in Porto Alegre, where I worked in accounts payable for two years. Then I moved to a bank, where I was in the credit department, mostly working with small business loans, and after that, in two thousand sixteen, I joined a manufacturing company, where I started in cost accounting, and later I moved to the financial planning team, and there I worked with budgets, and also forecasting, and I also helped with some systems implementation, an ERP project, which took about a year and a half, and...", "Bruno"], ["P", "Mm-hmm.", "Hannah"], ["S", "...and after that I was promoted to senior analyst, and I was responsible for the monthly reports to the directors, and also some special projects, for example, when the company bought another company, I helped with the analysis, and then in two thousand twenty-three...", "Bruno"], ["P", "Wow, that's a lot of experience. Sorry, I just saw my colleague come in. I promised I'd save her a seat. Excuse me for a second?", "Hannah"], ["S", "Of course. Please.", "Bruno"], ["P", "Thanks. Enjoy the breakfast. The muffins are actually good here.", "Hannah"], ["S", "Thank you. I will try one.", "Bruno"], ["P", "It was nice meeting you, Bruno.", "Hannah"], ["S", "You too.", "Bruno"], ["P", "Good luck with everything.", "Hannah"]], "words": 232, "kind": "story", "scene": "January, a Finance Forum BC breakfast at a hotel downtown.", "F": "Bruno tells his whole history in order, and Hannah leaves politely. Listen for her signals: \"Mm-hmm\" means she's waiting for him to finish, \"Wow, that's a lot of experience\" is polite but not interested, and \"Good luck with everything\" usually means the conversation is over. Script 11 shows the same situation done well.", "V": "", "t": [[2.0, 2.65], [3.0, 4.15], [4.75, 6.04], [6.39, 7.45], [8.05, 8.6], [8.95, 9.61], [9.96, 11.62], [12.22, 13.63], [13.98, 15.07], [15.67, 17.08], [17.68, 25.62], [25.97, 46.93], [47.53, 48.24], [48.84, 63.14], [63.74, 65.44], [65.79, 67.88], [68.23, 69.93], [70.28, 71.66], [72.26, 73.29], [73.64, 74.4], [75.0, 75.55], [75.9, 77.05], [77.4, 79.12], [79.72, 80.58], [80.93, 82.28], [82.88, 84.56], [85.16, 86.14], [86.74, 87.97]], "R": [["Someone at a breakfast event asks what you do.", "Hannah", "So, what do you do?", "I'm a financial analyst. In Brazil, I led budgeting and forecasting for a manufacturing company. Now I'm looking for my first role in Vancouver."], ["Someone says they need to go and meet a colleague.", "Hannah", "Sorry, I just saw my colleague. Excuse me for a second?", "Of course! It was great to meet you, Hannah."]]}, {"num": 11, "title": "Take Two: Thirty Seconds", "lines": [["S", "Hannah? Hi. We met at the January breakfast. Bruno.", "Bruno"], ["P", "Bruno, yes! The guy with the long career.", "Hannah"], ["S", "Yes. That was me. I'm sorry about that. I think I told you my entire life.", "Bruno"], ["P", "Ha! You were thorough. It's fine.", "Hannah"], ["S", "Let me try again. The short version.", "Bruno"], ["P", "Go for it.", "Hannah"], ["S", "I'm a financial analyst. In Brazil, I ran budgeting and forecasting for a manufacturing company with about two thousand employees. My forecasts were usually within two percent. Now I'm learning how finance works in Canadian organizations, especially credit unions.", "Bruno"], ["P", "Okay. That's much better. Within two percent? That's impressive.", "Hannah"], ["S", "Thank you. It took a lot of practice. And a lot of coffee.", "Bruno"], ["P", "Why credit unions, though? Most people want the big banks.", "Hannah"], ["S", "Honestly, because I read about how they work here. They're owned by the members. In Brazil, we have something similar, called cooperativas de crédito, and I worked with a few of them.", "Bruno"], ["P", "Oh, interesting. I didn't know that existed in Brazil.", "Hannah"], ["S", "In the south, they're very big. Especially near Porto Alegre.", "Bruno"], ["P", "Huh. We actually have a few people at Cascadia who'd find that interesting. Okay, Bruno, I have to run in about two minutes, but here's my card. If you want to grab a coffee sometime, send me an email. I'll tell you what our finance team actually does all day.", "Hannah"], ["S", "I'd really like that. Thank you.", "Bruno"], ["P", "And keep the email as short as that introduction.", "Hannah"], ["S", "Three sentences. I promise.", "Bruno"]], "words": 240, "kind": "story", "scene": "February, the next Finance Forum BC breakfast.", "F": "Bruno's thirty-second introduction has three parts: what he does, one result with a number (\"within two percent\"), and what he's interested in now. That makes Hannah ask questions. \"Go for it\" means \"please do.\" \"I have to run\" means \"I need to leave soon.\" This time she gives him her card.", "V": "", "t": [[2.0, 2.7], [3.05, 3.76], [4.11, 6.33], [6.68, 7.45], [8.05, 8.9], [9.25, 10.58], [11.18, 11.93], [12.28, 13.51], [13.86, 15.46], [15.81, 18.17], [18.77, 19.23], [19.58, 20.41], [20.76, 21.46], [22.06, 23.44], [23.79, 25.09], [25.69, 26.48], [27.08, 29.01], [29.36, 35.77], [36.12, 38.97], [39.32, 44.93], [45.53, 46.17], [46.52, 47.52], [47.87, 48.98], [49.33, 50.37], [50.97, 51.83], [52.18, 53.87], [54.22, 55.71], [56.31, 57.71], [58.06, 59.76], [60.36, 63.2], [63.55, 65.3], [65.65, 71.34], [71.94, 72.88], [73.23, 75.28], [75.88, 77.81], [78.16, 80.34], [80.94, 81.39], [81.74, 85.59], [85.94, 90.03], [90.38, 93.42], [93.77, 96.92], [97.52, 99.05], [99.4, 100.26], [100.86, 103.37], [103.97, 105.34], [105.69, 106.81]], "R": [["You meet someone again after a bad first conversation.", "Hannah", "Bruno, yes! The guy with the long career.", "Yes, that was me! Can I try again with the short version?"], ["Someone asks why you're interested in their type of organization.", "Hannah", "Why credit unions? Most people want the big banks.", "Because they're member-owned. We have something similar in Brazil, and I worked with a few of them."]]}, {"num": 12, "title": "Practise on Your Friends", "lines": [["S", "Okay, everybody. Thirty seconds each. Camila, you start.", "Ana"], ["P", "Why me?", "Camila"], ["S", "Because you talk the fastest, so you'll finish first.", "Ana"], ["P", "Very funny. Okay. Hi, I'm Camila. I'm a marketing manager, and in Recife I...", "Camila"], ["P", "Slower.", "Bruno"], ["P", "I haven't even said anything yet!", "Camila"], ["P", "You were already fast.", "Bruno"], ["P", "Fine. Hi. I'm Camila. I'm a marketing manager. In Recife, I led a campaign for a pharmacy chain that increased online sales by forty percent in one year. Now I'm looking for a role in brand marketing here in Vancouver.", "Camila"], ["S", "That was perfect. Twenty seconds.", "Ana"], ["P", "Really?", "Camila"], ["S", "Really. Juliana, your turn.", "Ana"], ["P", "Oh, gente. Okay. Hi, I'm Juliana. I'm a nurse. Well, I'm not a nurse yet. I mean, I am a nurse, but not in Canada. I'm still waiting for my licence, so right now I'm not really anything.", "Juliana"], ["P", "No, no, no.", "Bruno"], ["P", "What?", "Juliana"], ["P", "You just said you're \"not really anything.\"", "Bruno"], ["P", "Because it's true!", "Juliana"], ["S", "It's not true. You worked in an emergency department in Salvador for nine years. Say that.", "Ana"], ["P", "Okay. Hi, I'm Juliana. I'm a registered nurse. I worked in emergency care in Salvador for nine years, and I'm completing my Canadian licensing process now.", "Juliana"], ["P", "Juliana! That was amazing.", "Camila"], ["P", "It sounded like someone else.", "Juliana"], ["S", "It sounded like you. You just weren't apologizing.", "Ana"], ["P", "Ana, now you. You're the boss of this exercise.", "Bruno"], ["S", "Okay. I'm Ana. I'm a project manager. In São Paulo, I led a team of forty people on a nine-kilometre metro extension. Now I'm focusing on transit projects here.", "Ana"], ["P", "Show-off.", "Camila"]], "words": 244, "kind": "story", "scene": "February, Ana's apartment, Sunday afternoon.", "F": "\"Gente\" is Portuguese for \"folks\" or \"guys.\" Juliana's first introduction is full of apologies: \"not a nurse yet,\" \"I mean,\" \"not really anything.\" Her second version states the facts confidently. Listen for the phrase \"I'm completing my Canadian licensing process\": it explains her situation without sounding negative.", "V": "", "t": [[2.0, 3.25], [3.6, 4.73], [5.08, 6.27], [6.87, 7.63], [8.23, 10.82], [11.42, 12.44], [12.79, 13.65], [14.0, 15.5], [15.85, 18.53], [19.13, 19.92], [20.52, 22.56], [23.16, 24.67], [25.27, 26.05], [26.4, 27.09], [27.44, 28.49], [28.84, 30.48], [30.83, 37.7], [38.05, 41.81], [42.41, 43.44], [43.79, 44.68], [45.28, 46.03], [46.63, 47.21], [47.56, 48.84], [49.44, 50.17], [50.52, 51.16], [51.51, 52.57], [52.92, 53.71], [54.06, 55.37], [55.72, 57.93], [58.28, 62.42], [63.02, 64.48], [65.08, 65.59], [66.19, 68.53], [69.13, 70.17], [70.77, 71.67], [72.02, 75.87], [76.22, 76.91], [77.51, 78.15], [78.5, 79.56], [79.91, 81.21], [81.56, 88.92], [89.52, 90.43], [90.78, 92.07], [92.67, 94.11], [94.71, 95.83], [96.18, 97.79], [98.39, 99.73], [100.08, 102.32], [102.92, 103.52], [103.87, 104.55], [104.9, 106.24], [106.59, 111.7], [112.05, 114.54], [115.14, 115.84]], "R": [["You're asked to introduce yourself, but you're not working in your field yet.", "Ana", "Your turn. Thirty seconds.", "I'm a registered nurse. I worked in emergency care for nine years, and I'm completing my Canadian licensing process now."], ["A friend tells you that you introduced yourself really well.", "Camila", "That was amazing!", "Thank you! It felt strange to say it so confidently, but I think I'll keep practising it."]]}, {"num": 13, "title": "They've Never Heard of My Company", "lines": [["P", "Camila! You came. How's the job search going?", "Grace"], ["S", "Slowly. But I'm learning a lot. Thank you for inviting me.", "Camila"], ["P", "Of course. Come meet my colleague. Josh, this is Camila. She ran marketing for a big retailer in Brazil.", "Grace"], ["P", "Hey, nice to meet you. Which company?", "Josh"], ["S", "Farmácias Nordeste. It's a pharmacy chain.", "Camila"], ["P", "Sorry, I don't know it.", "Josh"], ["S", "No, of course not. Nobody here knows it. It's like... imagine Shoppers Drug Mart, but in the northeast of Brazil.", "Camila"], ["P", "Oh, okay. So, pretty big?", "Josh"], ["S", "Nine hundred stores. And about thirty million customers in our loyalty program.", "Camila"], ["P", "Thirty million? That's almost the whole population of Canada.", "Josh"], ["S", "Yes. I said the same thing when I first arrived here. I looked at the population and I thought, wait, that's my customer database.", "Camila"], ["P", "Ha! That's a great line. You should use that.", "Josh"], ["P", "She just did.", "Grace"], ["S", "I've used it four times this week. It works every time.", "Camila"], ["P", "So what did you actually do there?", "Josh"], ["S", "I managed the loyalty program and the digital campaigns. My team was eleven people.", "Camila"], ["P", "That's interesting, because we just started working with a grocery client on their loyalty app. It's a mess, honestly.", "Josh"], ["S", "Loyalty apps are always a mess at the start. Can I ask what the problem is?", "Camila"], ["P", "People download it, use it once, and forget it.", "Josh"], ["S", "That was exactly our problem in two thousand nineteen.", "Camila"], ["P", "Okay, now I need to hear how you fixed it.", "Josh"]], "words": 233, "kind": "story", "scene": "March, an open house at Saltwater Creative in Mount Pleasant.", "F": "When people don't know your company, compare it to something they know (\"imagine Shoppers Drug Mart\") and give a number. Camila's joke about thirty million customers makes her memorable. When Josh mentions a problem, she asks a question instead of selling herself, and he becomes interested.", "V": "", "t": [[2.0, 2.85], [3.2, 4.14], [4.49, 6.4], [7.0, 7.82], [8.17, 9.66], [10.01, 11.72], [12.32, 13.32], [13.67, 15.19], [15.54, 17.23], [17.58, 20.48], [21.08, 22.52], [22.87, 23.82], [24.42, 26.09], [26.44, 27.98], [28.58, 29.91], [30.51, 31.9], [32.25, 33.78], [34.13, 34.97], [35.32, 38.95], [39.55, 40.46], [40.81, 42.04], [42.64, 44.06], [44.41, 47.73], [48.33, 49.29], [49.64, 52.06], [52.66, 53.36], [53.71, 56.3], [56.65, 61.26], [61.86, 62.35], [62.7, 63.98], [64.33, 65.45], [66.05, 67.18], [67.78, 69.77], [70.12, 71.63], [72.23, 74.1], [74.7, 78.23], [78.58, 80.4], [81.0, 85.45], [85.8, 87.25], [87.85, 90.43], [90.78, 92.75], [93.35, 95.77], [96.37, 99.54], [100.14, 102.46]], "R": [["Someone hasn't heard of the company you worked for.", "Josh", "Sorry, I don't know that company.", "That's okay! It's like Shoppers Drug Mart, but in the northeast of Brazil. Nine hundred stores."], ["Someone mentions a problem at work.", "Josh", "Our client's loyalty app is a mess, honestly.", "We had the same problem in Brazil. Can I ask what's going wrong?"]]}, {"num": 14, "title": "Not a Nurse Yet", "lines": [["S", "Hi. Is this the booth for the emergency department?", "Juliana"], ["P", "It is. I'm Karen, I'm a nurse manager. Are you a nurse?", "Karen"], ["S", "I'm a registered nurse in Brazil. I worked in emergency care in Salvador for nine years. I'm completing my Canadian licensing process now.", "Juliana"], ["P", "Okay, good. Where are you in the process?", "Karen"], ["S", "I've finished the credential assessment, and I'm writing the exam in May.", "Juliana"], ["P", "Oh, the big one. Are you studying?", "Karen"], ["S", "Every night. My husband says I talk about cardiology in my sleep.", "Juliana"], ["P", "Ha! That's a good sign. What kind of emergency department were you in?", "Karen"], ["S", "A public hospital. Very busy. We saw about three hundred patients a day.", "Juliana"], ["P", "Three hundred? That's twice what we see on a bad day.", "Karen"], ["S", "Yes. It was intense. But it taught me to stay calm.", "Juliana"], ["P", "I bet. Listen, I can't hire you before you're licensed, you know that.", "Karen"], ["S", "Of course. I'm not asking for a job today. I just want to understand how emergency departments work here, because I know it's different.", "Juliana"], ["P", "That's a smart question. Honestly, the biggest difference is probably documentation. We chart everything. And the scope of practice can be different from what you're used to.", "Karen"], ["S", "That's what I was worried about. Is there a way to learn about that before I start?", "Juliana"], ["P", "Some hospitals have bridging programs. And you could volunteer with us in the meantime. It's not nursing, but you'd see how the department works.", "Karen"], ["S", "I'd love that.", "Juliana"], ["P", "Leave me your email. I'll send you the volunteer link.", "Karen"]], "words": 249, "kind": "story", "scene": "March, a health-care career fair at the Vancouver Convention Centre.", "F": "Juliana uses her new introduction from script 12, and it works. \"Where are you in the process?\" asks how far along she is. \"Chart\" means write medical records. \"Scope of practice\" is what a nurse is legally allowed to do. Notice Juliana says \"I'm not asking for a job today,\" which makes Karen more helpful.", "V": "", "t": [[2.0, 2.47], [2.82, 5.26], [5.86, 6.63], [6.98, 8.94], [9.29, 10.42], [11.02, 12.79], [13.14, 16.5], [16.85, 20.03], [20.63, 21.82], [22.17, 23.83], [24.43, 28.42], [29.02, 30.22], [30.57, 31.75], [32.35, 33.12], [33.47, 36.86], [37.46, 38.06], [38.41, 39.63], [39.98, 42.37], [42.97, 44.08], [44.43, 45.26], [45.61, 47.87], [48.47, 49.52], [49.87, 51.89], [52.49, 53.02], [53.37, 54.3], [54.65, 56.12], [56.72, 57.8], [58.15, 61.18], [61.78, 62.51], [62.86, 64.67], [65.02, 70.48], [71.08, 72.55], [72.9, 76.03], [76.38, 77.71], [78.06, 80.87], [81.47, 82.97], [83.32, 85.96], [86.56, 88.87], [89.22, 91.52], [91.87, 94.65], [95.25, 96.1], [96.7, 98.04], [98.39, 100.2]], "R": [["Someone asks if you're working in your field yet.", "Karen", "Are you a nurse here?", "I'm a registered nurse in Brazil, and I'm completing my Canadian licensing process now. I'm writing the exam in May."], ["Someone explains they can't hire you yet.", "Karen", "I can't hire you before you're licensed.", "Of course. I'd just love to learn how emergency departments work here."]]}, {"num": 15, "title": "Twenty Seconds in an Elevator", "lines": [["S", "Okay, okay. I'm going up to the fourteenth floor for the marketing panel. Twenty seconds. I can do twenty seconds.", "Camila"], ["P", "Are you talking to me or to yourself?", "Thiago"], ["S", "To myself. Thiago! What are you doing here?", "Camila"], ["P", "Job interview. Tenth floor. Wish me luck.", "Thiago"], ["S", "Good luck! You'll be great. Which company?", "Camila"], ["P", "A startup that makes software for ferries. Very Vancouver.", "Thiago"], ["S", "Very Vancouver. Okay, the elevator's here.", "Camila"], ["P", "Hold the door! Thank you. Oh, Camila! Hi.", "Grace"], ["S", "Grace! Hi. Are you going to the panel?", "Camila"], ["P", "I'm speaking at the panel, actually. Fourteen, please.", "Grace"], ["S", "Oh, wow. I didn't know.", "Camila"], ["P", "Last-minute replacement. I'm terrified. Don't tell anyone.", "Grace"], ["S", "You'll be great. I saw you present at the open house.", "Camila"], ["P", "You're kind. So, any news on your side?", "Grace"], ["S", "A little. I've had two interviews for brand roles, and I've been doing freelance work for a café chain. I redesigned their loyalty program, and repeat visits went up twelve percent in two months.", "Camila"], ["P", "Twelve percent in two months? That's fast.", "Grace"], ["S", "It's a small chain, but yes. I'm really happy with it.", "Camila"], ["P", "This is my floor. Good luck, Grace.", "Thiago"], ["P", "You too. Camila, walk with me when we get out. There's someone on the panel you should meet.", "Grace"], ["S", "Really?", "Camila"], ["P", "Really. She's looking for someone who knows loyalty programs. I'll introduce you after.", "Grace"], ["S", "Thank you, Grace. Seriously.", "Camila"], ["P", "Don't thank me yet. Thank me if she hires you.", "Grace"]], "words": 225, "kind": "story", "scene": "April, the Bentall Centre downtown, a lobby full of office workers.", "F": "Camila practises a twenty-second update and uses it immediately: what she's doing now and one result with a number. \"Hold the door!\" is common in elevators. \"Last-minute replacement\" means Grace was asked to speak at the last moment. \"Walk with me\" is an invitation to keep talking.", "V": "", "t": [[2.0, 3.24], [3.59, 6.65], [7.0, 8.15], [8.5, 10.1], [10.7, 12.51], [13.11, 14.16], [14.51, 15.38], [15.73, 17.08], [17.68, 18.61], [18.96, 19.74], [20.09, 20.91], [21.51, 22.33], [22.68, 23.75], [24.1, 25.16], [25.76, 27.79], [28.14, 29.1], [29.7, 30.94], [31.29, 33.02], [33.62, 34.74], [35.09, 35.91], [36.26, 37.49], [37.84, 38.5], [39.1, 39.83], [40.18, 40.87], [41.22, 42.79], [43.39, 45.53], [45.88, 47.31], [47.91, 48.88], [49.23, 50.26], [50.86, 52.6], [52.95, 54.27], [54.62, 56.05], [56.65, 57.72], [58.07, 60.38], [60.98, 62.05], [62.4, 64.3], [64.9, 65.68], [66.03, 70.98], [71.33, 76.8], [77.4, 79.25], [79.6, 80.62], [81.22, 82.99], [83.34, 84.89], [85.49, 86.49], [86.84, 87.83], [88.43, 89.29], [89.64, 91.82], [92.17, 94.42], [95.02, 95.77], [96.37, 97.08], [97.43, 100.46], [100.81, 102.52], [103.12, 104.32], [104.67, 105.61], [106.21, 107.6], [107.95, 109.56]], "R": [["Someone you know asks for news in the elevator.", "Grace", "So, any news on your side?", "A little! I've been doing freelance work for a café chain, and repeat visits went up twelve percent in two months."], ["A friend tells you they're nervous about speaking.", "Grace", "I'm speaking at the panel, and I'm terrified.", "You'll be great. I saw your presentation at the open house, and it was really clear."]]}, {"num": 16, "title": "\"Open to Anything\"", "lines": [["P", "Hi, is this Ana? It's Sarah Whitfield from Peakline Talent. We met at Dev's meetup in October.", "Sarah"], ["S", "Sarah, hi! Yes, of course. The recruiter who never forgets names.", "Ana"], ["P", "Ha! You remembered. Do you have five minutes?", "Sarah"], ["S", "Yes, of course.", "Ana"], ["P", "Great. I'm looking at your LinkedIn, and I wanted to understand what you're looking for. What kind of role?", "Sarah"], ["S", "Honestly, I'm open to anything. Project management, project coordination, operations. Anything where I can use my experience.", "Ana"], ["P", "Okay. I'm going to be blunt with you, because I think it'll help. \"Open to anything\" makes my job really hard.", "Sarah"], ["S", "Oh. Why?", "Ana"], ["P", "Because I can't sell \"anything\" to a client. When a company calls me, they want a specific person for a specific problem. If you're open to everything, I don't know where to put you.", "Sarah"], ["S", "I understand. I think I say that because I'm scared to miss an opportunity.", "Ana"], ["P", "Totally normal. But let me ask it another way. If you could choose any job tomorrow, what would it be?", "Sarah"], ["S", "Project manager on a transit or infrastructure project. Public sector, or a company that works with the public sector.", "Ana"], ["P", "See? That I can work with. And what level?", "Sarah"], ["S", "I was a senior project manager in São Paulo. But here, maybe one level lower at first. I need Canadian experience.", "Ana"], ["P", "That's realistic. Okay, I have a client in that space. I can't promise anything, but can I share your profile with them?", "Sarah"], ["S", "Yes, please.", "Ana"], ["P", "Great. Update your LinkedIn headline first. Right now it says \"Seeking opportunities.\"", "Sarah"], ["S", "I'll change it today.", "Ana"]], "words": 255, "kind": "story", "scene": "April, a phone call. Sarah calls Ana after they connected on LinkedIn.", "F": "Sarah is blunt, which is less common in Canada, but she explains why: recruiters need a specific target. \"I'm going to be blunt\" warns that honest criticism is coming. \"That I can work with\" means \"now I can help you.\" Ana narrows her goal to a role, a sector and a level.", "V": "", "t": [[2.0, 3.45], [3.8, 6.37], [6.72, 9.09], [9.69, 10.44], [10.79, 11.77], [12.12, 14.1], [14.7, 15.43], [15.78, 16.93], [17.28, 18.75], [19.35, 20.33], [20.93, 21.81], [22.16, 26.3], [26.65, 27.82], [28.42, 30.25], [30.6, 34.16], [34.51, 36.79], [37.39, 38.28], [38.63, 41.66], [42.01, 45.04], [45.64, 46.07], [46.42, 46.94], [47.54, 50.25], [50.6, 54.94], [55.29, 58.13], [58.73, 59.66], [60.01, 63.24], [63.84, 65.05], [65.4, 67.41], [67.76, 70.51], [71.11, 74.82], [75.17, 78.58], [79.18, 79.91], [80.26, 81.67], [82.02, 83.18], [83.78, 86.43], [86.78, 89.16], [89.51, 91.31], [91.91, 93.33], [93.68, 96.01], [96.36, 99.82], [100.42, 101.28], [101.88, 102.76], [103.11, 105.55], [105.9, 108.48], [109.08, 110.19]], "R": [["A recruiter asks what kind of role you want.", "Sarah", "What kind of role are you looking for?", "A project manager role on transit or infrastructure projects, ideally in the public sector or with a company that works with it."], ["A recruiter gives you direct criticism.", "Sarah", "I'm going to be blunt. \"Open to anything\" makes my job really hard.", "That makes sense. Let me be more specific: I'm looking for project management roles on infrastructure projects."]]}]}, {"part": 3, "title": "Coffee Chats", "desc": "Asking for time, asking good questions, who pays, and saying thank you.", "scripts": [{"num": 17, "title": "Asking for Twenty Minutes", "lines": [["P", "Michael Chen speaking.", "Michael"], ["S", "Hi, Michael. It's Ana Ribeiro. We met at Dev's meetup in October. I sent you an email on Monday.", "Ana"], ["P", "Ana! Yes. Sorry, I saw it and then I disappeared into a budget meeting for two days. How are you?", "Michael"], ["S", "I'm well, thank you. I know it's been a few months since we met. I wasn't ready before, but now I have good questions. I won't keep you long. I was wondering if you'd have twenty minutes for a coffee sometime in the next few weeks.", "Ana"], ["P", "Sure. What would you like to talk about?", "Michael"], ["S", "Mostly how public infrastructure projects work here. In São Paulo, the government and the contractors work together in a very different way, and I want to understand the system before I apply anywhere.", "Ana"], ["P", "That's a good reason. Honestly, half my job is explaining the system to people who've lived here their whole lives.", "Michael"], ["S", "Then maybe I'm not so far behind.", "Ana"], ["P", "Ha! Maybe not. Okay, let me look at my calendar. Next week is impossible. The week after... how's Thursday the twenty-third? Eight a.m.?", "Michael"], ["S", "Eight a.m. is perfect.", "Ana"], ["P", "There's a café on Mainland Street in Yaletown. I'll send you the address. Fair warning, I'll have to leave by eight thirty, because I've got a site visit.", "Michael"], ["S", "That's completely fine. I'll be there at eight.", "Ana"], ["P", "I'll be there at eight oh five. I'm always five minutes late. It's my only flaw.", "Michael"], ["S", "I'll remember that.", "Ana"], ["P", "Oh, and Ana? You don't need to bring a resume. Just bring your questions.", "Michael"], ["S", "Okay. I'll bring good questions.", "Ana"], ["P", "Bring one bad one too. Those are usually the most interesting.", "Michael"]], "words": 268, "kind": "story", "scene": "April, a phone call. Ana calls Michael two days after emailing him.", "F": "Ana asks for a specific, small amount of time (\"twenty minutes\") and gives a clear reason. That makes it easy to say yes. \"I won't keep you long\" is a polite way to start a phone request. \"Fair warning\" means \"I'm telling you now so you're not surprised.\"", "V": "", "t": [[2.0, 3.39], [3.99, 4.81], [5.16, 6.25], [6.6, 8.48], [8.83, 10.49], [11.09, 11.68], [12.03, 12.66], [13.01, 17.99], [18.34, 19.21], [19.81, 20.85], [21.2, 23.12], [23.47, 26.51], [26.86, 28.03], [28.38, 33.18], [33.78, 34.37], [34.72, 36.38], [36.98, 39.96], [40.31, 49.03], [49.63, 50.86], [51.21, 57.3], [57.9, 59.88], [60.48, 61.02], [61.37, 62.33], [62.68, 64.69], [65.04, 66.68], [67.03, 68.16], [68.51, 70.27], [70.62, 71.21], [71.81, 73.58], [74.18, 76.96], [77.31, 78.66], [79.01, 83.73], [84.33, 85.65], [86.0, 87.09], [87.69, 89.43], [89.78, 91.6], [91.95, 93.29], [93.89, 94.97], [95.57, 96.5], [96.85, 98.89], [99.24, 100.67], [101.27, 101.87], [102.22, 103.55], [104.15, 105.55], [105.9, 108.26]], "R": [["You call someone to ask for a short meeting.", "Michael", "Sure. What would you like to talk about?", "I'd love to understand how public infrastructure projects work here, before I start applying."], ["The person tells you they'll have to leave early.", "Michael", "Fair warning, I'll have to leave by eight thirty.", "That's completely fine. Twenty minutes is all I need."]]}, {"num": 18, "title": "The First Coffee Chat", "lines": [["P", "Five minutes late. As promised.", "Michael"], ["S", "Right on time, then. Good morning.", "Ana"], ["P", "Good morning. Did you order? Let me get these. No, I insist. You can buy the next
